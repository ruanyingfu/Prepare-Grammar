ừ/cụm từ sở hữu trước dạng so sánh nhất."}, {"type": "example", "text": "The fastest runner in our school is Amy."}, {"type": "example", "text": "Amy is the school’s most successful runner."}, {"type": "example", "text": "Game shows are my least favourite TV programmes."}]}, {"unit": 9, "title": "Hiện tại tiếp diễn cho sự sắp xếp chắc chắn", "english": "Future forms; future continuous", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn cho sự sắp xếp chắc chắn trong tương lai, thường nêu thời gian."}, {"type": "example", "text": "Charlie is leaving on Tuesday."}, {"type": "example", "text": "What are you doing in the holidays?"}]}, {"unit": 9, "title": "Will: dự đoán, đề nghị và lời hứa", "english": "Future forms; future continuous", "blocks": [{"type": "text", "text": "Dùng will cho dự đoán chung về tương lai; dùng cho lời đề nghị giúp đỡ hoặc lời hứa liên quan đến tương lai. Won’t = will not."}, {"type": "example", "text": "The price of phones will fall."}, {"type": "example", "text": "Smart watches won’t do everything laptops can do."}, {"type": "example", "text": "I’ll help you set up the new equipment."}]}, {"unit": 9, "title": "Going to: kế hoạch và ý định", "english": "Future forms; future continuous", "blocks": [{"type": "text", "text": "Dùng going to cho kế hoạch cá nhân trong tương lai, tương tự cách dùng hiện tại tiếp diễn; cũng dùng cho ý định chắc chắn."}, {"type": "example", "text": "Charlie is going to leave soon."}, {"type": "example", "text": "What are you going to do after school?"}, {"type": "example", "text": "We’re going to drive to the south coast."}]}, {"unit": 9, "title": "Tương lai tiếp diễn: cấu trúc", "english": "Future forms; future continuous", "blocks": [{"type": "formula", "text": "will/won’t + be + động từ -ing"}, {"type": "example", "text": "I’ll be working."}, {"type": "example", "text": "He won’t be playing."}, {"type": "example", "text": "Will you be living ...?"}]}, {"unit": 9, "title": "Tương lai tiếp diễn: cách dùng", "english": "Future forms; future continuous", "blocks": [{"type": "text", "text": "Dùng để nói về việc chắc chắn sẽ đang diễn ra tại một thời điểm cụ thể trong tương lai."}, {"type": "example", "text": "I’ll be working for my dad next year."}, {"type": "example", "text": "He won’t be playing tennis tomorrow morning."}, {"type": "example", "text": "Will you be working all weekend?"}]}, {"unit": 10, "title": "Điều kiện loại 0: cấu trúc", "english": "Conditional sentences", "blocks": [{"type": "text", "text": "Dùng hiện tại ở cả hai mệnh đề. Khi mệnh đề if đứng đầu, dùng dấu phẩy để ngăn với mệnh đề chính; khi mệnh đề if đứng sau, không cần dấu phẩy trong mẫu này."}, {"type": "formula", "text": "If + hiện tại, hiện tại. / Hiện tại + if + hiện tại."}, {"type": "example", "text": "If a lioness has cubs to protect, she is more dangerous."}, {"type": "example", "text": "A lioness is more dangerous if she has cubs to protect."}]}, {"unit": 10, "title": "Điều kiện loại 0: tình huống thực tế", "english": "Conditional sentences", "blocks": [{"type": "text", "text": "Dùng để mô tả sự việc hoặc tình huống có thật, thực tế xảy ra. If thường có nghĩa tương tự when trong loại câu này."}, {"type": "example", "text": "Wild animals aren’t dangerous if people behave sensibly."}, {"type": "example", "text": "A lioness is more dangerous when she has cubs to protect."}]}, {"unit": 10, "title": "Điều kiện loại 1: cấu trúc", "english": "Conditional sentences", "blocks": [{"type": "formula", "text": "If + hiện tại, will/won’t + động từ nguyên mẫu."}, {"type": "formula", "text": "Will/won’t + động từ nguyên mẫu + if + hiện tại."}, {"type": "example", "text": "If she thinks her cubs are in danger, a lioness will attack."}, {"type": "example", "text": "A lioness will attack if she thinks her cubs are in danger."}]}, {"unit": 10, "title": "Điều kiện loại 1: khả năng có thể xảy ra", "english": "Conditional sentences", "blocks": [{"type": "text", "text": "Dùng để hình dung điều có khả năng xảy ra trong tương lai khi điều kiện được đáp ứng."}, {"type": "example", "text": "If the forests disappear, the weather will be more extreme."}]}, {"unit": 10, "title": "Điều kiện loại 2: cấu trúc", "english": "Conditional sentences", "blocks": [{"type": "formula", "text": "If + quá khứ, would/wouldn’t + động từ nguyên mẫu."}, {"type": "formula", "text": "Would/wouldn’t + động từ nguyên mẫu + if + quá khứ."}, {"type": "example", "text": "If politicians cared about the rainforests, they’d (would) do more to protect them."}, {"type": "example", "text": "If people cared about their planet, they wouldn’t pollute the sea."}, {"type": "example", "text": "Politicians would do more to protect the rainforests if they cared about them."}]}, {"unit": 10, "title": "Điều kiện loại 2: cấu trúc", "english": "Conditional sentences", "blocks": [{"type": "example", "text": "There wouldn’t be any apples if bees didn’t exist."}]}, {"unit": 10, "title": "Điều kiện loại 2: giả định hiện tại hoặc tương lai", "english": "Conditional sentences", "blocks": [{"type": "text", "text": "Dùng để nói về điều khó xảy ra hoặc tưởng tượng ở hiện tại/tương lai. Dạng quá khứ ở đây diễn tả giả định, không đơn thuần là thời gian quá khứ."}, {"type": "example", "text": "If I had a garden, I’d grow lots of fruit."}, {"type": "meaning", "text": "Tôi không có vườn nên không trồng trái cây."}, {"type": "example", "text": "We wouldn’t eat honey if we didn’t like it."}, {"type": "meaning", "text": "Thực tế chúng tôi thích mật ong nên có ăn mật ong."}]}, {"unit": 10, "title": "Unless = if ... not", "english": "Conditional sentences", "blocks": [{"type": "text", "text": "Có thể dùng unless thay if ... not trong câu điều kiện. Chú ý nghĩa phủ định đã nằm trong unless."}, {"type": "example", "text": "We wouldn’t eat honey unless we liked it."}, {"type": "meaning", "text": "Unless we liked it tương đương if we didn’t like it trong câu này."}, {"type": "example", "text": "Unless we do something to protect the rainforests soon, they will all disappear."}, {"type": "meaning", "text": "Tương đương If we don’t do something soon ...: nếu không sớm hành động, rừng mưa sẽ biến mất."}]}, {"unit": 11, "title": "Cấu trúc", "english": "Past perfect", "blocks": [{"type": "formula", "text": "had + quá khứ phân từ"}]}, {"unit": 11, "title": "Cấu trúc", "english": "Past perfect", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định", "Câu hỏi"], ["had looked", "hadn’t looked", "had he looked?"], ["had written", "hadn’t written", "had he written?"]]}]}, {"unit": 11, "title": "Hành động xảy ra trước một mốc quá khứ", "english": "Past perfect", "blocks": [{"type": "text", "text": "Dùng quá khứ hoàn thành cho hành động hoặc sự kiện xảy ra trước một hành động/sự kiện khác trong quá khứ. Thì này thường làm rõ thứ tự các sự kiện và cung cấp bối cảnh; hành động quá khứ chính thường dùng quá khứ đơn."}, {"type": "example", "text": "I’d never been to a live concert so I was really excited when we went to one last weekend."}, {"type": "meaning", "text": "Chưa từng đi xem hòa nhạc là tình trạng trước chuyến đi cuối tuần trước; chuyến đi là sự kiện quá khứ chính."}]}, {"unit": 11, "title": "Before và after", "english": "Past perfect", "blocks": [{"type": "text", "text": "Thường dùng before hoặc after trong câu có quá khứ hoàn thành để làm rõ trình tự."}, {"type": "example", "text": "I’d seen the film before but I enjoyed seeing it again."}, {"type": "example", "text": "After we’d sung Happy Birthday, my sister opened her presents."}]}, {"unit": 12, "title": "Should và shouldn’t: lời khuyên", "english": "Modals: obligation, necessity and advice (2)", "blocks": [{"type": "text", "text": "Dùng should/shouldn’t + động từ nguyên mẫu để khuyên ai đó, hoặc khi người nói tin rằng một việc là điều đúng nên làm."}, {"type": "example", "text": "You should arrive at the airport early."}, {"type": "example", "text": "You shouldn’t take too much hand luggage."}]}, {"unit": 12, "title": "Need to: điều quan trọng cần làm", "english": "Modals: obligation, necessity and advice (2)", "blocks": [{"type": "text", "text": "Dùng need to + động từ khi cho rằng việc đó quan trọng nhưng không phải quy tắc hay luật."}, {"type": "example", "text": "You need to keep your passport in a safe place."}]}, {"unit": 12, "title": "Have to: yêu cầu do quy tắc/luật", "english": "Modals: obligation, necessity and advice (2)", "blocks": [{"type": "text", "text": "Trong cách phân biệt của bài, dùng have to + động từ khi một việc cần thiết vì quy tắc hoặc luật yêu cầu."}, {"type": "example", "text": "You have to get a visa."}, {"type": "example", "text": "You have to show your passport when you enter the country."}]}, {"unit": 12, "title": "Không cần thiết: ba cách diễn đạt", "english": "Modals: obligation, necessity and advice (2)", "blocks": [{"type": "text", "text": "Khi một việc không cần thiết, có thể dùng don’t have to + động từ; needn’t + động từ; hoặc don’t need to + động từ. Sau needn’t không có to."}, {"type": "example", "text": "You don’t have to pay for your food on this flight."}, {"type": "example", "text": "You needn’t take an umbrella – it won’t rain."}, {"type": "example", "text": "You don’t need to get to the airport early."}]}, {"unit": 13, "title": "Cấu trúc chung", "english": "The passive", "blocks": [{"type": "formula", "text": "be + quá khứ phân từ"}, {"type": "text", "text": "Muốn nói hiện tại hay quá khứ, thay đổi dạng của be. Chủ ngữ của câu bị động là người/vật chịu tác động hoặc được nhấn mạnh."}]}, {"unit": 13, "title": "Bị động hiện tại đơn", "english": "The passive", "blocks": [{"type": "formula", "text": "is/are + quá khứ phân từ"}, {"type": "example", "text": "Millions of photos are posted online every day."}, {"type": "example", "text": "These toys aren’t sold in supermarkets."}]}, {"unit": 13, "title": "Bị động quá khứ đơn", "english": "The passive", "blocks": [{"type": "formula", "text": "was/were + quá khứ phân từ"}, {"type": "example", "text": "This picture was drawn to illustrate a story."}, {"type": "example", "text": "The artists weren’t told what to paint."}]}, {"unit": 13, "title": "Bị động với động từ khuyết thiếu", "english": "The passive", "blocks": [{"type": "text", "text": "Các động từ như can, could, must, may, might thường dùng trong cấu trúc bị động. Giữ be ở dạng nguyên mẫu."}, {"type": "formula", "text": "động từ khuyết thiếu + be + quá khứ phân từ"}, {"type": "example", "text": "The writer of the poem can’t be identified."}, {"type": "example", "text": "The students may be allowed to film the show."}, {"type": "example", "text": "Tickets must be booked in advance."}]}, {"unit": 13, "title": "Tác nhân thực hiện hành động (agent)", "english": "The passive", "blocks": [{"type": "text", "text": "Agent là người/vật thực hiện hành động. Tác nhân của động từ bị động chính là chủ ngữ của câu chủ động tương ứng."}, {"type": "example", "text": "Someone sent Sam a letter."}, {"type": "meaning", "text": "Someone vừa là chủ ngữ vừa là tác nhân thực hiện hành động."}, {"type": "example", "text": "Sam was sent a letter."}, {"type": "meaning", "text": "Sam là chủ ngữ nhưng không phải tác nhân gửi thư."}]}, {"unit": 13, "title": "Khi không biết tác nhân", "english": "The passive", "blocks": [{"type": "text", "text": "Thường dùng bị động khi không biết ai thực hiện/đã thực hiện hành động."}, {"type": "example", "text": "My bag was taken while I was sunbathing."}, {"type": "example", "text": "A lot of clothes are made in small factories."}]}, {"unit": 13, "title": "Khi tác nhân không quan trọng", "english": "The passive", "blocks": [{"type": "example", "text": "My new phone was delivered yesterday."}, {"type": "example", "text": "This room must be cleaned immediately."}]}, {"unit": 13, "title": "Khi muốn nhấn mạnh chủ ngữ bị động", "english": "The passive", "blocks": [{"type": "example", "text": "I was asked to sing at the end-of-term concert!"}, {"type": "meaning", "text": "Người được mời hát là tôi, không phải người khác."}, {"type": "example", "text": "Your brother must be invited to the party."}, {"type": "meaning", "text": "Trọng tâm là anh/em trai của bạn."}]}, {"unit": 13, "title": "By + tác nhân", "english": "The passive", "blocks": [{"type": "text", "text": "Dùng by nếu cần nói rõ ai thực hiện hành động trong câu bị động."}, {"type": "example", "text": "My friends gave me lots of presents on my birthday."}, {"type": "example", "text": "I was given lots of presents by my friends on my birthday."}, {"type": "example", "text": "The photographer didn’t pay that model very much."}, {"type": "example", "text": "That model wasn’t paid very much by the photographer."}]}, {"unit": 14, "title": "Mệnh đề quan hệ xác định", "english": "Relative clauses", "blocks": [{"type": "text", "text": "Mệnh đề quan hệ xác định cung cấp thông tin thiết yếu để xác định người, vật hoặc nơi đang nói tới. Không tách nó khỏi phần còn lại bằng dấu phẩy."}, {"type": "example", "text": "The cakes that my brother makes are really good."}, {"type": "meaning", "text": "Cần phần that my brother makes để biết người nói đang nhắc tới những chiếc bánh nào."}]}, {"unit": 14, "title": "Từ mở đầu mệnh đề xác định", "english": "Relative clauses", "blocks": [{"type": "table", "rows": [["Từ", "Chỉ/diễn tả"], ["who", "Người"], ["which", "Vật"], ["that", "Người hoặc vật"], ["whose", "Quan hệ sở hữu"], ["where", "Nơi chốn"]]}]}, {"unit": 14, "title": "Từ mở đầu mệnh đề xác định", "english": "Relative clauses", "blocks": [{"type": "example", "text": "There’s the girl who won the cookery competition."}, {"type": "example", "text": "She showed me the recipe which she invented."}, {"type": "example", "text": "I can email the recipe that I told you about."}, {"type": "example", "text": "That’s the boy whose mum designs sunglasses."}, {"type": "example", "text": "This is the place where I bought my book."}]}, {"unit": 14, "title": "Chủ ngữ hoặc tân ngữ trong mệnh đề quan hệ", "english": "Relative clauses", "blocks": [{"type": "text", "text": "Who, which, that có thể làm chủ ngữ hoặc tân ngữ của mệnh đề quan hệ. Xác định vai trò của chúng để biết có được lược bỏ hay không."}, {"type": "example", "text": "The woman who/that runs the café is very friendly."}, {"type": "meaning", "text": "Who/that là chủ ngữ của runs."}, {"type": "example", "text": "There’s the chef who/that I told you about."}, {"type": "meaning", "text": "Who/that là tân ngữ; I là chủ ngữ của told."}]}, {"unit": 14, "title": "Chủ ngữ hoặc tân ngữ trong mệnh đề quan hệ", "english": "Relative clauses", "blocks": [{"type": "example", "text": "He showed me a recipe which/that he often uses."}, {"type": "meaning", "text": "Which/that là tân ngữ của uses."}]}, {"unit": 14, "title": "Lược bỏ khi làm tân ngữ", "english": "Relative clauses", "blocks": [{"type": "text", "text": "Có thể lược bỏ who, which hoặc that nếu nó làm tân ngữ trong mệnh đề quan hệ xác định. Phần trong ngoặc có thể bỏ."}, {"type": "example", "text": "The cakes (which/that) my brother makes are really good."}, {"type": "example", "text": "There’s the chef (who) I told you about."}, {"type": "example", "text": "He showed me a recipe (which/that) he often uses."}, {"type": "example", "text": "I can email the recipe (which/that) I told you about."}]}, {"unit": 14, "title": "Không lược bỏ khi làm chủ ngữ", "english": "Relative clauses", "blocks": [{"type": "text", "text": "Không thể bỏ who, which hoặc that khi nó là chủ ngữ của mệnh đề quan hệ."}, {"type": "example", "text": "The woman who runs the café is very friendly."}]}, {"unit": 14, "title": "Mệnh đề quan hệ không xác định", "english": "Relative clauses", "blocks": [{"type": "text", "text": "Mệnh đề quan hệ không xác định bổ sung thông tin về người/vật đã được xác định. Luôn tách nó khỏi phần còn lại bằng dấu phẩy."}, {"type": "example", "text": "The cakes on this plate, which my brother helped to make, are really good."}, {"type": "meaning", "text": "Bỏ which my brother helped to make, ta vẫn biết đó là các chiếc bánh trên đĩa này."}]}, {"unit": 14, "title": "Từ mở đầu và điều không được làm", "english": "Relative clauses", "blocks": [{"type": "text", "text": "Mệnh đề không xác định dùng who (người), where (nơi), which (vật) hoặc whose (sở hữu); không dùng that. Không bao giờ lược bỏ từ quan hệ trong loại mệnh đề này."}, {"type": "example", "text": "My brother, who is an excellent cook, has written a cookbook."}, {"type": "example", "text": "The recipes, which he tested carefully, require lots of special ingredients."}, {"type": "meaning", "text": "Lỗi cần tránh: The recipes, that he tested carefully, ..."}, {"type": "example", "text": "My grandparents, whose kitchen he uses, are proud of what he’s done."}]}, {"unit": 15, "title": "A/an: lần đầu nhắc tới", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "text", "text": "Dùng a/an trước danh từ đếm được số ít khi nhắc đến một người/vật lần đầu."}, {"type": "example", "text": "I live in a flat near the city centre."}]}, {"unit": 15, "title": "A/an: nghề nghiệp/vai trò", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "text", "text": "Dùng a/an khi nói nghề nghiệp hoặc một người làm gì."}, {"type": "example", "text": "My mum’s a doctor, my dad’s an architect and my brother’s a student."}]}, {"unit": 15, "title": "The: nhắc lại hoặc duy nhất", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "text", "text": "Dùng the trước danh từ khi nhắc đến lần thứ hai, hoặc khi chỉ có một đối tượng phù hợp trong ngữ cảnh."}, {"type": "example", "text": "Our flat is near a park. The park has several tennis courts."}, {"type": "example", "text": "My brother likes swimming in the sea."}]}, {"unit": 15, "title": "The: người/vật cụ thể", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "example", "text": "The school I go to is not far away."}]}, {"unit": 15, "title": "The với tên địa lý", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "text", "text": "Dùng the với tên dãy núi và tên các quốc gia/nhà nước ở dạng số nhiều; dùng với tên sa mạc, đại dương hoặc sông."}, {"type": "example", "text": "the Urals, the United Arab Emirates"}, {"type": "example", "text": "the Sahara, the Pacific, the Amazon"}]}, {"unit": 15, "title": "Không dùng mạo từ khi nói chung", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "text", "text": "Không dùng mạo từ trước danh từ không đếm được hoặc danh từ đếm được số nhiều khi nói về chúng nói chung."}, {"type": "example", "text": "Volleyball is my favourite sport."}, {"type": "example", "text": "Teenagers are usually interested in sport."}]}, {"unit": 15, "title": "Không dùng mạo từ với nhóm tên riêng này", "english": "Articles: a/an, the and zero article", "blocks": [{"type": "text", "text": "Không dùng mạo từ với tên thành phố/thị trấn, quốc gia, châu lục; đảo riêng lẻ, ngọn núi riêng lẻ và hồ, theo các mẫu tên riêng trong bài."}, {"type": "example", "text": "New Zealand, Rome, Europe, Sicily, Mount Fuji, Lake Issyk Kul"}]}, {"unit": 16, "title": "Lùi thì khi động từ tường thuật ở quá khứ", "english": "Reported speech", "blocks": [{"type": "text", "text": "Khi động từ tường thuật như said, told, explained ở thì quá khứ, thì của động từ trong lời nói trực tiếp chuyển đổi theo bảng. That có thể xuất hiện trong câu tường thuật."}]}, {"unit": 16, "title": "Lùi thì khi động từ tường thuật ở quá khứ", "english": "Reported speech", "blocks": [{"type": "table", "rows": [["Chuyển đổi", "Lời trực tiếp", "Lời tường thuật"], ["Hiện tại đơn → quá khứ đơn", "‘I enjoy watching films.’", "He said he enjoyed watching films."], ["Hiện tại tiếp diễn → quá khứ tiếp diễn", "‘That girl is acting well.’", "He said that girl was acting well."], ["Quá khứ đơn → quá khứ hoàn thành", "‘She studied at film school.’", "He said (that) she’d (had) studied at film school."]]}]}, {"unit": 16, "title": "Lùi thì khi động từ tường thuật ở quá khứ", "english": "Reported speech", "blocks": [{"type": "table", "rows": [["Chuyển đổi", "Lời trực tiếp", "Lời tường thuật"], ["Hiện tại hoàn thành → quá khứ hoàn thành", "‘I haven’t seen her before.’", "He said he hadn’t seen her before."], ["will → would", "‘She’ll be famous one day.’", "He said she’d (would) be famous one day."], ["can → could", "‘She can sing well too.’", "He said she could sing well too."]]}]}, {"unit": 16, "title": "Các dạng không thay đổi", "english": "Reported speech", "blocks": [{"type": "text", "text": "Không đổi could, would, should, might, used to hoặc quá khứ hoàn thành khi tường thuật."}, {"type": "example", "text": "‘You could visit her website.’ → He said I could visit her website."}, {"type": "example", "text": "‘She used to be in a TV series.’ → He said she used to be in a TV series."}, {"type": "example", "text": "‘She hadn’t appeared on TV before that.’ → He said she hadn’t appeared on TV before that."}]}, {"unit": 16, "title": "Đại từ trong câu tường thuật", "english": "Reported speech", "blocks": [{"type": "text", "text": "Đại từ đôi khi cần đổi để đúng người nói, người nghe và người được nhắc tới; không đổi máy móc nếu đối tượng vẫn giữ nguyên."}, {"type": "example", "text": "‘I enjoy watching films,’ said Tom. → Tom said he enjoyed watching films."}, {"type": "example", "text": "‘You can watch a film after dinner,’ said the boys’ mum. → The boys’ mum said they could watch a film after dinner."}]}, {"unit": 16, "title": "Động từ tường thuật", "english": "Reported speech", "blocks": [{"type": "text", "text": "Có thể mở đầu bằng said, told, insisted, announced, demanded, explained, v.v. Sau told bắt buộc có tân ngữ chỉ người nghe; said không theo mẫu told + người nghe này."}, {"type": "example", "text": "She said she enjoyed acting."}, {"type": "example", "text": "She told us she enjoyed acting."}]}, {"unit": 16, "title": "Dùng that", "english": "Reported speech", "blocks": [{"type": "text", "text": "Sau động từ tường thuật thường có that."}, {"type": "example", "text": "She said that she enjoyed acting."}, {"type": "example", "text": "She told us that she enjoyed acting."}, {"type": "example", "text": "She explained that she enjoyed acting."}]}, {"unit": 16, "title": "Insisted, suggested, demanded + should", "english": "Reported speech", "blocks": [{"type": "text", "text": "Insisted, suggested và demanded có thể theo sau bằng that + chủ ngữ + should + động từ nguyên mẫu thay cho một thì quá khứ."}, {"type": "example", "text": "‘You must give us your autograph.’"}, {"type": "example", "text": "We insisted that she gave us her autograph."}, {"type": "example", "text": "We insisted that she should give us her autograph."}, {"type": "example", "text": "‘Let’s watch the film again.’ → I suggested that we should watch the film again."}]}, {"unit": 17, "title": "Trật tự câu tường thuật", "english": "Reported questions", "blocks": [{"type": "text", "text": "Trật tự trong phần câu hỏi được tường thuật giống câu khẳng định: chủ ngữ đứng trước động từ. Không giữ trật tự đảo của câu hỏi trực tiếp."}, {"type": "example", "text": "‘What’s the time?’ → She asked me what the time was."}]}, {"unit": 17, "title": "Thì, trợ động từ và đại từ", "english": "Reported questions", "blocks": [{"type": "text", "text": "Sau động từ tường thuật ở quá khứ, động từ chuyển thì giống câu tường thuật phát biểu. Đại từ cũng đổi theo ngữ cảnh như ở Unit 16."}, {"type": "text", "text": "Không giữ did/didn’t làm trợ động từ tạo câu hỏi trong phần câu hỏi tường thuật."}, {"type": "example", "text": "‘When did you get up today?’ → He asked me when I got up today."}, {"type": "meaning", "text": "Lỗi cần tránh: ... when did I get up today."}]}, {"unit": 17, "title": "Câu hỏi Yes/No: if hoặc whether", "english": "Reported questions", "blocks": [{"type": "text", "text": "Mở đầu phần tường thuật bằng if hoặc whether, sau đó là chủ ngữ + động từ."}, {"type": "example", "text": "‘Are you busy?’ → She asked if I was busy."}, {"type": "example", "text": "‘Did he send an email?’ → I asked whether he’d sent an email."}, {"type": "example", "text": "‘Do you often play video games?’ → He asked whether we often played video games."}, {"type": "example", "text": "‘Have you seen my website?’ → She asked if I’d seen her website."}]}, {"unit": 17, "title": "Câu hỏi Wh-: giữ từ để hỏi", "english": "Reported questions", "blocks": [{"type": "text", "text": "Phần câu hỏi tường thuật bắt đầu bằng cùng từ để hỏi của câu trực tiếp, rồi dùng trật tự chủ ngữ + động từ."}, {"type": "example", "text": "‘What time is it?’ → She asked what time it was."}, {"type": "example", "text": "‘When are you coming home?’ → He asked when we were coming home."}, {"type": "example", "text": "‘Where can I charge my phone?’ → He asked where he could charge his phone."}]}, {"unit": 17, "title": "Câu hỏi Wh-: giữ từ để hỏi", "english": "Reported questions", "blocks": [{"type": "example", "text": "‘Which websites have they looked at?’ → I asked which websites they’d looked at."}]}, {"unit": 17, "title": "Ask, want to know và wonder", "english": "Reported questions", "blocks": [{"type": "text", "text": "Có thể dùng ask (hỏi), want to know (muốn biết) hoặc wonder (tự hỏi/băn khoăn) để mở đầu câu hỏi tường thuật."}, {"type": "example", "text": "‘Are you busy?’ → She asked if I was busy."}, {"type": "example", "text": "‘Did he send an email?’ → I wanted to know whether he’d sent an email."}, {"type": "example", "text": "‘Do you often play video games?’ → He wondered whether we often played video games."}]}, {"unit": 17, "title": "Người nhận câu hỏi sau asked", "english": "Reported questions", "blocks": [{"type": "text", "text": "Asked đôi khi được theo sau bằng danh từ hoặc đại từ chỉ người được hỏi."}, {"type": "example", "text": "‘What time is it?’ → She asked the nurse what time it was."}, {"type": "example", "text": "‘When are you coming home?’ → He asked us when we were coming home."}, {"type": "example", "text": "‘Which websites have they looked at?’ → I asked them which websites they’d looked at."}]}, {"unit": 18, "title": "Cấu trúc", "english": "Have something done", "blocks": [{"type": "formula", "text": "một dạng của have + tân ngữ + quá khứ phân từ"}, {"type": "text", "text": "Quá khứ phân từ mô tả hành động được thực hiện. Have thay đổi theo thì/cấu trúc; tân ngữ là người/vật nhận hành động."}]}, {"unit": 18, "title": "Cấu trúc", "english": "Have something done", "blocks": [{"type": "table", "rows": [["Phần đầu câu", "Các quá khứ phân từ có thể dùng"], ["I’m going to have my hair", "coloured / cut / done."], ["We had our hair", "coloured / cut / done."], ["They’ve never had their hair", "coloured / cut / done."], ["You should have your hair", "coloured / cut / done."], ["He’ll probably have his hair", "coloured / cut / done."]]}]}, {"unit": 18, "title": "Cấu trúc", "english": "Have something done", "blocks": [{"type": "table", "rows": [["Phần đầu câu", "Các quá khứ phân từ có thể dùng"], ["She needs to have her hair", "coloured / cut / done."]]}]}, {"unit": 18, "title": "Ý nghĩa: người khác làm cho mình", "english": "Have something done", "blocks": [{"type": "text", "text": "Dùng have something done cho việc một người khác thực hiện cho chúng ta; chủ ngữ không tự thực hiện hành động đó."}, {"type": "example", "text": "We want to have our hair cut."}, {"type": "meaning", "text": "Chúng tôi muốn ai đó cắt tóc cho mình."}, {"type": "example", "text": "I’m going to have my hair done."}, {"type": "meaning", "text": "Ai đó sẽ làm tóc cho tôi."}]}, {"unit": 18, "title": "Có cần nêu người thực hiện không?", "english": "Have something done", "blocks": [{"type": "text", "text": "Thường không nói rõ người thực hiện trừ khi thông tin đó quan trọng. Có thể thêm by + người làm khi cần nhấn mạnh."}, {"type": "example", "text": "I had my hair done."}, {"type": "meaning", "text": "Ai đó, có lẽ là thợ làm tóc, đã làm tóc cho tôi."}, {"type": "example", "text": "I had my hair coloured by my mum."}, {"type": "meaning", "text": "Nhấn mạnh mẹ tôi là người nhuộm tóc cho tôi."}]}, {"unit": 18, "title": "Get trong tình huống thân mật", "english": "Have something done", "blocks": [{"type": "text", "text": "Có thể dùng get thay have trong tình huống thân mật hơn."}, {"type": "example", "text": "I’m going to have/get my bike fixed this weekend."}, {"type": "example", "text": "My parents had/got their photo taken in front of Buckingham Palace."}]}, {"unit": 19, "title": "Mệnh đề tương phản", "english": "Different types of clause", "blocks": [{"type": "text", "text": "Dùng although, whereas và while để nối các mệnh đề cung cấp thông tin khác nhau hoặc bất ngờ/trái với điều có thể dự đoán."}]}, {"unit": 19, "title": "Although và whereas: vị trí", "english": "Different types of clause", "blocks": [{"type": "text", "text": "Although và whereas có thể đứng giữa câu hoặc đứng đầu câu để nhấn mạnh hơn. Although nghĩa là “mặc dù”; whereas đối chiếu hai thực tế “trong khi”."}, {"type": "example", "text": "I enjoyed my holiday job although it was hard work."}, {"type": "example", "text": "Although my holiday job was hard work, I enjoyed it."}, {"type": "meaning", "text": "Công việc vất vả nhưng tôi vẫn thích."}, {"type": "example", "text": "I prefer to get up early, whereas most of my friends like to sleep late."}]}, {"unit": 19, "title": "Although và whereas: vị trí", "english": "Different types of clause", "blocks": [{"type": "example", "text": "Whereas most of my friends like to sleep late, I prefer to get up early."}, {"type": "meaning", "text": "Khác với phần lớn bạn bè, tôi thích dậy sớm."}]}, {"unit": 19, "title": "While: tương phản", "english": "Different types of clause", "blocks": [{"type": "text", "text": "Trong cách dùng tương phản ở bài này, while thường đứng đầu câu."}, {"type": "example", "text": "While I don’t enjoy going for a run, I know it’s good for me."}, {"type": "meaning", "text": "Tôi không thích chạy bộ nhưng biết việc đó tốt cho mình."}]}, {"unit": 19, "title": "Mục đích: in order to", "english": "Different types of clause", "blocks": [{"type": "text", "text": "Dùng cấu trúc mở đầu bằng so that hoặc in order to để giải thích mục đích trong cùng một câu. In order to có thể đứng giữa câu hoặc đầu câu để nhấn mạnh; theo sau là động từ nguyên mẫu."}, {"type": "formula", "text": "in order to + động từ nguyên mẫu"}, {"type": "example", "text": "I want to work in an office in order to learn about business software."}, {"type": "example", "text": "In order to learn about business software, I want to work in an office."}]}, {"unit": 19, "title": "Mục đích: so that", "english": "Different types of clause", "blocks": [{"type": "text", "text": "So that đứng giữa câu; theo sau là một mệnh đề có chủ ngữ và động từ, như I can learn trong ví dụ."}, {"type": "formula", "text": "so that + chủ ngữ + động từ"}, {"type": "example", "text": "I want to work in an office so that I can learn about business software."}]}, {"unit": 19, "title": "Lý do: because và as", "english": "Different types of clause", "blocks": [{"type": "text", "text": "Dùng mệnh đề bắt đầu bằng because hoặc as khi muốn giải thích lý do trong cùng câu. Cả hai có thể đứng giữa câu hoặc đầu câu để nhấn mạnh hơn. Trong cách dùng này, as cùng nghĩa với because."}, {"type": "example", "text": "I needed to get a job because I wanted to save money for my holiday."}, {"type": "example", "text": "Because I wanted to save money for my holiday, I needed to get a job."}, {"type": "example", "text": "I decided to walk to work as it was a fine morning."}]}, {"unit": 19, "title": "Lý do: because và as", "english": "Different types of clause", "blocks": [{"type": "example", "text": "As it was a fine morning, I decided to walk to work."}]}, {"unit": 20, "title": "Chủ ngữ, động từ và tân ngữ trực tiếp", "english": "Verbs with two objects", "blocks": [{"type": "text", "text": "Động từ chủ động thường có chủ ngữ và nhiều khi có tân ngữ trực tiếp. Tân ngữ trực tiếp thường là một vật/sự việc nhận hành động."}]}, {"unit": 20, "title": "Chủ ngữ, động từ và tân ngữ trực tiếp", "english": "Verbs with two objects", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Động từ", "Tân ngữ trực tiếp"], ["I", "sent", "a text."], ["Maisie", "wrote", "a note about the volleyball match."]]}]}, {"unit": 20, "title": "Hai tân ngữ: trực tiếp và gián tiếp", "english": "Verbs with two objects", "blocks": [{"type": "text", "text": "Một số động từ có cả tân ngữ trực tiếp và tân ngữ gián tiếp. Tân ngữ gián tiếp thường là một người: người nhận hoặc người được làm việc gì cho."}]}, {"unit": 20, "title": "Tân ngữ trực tiếp đứng trước", "english": "Verbs with two objects", "blocks": [{"type": "text", "text": "Khi tân ngữ trực tiếp đứng trước, dùng to hoặc for trước tân ngữ gián tiếp."}]}, {"unit": 20, "title": "Tân ngữ trực tiếp đứng trước", "english": "Verbs with two objects", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Động từ", "Tân ngữ trực tiếp", "Tân ngữ gián tiếp"], ["I", "sent", "a text", "to my aunt."], ["Maisie", "wrote", "a note about the volleyball match", "for the teacher."]]}]}, {"unit": 20, "title": "Tân ngữ gián tiếp đứng trước", "english": "Verbs with two objects", "blocks": [{"type": "text", "text": "Khi tân ngữ gián tiếp đứng trước, không dùng to hoặc for."}]}, {"unit": 20, "title": "Tân ngữ gián tiếp đứng trước", "english": "Verbs with two objects", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Động từ", "Tân ngữ gián tiếp", "Tân ngữ trực tiếp"], ["I", "sent", "my aunt", "a text."], ["Maisie", "wrote", "the teacher", "a note about the volleyball match."]]}]}, {"unit": 20, "title": "Các động từ có thể có hai tân ngữ", "english": "Verbs with two objects", "blocks": [{"type": "text", "text": "Ghi nhớ các động từ trong bài: bring, buy, cook, choose, fetch, give, lend, make, offer, owe, pay, send, show, take, teach, tell, throw, write."}]}]},units=data.units,meta=data.meta;const $=x=>document.getElementById(x);const stage=$('stage');const slides=[],unitFirst={};let current=0,isReading=false,readsize=19;const KEY='adam-prepare-5-v3';
function el(tag,cls,text){let x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function label(u){return u==='Starter'?'STARTER':'UNIT '+u}

for(const u of units){unitFirst[u.unit]=slides.length;let intro=make(u.unit,u.title,u.english,'unitcover');intro.body.append(el('p','meaning','Grammar Reference • Trang '+u.source_page));commit(intro);for(const p of data.pages.filter(p=>p.unit===u.unit)){let s=make(u.unit,p.title,p.english);s.section=p.title;p.blocks.forEach(b=>s.body.append(block(b)));commit(s)}}

 for(const u of units){let a=el('article','readunit');a.id='read-'+u.unit;a.append(el('p','eyebrow',label(u.unit)),el('h2','',u.title),el('p','sub',u.english+' • Trang '+u.source_page));for(const [si,sec] of u.sections.entries()){let s=el('section','readsection');s.id='readsec-'+u.unit+'-'+si;s.append(el('h3','',sec.title));for(const b of sec.blocks){let x=block(b);if(b.type==='table'){let wrap=el('div','scrolltable');wrap.append(x);s.append(wrap)}else s.append(x)}a.append(s)}$('reading').append(a)}
 $('reading').append(el('p','readhelp',meta.brand+' • '+meta.teacher))}

$('menu').onclick=menu;$('close').onclick=()=>$('toc').close();$('search').oninput=list;$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('unit').onchange=e=>show(e.target.value==='0'?0:unitFirst[e.target.value]);$('mode').onclick=()=>mode(!isReading);$('theme').onclick=theme;$('full').onclick=full;
