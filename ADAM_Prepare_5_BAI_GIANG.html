'use strict';const data={"meta": {"book": "Prepare 5", "title": "Ngữ pháp Prepare 5", "brand": "ADAM ENGLISH", "teacher": "Tiếng Anh Thầy Phú", "level": "", "filename": "ADAM_Prepare_5_BAI_GIANG", "source_note": "Prepare 5 • Grammar Reference • Trang 147–166"}, "units": [{"unit": 1, "title": "Danh từ đếm được, không đếm được và lượng từ", "english": "Countable and uncountable nouns; determiners", "source_page": "147", "sections": [{"title": "Danh từ đếm được", "blocks": [{"type": "text", "text": "Danh từ đếm được có dạng số ít và số nhiều. Một số danh từ có dạng số nhiều bất quy tắc, cần ghi nhớ riêng."}, {"type": "example", "text": "card → cards; phone → phones"}, {"type": "example", "text": "child → children; woman → women; person → people"}]}, {"title": "Danh từ không đếm được", "blocks": [{"type": "text", "text": "Các danh từ không đếm được trong bài được dùng như danh từ số ít: bread, information, news, homework, money, water. Có thể dùng cụm chỉ đơn vị hoặc lượng để diễn đạt lượng của chúng."}, {"type": "example", "text": "a slice of bread"}, {"type": "example", "text": "a great deal of money"}, {"type": "example", "text": "two glasses of water"}]}, {"title": "Một từ có thể thuộc cả hai nhóm", "blocks": [{"type": "text", "text": "Một số danh từ vừa đếm được vừa không đếm được, tùy ý nghĩa: một tiếng động cụ thể/tiếng ồn nói chung; một sợi tóc/tóc nói chung; một cốc cà phê/cà phê như một thức uống."}, {"type": "example", "text": "There’s a strange noise coming from that box."}, {"type": "example", "text": "Can you hear that noise?"}, {"type": "example", "text": "There’s a hair in my soup!"}, {"type": "example", "text": "I’ve got long hair."}, {"type": "example", "text": "Do you want a coffee?"}, {"type": "example", "text": "Coffee is my favourite drink."}]}, {"title": "Some, any, no, plenty of, a lot of", "blocks": [{"type": "text", "text": "Dùng some, any, no, plenty of và (not) a lot of với danh từ đếm được số nhiều và danh từ không đếm được. Trong câu khẳng định, a lot of và lots of có cùng nghĩa “nhiều”. Plenty of diễn tả nhiều, đủ dùng."}, {"type": "example", "text": "I’ve got some biscuits and some cheese."}, {"type": "example", "text": "We haven’t got any apples or any milk."}, {"type": "example", "text": "There are no oranges and the shop has no fruit juice."}, {"type": "example", "text": "I’ve bought plenty of vegetables and cheese."}, {"type": "example", "text": "There are a lot of people here today but there isn’t a lot of food."}]}, {"title": "Phân biệt any, no và some trong câu hỏi", "blocks": [{"type": "text", "text": "Dùng any trong câu hỏi và câu phủ định. Để diễn đạt “không có” trong câu có động từ khẳng định, dùng no. Không thêm một phủ định khác trước no trong mẫu này."}, {"type": "example", "text": "Is there any cake?"}, {"type": "example", "text": "There is no cake."}, {"type": "example", "text": "I don’t need any help."}, {"type": "text", "text": "Đôi khi dùng some trong câu hỏi khi mời/cung cấp điều gì và khi mong đợi câu trả lời Yes."}, {"type": "example", "text": "Would you like some tea?"}]}, {"title": "Many, much và several", "blocks": [{"type": "text", "text": "Dùng (not) many với danh từ đếm được trong câu khẳng định, phủ định và câu hỏi."}, {"type": "example", "text": "Many students enjoy meeting in this café."}, {"type": "example", "text": "We don’t have many places to meet our friends."}, {"type": "example", "text": "Do you go to many parties during the holidays?"}, {"type": "text", "text": "Dùng (not) much với danh từ không đếm được trong câu phủ định và câu hỏi. Trong cách dùng thông thường của bài, dùng a lot of cho câu khẳng định; a lot of cũng dùng được trong câu hỏi."}, {"type": "example", "text": "My brother isn’t much help around the house."}, {"type": "example", "text": "My sister always gives me a lot of help."}, {"type": "example", "text": "Do you watch much / a lot of sport on television?"}, {"type": "text", "text": "Dùng several (một vài/một số) với danh từ đếm được số nhiều."}, {"type": "example", "text": "I’ve got several friends in the States."}]}]}, {"unit": 2, "title": "Các cách dùng động từ -ing", "english": "-ing forms", "source_page": "148", "sections": [{"title": "Dạng -ing là gì?", "blocks": [{"type": "text", "text": "Dạng -ing của động từ như being, knowing, seeing, having, running đôi khi được gọi là hiện tại phân từ (present participle) hoặc danh động từ (gerund), tùy vai trò trong câu."}]}, {"title": "Sau động từ chỉ thích/không thích", "blocks": [{"type": "text", "text": "Dùng động từ -ing sau các động từ diễn tả thích hoặc không thích: like, love, enjoy, dislike, hate, not mind (không phiền), can’t stand (không chịu nổi)."}, {"type": "example", "text": "I love going out with my friends."}, {"type": "example", "text": "We all hate revising for a test."}, {"type": "example", "text": "Marie doesn’t mind helping other students with maths."}, {"type": "example", "text": "My dad hates being late for work."}, {"type": "example", "text": "My mum can’t stand doing housework."}]}, {"title": "Sau tính từ + giới từ", "blocks": [{"type": "text", "text": "Dùng -ing sau một số cụm tính từ + giới từ để nói làm việc gì tốt đến đâu hoặc cảm thấy thế nào về việc đó. Các tính từ này đi sau be."}, {"type": "table", "rows": [["Cụm từ", "Nghĩa"], ["good at / bad at", "Giỏi / kém về việc gì"], ["keen on / interested in", "Ham thích / quan tâm đến"], ["crazy about", "Rất mê"], ["afraid of", "Sợ"], ["tired of", "Chán/ngán việc gì"]]}, {"type": "example", "text": "My brother’s good at singing."}, {"type": "example", "text": "We are crazy about dancing."}, {"type": "example", "text": "I’m interested in learning languages."}, {"type": "example", "text": "Our cats are afraid of getting wet."}]}, {"title": "Dùng cụm -ing làm chủ ngữ", "blocks": [{"type": "text", "text": "Một cụm bắt đầu bằng động từ -ing có thể làm chủ ngữ của câu. Chủ ngữ thường đứng đầu câu; cả cụm chỉ một hoạt động."}, {"type": "example", "text": "Playing online games is a fun thing to do."}, {"type": "example", "text": "Keeping in touch with friends is easy, because of the internet."}]}]}, {"unit": 3, "title": "Hiện tại đơn và hiện tại tiếp diễn", "english": "Present simple and continuous", "source_page": "149", "sections": [{"title": "Hiện tại đơn: cấu trúc", "blocks": [{"type": "text", "text": "Dấu / hoặc dấu phẩy trong bảng biểu thị các lựa chọn chủ ngữ/động từ. Chọn một chủ ngữ và dạng động từ tương ứng trong câu thực tế."}, {"type": "table", "rows": [["Dạng câu", "I/You/We/They", "He/She/It"], ["Khẳng định", "play / study", "plays / studies"], ["Phủ định", "don’t play / study", "doesn’t play / study"], ["Câu hỏi", "Do I/you/we/they play / study?", "Does he/she/it play / study?"]]}]}, {"title": "Việc thường xuyên và thói quen", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn cho việc ta làm đều đặn hoặc điều thường xảy ra."}, {"type": "example", "text": "Most evenings, we play video games after dinner."}, {"type": "example", "text": "My sister doesn’t get home from school till four o’clock."}, {"type": "example", "text": "What time do you start school?"}, {"type": "example", "text": "Our teacher usually helps us with grammar."}]}, {"title": "Sự thật, hệ thống và quá trình", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn cho sự thật hoặc điều nhìn chung đúng; dùng để mô tả các hệ thống và quá trình."}, {"type": "example", "text": "My brother doesn’t live near us."}, {"type": "example", "text": "Swimming helps you keep fit."}, {"type": "example", "text": "The Earth goes around the sun."}, {"type": "example", "text": "Water freezes when it gets cold."}]}, {"title": "Động từ trạng thái", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn với động từ trạng thái, diễn tả điều ta thích, nghĩ và cảm thấy. Những động từ này thường không dùng ở dạng tiếp diễn: believe, dislike, hate, know, like, love, prefer, remember, think, understand, want, wish."}, {"type": "example", "text": "Sam thinks this is the best café in town."}, {"type": "example", "text": "Jonah doesn’t know where his phone is."}, {"type": "example", "text": "I remember my first ever holiday."}]}, {"title": "Hiện tại tiếp diễn: cấu trúc", "blocks": [{"type": "formula", "text": "am/is/are + động từ -ing"}, {"type": "table", "rows": [["Dạng câu", "I", "You/We/They", "He/She/It"], ["Khẳng định", "I’m (am) watching / running.", "You/We/They’re (are) watching / running.", "He/She/It’s (is) watching / running."], ["Phủ định", "I’m not (am not) watching / running.", "You/We/They aren’t (’re not / are not) watching / running.", "He/She/It isn’t (’s not / is not) watching / running."], ["Câu hỏi", "Am I watching / running?", "Are you/we/they watching / running?", "Is he/she/it watching / running?"]]}]}, {"title": "Hành động hiện tại và kế hoạch đã sắp xếp", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn cho việc đang xảy ra ngay bây giờ."}, {"type": "example", "text": "We’re sitting on the train at the moment."}, {"type": "meaning", "text": "At the moment = ngay lúc này."}, {"type": "text", "text": "Dùng cho kế hoạch, sự sắp xếp trong tương lai mà ta đã chắc chắn."}, {"type": "example", "text": "I’m meeting some friends after school."}, {"type": "meaning", "text": "Cuộc gặp đã được sắp xếp từ trước."}]}]}, {"unit": 4, "title": "Quá khứ đơn và used to", "english": "Past simple; used to", "source_page": "150", "sections": [{"title": "Tạo dạng quá khứ đơn", "blocks": [{"type": "text", "text": "Thông thường thêm -ed vào động từ nguyên mẫu để tạo quá khứ đơn. Nhiều động từ thông dụng bất quy tắc không có đuôi -ed."}, {"type": "example", "text": "open → opened"}, {"type": "example", "text": "break → broke; feel → felt; put → put; rise → rose"}, {"type": "example", "text": "run → ran; say → said; take → took; think → thought"}, {"type": "text", "text": "Phủ định và câu hỏi dùng didn’t (did not) và did + động từ nguyên mẫu."}, {"type": "example", "text": "I didn’t open the window."}, {"type": "example", "text": "Did she lock the car?"}, {"type": "text", "text": "Be có hai dạng quá khứ: was/wasn’t và were/weren’t."}, {"type": "example", "text": "I wasn’t in school yesterday."}, {"type": "example", "text": "Were you late today?"}]}, {"title": "Hành động/sự kiện đã hoàn tất", "blocks": [{"type": "text", "text": "Dùng quá khứ đơn cho một hành động hoặc sự kiện đơn lẻ đã kết thúc trong quá khứ."}, {"type": "example", "text": "I grew up in California."}, {"type": "example", "text": "I didn’t learn to drive there."}, {"type": "example", "text": "Did your mum work in the film studios?"}]}, {"title": "Sự việc ở một thời điểm quá khứ cụ thể", "blocks": [{"type": "example", "text": "I went to a football match last night."}, {"type": "example", "text": "My friends didn’t send me a card on my birthday."}, {"type": "example", "text": "Did you find your phone when you went home?"}]}, {"title": "Việc lặp lại trong quá khứ", "blocks": [{"type": "text", "text": "Quá khứ đơn cũng diễn tả những việc xảy ra thường xuyên trong quá khứ."}, {"type": "example", "text": "I went to my last school by bike every day."}, {"type": "example", "text": "Didn’t you catch the bus on rainy days?"}]}, {"title": "Used to: trước đây từng", "blocks": [{"type": "text", "text": "Dùng used to + động từ nguyên mẫu để nói về thói quen hoặc tình huống trong quá khứ mà hiện nay đã khác. Phủ định và câu hỏi dùng use to, không dùng used to sau did/didn’t."}, {"type": "table", "rows": [["Dạng câu", "Cấu trúc"], ["Khẳng định", "I/He/She/We/You/They used to go."], ["Phủ định", "I/He/She/We/You/They didn’t use to go."], ["Câu hỏi", "Did I/he/she/we/you/they use to go?"]]}, {"type": "example", "text": "We used to live in a small flat."}, {"type": "meaning", "text": "Nay chúng tôi không còn sống trong căn hộ nhỏ đó."}, {"type": "example", "text": "They used to cycle everywhere."}, {"type": "meaning", "text": "Nay họ không còn đi xe đạp đến mọi nơi."}, {"type": "example", "text": "I didn’t use to like camping."}, {"type": "meaning", "text": "Trước đây tôi không thích cắm trại; bây giờ tôi thích."}]}]}, {"unit": 5, "title": "Quá khứ đơn và quá khứ tiếp diễn", "english": "Past simple and continuous", "source_page": "151", "sections": [{"title": "Ôn cấu trúc quá khứ đơn", "blocks": [{"type": "text", "text": "Be có dạng was/wasn’t, were/weren’t. Động từ thường có quy tắc thêm -ed; nhiều động từ thông dụng bất quy tắc. Câu hỏi dùng did; phủ định dùng didn’t (did not) + động từ nguyên mẫu."}, {"type": "example", "text": "It was cold yesterday."}, {"type": "example", "text": "Were there many people at the party?"}, {"type": "example", "text": "open → opened; think → thought; take → took; put → put"}, {"type": "example", "text": "I didn’t open the window."}, {"type": "example", "text": "Did she lock the car?"}]}, {"title": "Quá khứ đơn: sự việc đã kết thúc", "blocks": [{"type": "text", "text": "Dùng quá khứ đơn cho hành động đã hoàn tất và những điều xảy ra trong quá khứ."}, {"type": "example", "text": "I lived in Russia."}, {"type": "example", "text": "Did the river flood last winter?"}, {"type": "example", "text": "I didn’t go to a party last weekend."}]}, {"title": "Quá khứ tiếp diễn: cấu trúc", "blocks": [{"type": "text", "text": "Tạo quá khứ tiếp diễn bằng quá khứ của be + hiện tại phân từ (động từ -ing)."}, {"type": "table", "rows": [["Dạng câu", "I/He/She/It", "You/We/They"], ["Khẳng định", "was eating / sleeping.", "were eating / sleeping."], ["Phủ định", "wasn’t (was not) eating / sleeping.", "weren’t (were not) eating / sleeping."], ["Câu hỏi", "Was I/he/she/it eating / sleeping?", "Were you/we/they eating / sleeping?"]]}]}, {"title": "Hành động đang diễn ra và bối cảnh câu chuyện", "blocks": [{"type": "text", "text": "Dùng quá khứ tiếp diễn cho hành động/tình huống đang diễn ra tại một thời điểm trong quá khứ."}, {"type": "example", "text": "It was raining all night."}, {"type": "text", "text": "Dùng để mô tả bối cảnh của một câu chuyện."}, {"type": "example", "text": "We were travelling with some friends and visiting lots of great cities."}]}, {"title": "Hành động đang diễn ra bị xen vào", "blocks": [{"type": "text", "text": "Quá khứ tiếp diễn diễn tả hành động đang diễn ra; quá khứ đơn diễn tả hành động ngắn xen vào."}, {"type": "example", "text": "I was waiting for a bus when you texted."}, {"type": "example", "text": "At the time the exam started, I was sitting in a traffic jam."}]}, {"title": "Động từ trạng thái", "blocks": [{"type": "text", "text": "Trong cách dùng trạng thái của bài, không dùng quá khứ tiếp diễn với động từ chỉ điều ta thích, nghĩ và cảm thấy: believe, hate, know, like, love, mean, need, own, prefer, understand, want."}, {"type": "example", "text": "I didn’t like the film. I didn’t understand it."}, {"type": "meaning", "text": "Lỗi cần tránh: I wasn’t liking the film. I wasn’t understanding it."}]}]}, {"unit": 6, "title": "Bắt buộc, cần thiết và lời khuyên (1)", "english": "Modals: obligation, necessity and advice (1)", "source_page": "152", "sections": [{"title": "Must, should, ought to", "blocks": [{"type": "text", "text": "Những động từ này không đổi dạng theo chủ ngữ và đứng trước động từ nguyên mẫu khác. Must/should đi trực tiếp với động từ; ought có to. Không thường dùng ought not to."}, {"type": "example", "text": "I must have a shower."}, {"type": "example", "text": "You should eat more vegetables."}, {"type": "example", "text": "He ought to wear a coat."}, {"type": "example", "text": "We mustn’t go into the house."}, {"type": "example", "text": "She shouldn’t worry so much."}]}, {"title": "Have to: dạng thay đổi theo chủ ngữ", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định", "Câu hỏi"], ["I/You/We/They", "have to work.", "don’t have to work.", "Do I/you/we/they have to work?"], ["He/She/It", "has to work.", "doesn’t have to work.", "Does he/she/it have to work?"]]}]}, {"title": "Must và have to: bắt buộc, hoàn toàn cần thiết", "blocks": [{"type": "example", "text": "You must rest your leg for five days."}, {"type": "example", "text": "I have to leave home at seven o’clock to get the bus."}]}, {"title": "Mustn’t: không được phép", "blocks": [{"type": "text", "text": "Mustn’t diễn tả việc rất quan trọng là không được làm: một sự cấm đoán."}, {"type": "example", "text": "You mustn’t go into that room."}, {"type": "example", "text": "He mustn’t cycle without a helmet."}]}, {"title": "Don’t/doesn’t have to: không cần", "blocks": [{"type": "text", "text": "Don’t/doesn’t have to diễn tả không cần thiết làm gì. Khác với mustn’t, người đó vẫn có thể làm nếu muốn."}, {"type": "example", "text": "I don’t have to get to school before eight."}, {"type": "example", "text": "My mother doesn’t have to work at weekends."}]}, {"title": "Should và ought to: nên", "blocks": [{"type": "text", "text": "Should và ought to chỉ một ý hay/điều nên làm; mức độ nhẹ hơn must và have to."}, {"type": "example", "text": "You should try to relax before your exam."}, {"type": "example", "text": "We ought to finish our homework before we go out."}]}, {"title": "Shouldn’t: không nên", "blocks": [{"type": "text", "text": "Shouldn’t diễn tả điều không nên làm, nhẹ hơn mustn’t."}, {"type": "example", "text": "You shouldn’t go out when you’ve got homework to do."}, {"type": "example", "text": "I shouldn’t eat sweets before a meal."}]}]}, {"unit": 7, "title": "Hiện tại hoàn thành và quá khứ đơn", "english": "Present perfect and past simple", "source_page": "153", "sections": [{"title": "Quá khứ đơn", "blocks": [{"type": "meaning", "text": "Xem cấu trúc quá khứ đơn: Unit 4, trang 150."}, {"type": "text", "text": "Dùng quá khứ đơn cho hành động đã hoàn tất, bắt đầu và kết thúc trong quá khứ. Đôi khi câu nêu rõ thời điểm hành động xảy ra."}, {"type": "example", "text": "We spent hours in the recording studio yesterday."}, {"type": "example", "text": "I didn’t finish my song."}, {"type": "example", "text": "Did they learn lots of songs last weekend?"}]}, {"title": "Hiện tại hoàn thành", "blocks": [{"type": "formula", "text": "have/has + quá khứ phân từ (past participle)"}, {"type": "text", "text": "Dùng hiện tại hoàn thành cho điều bắt đầu trong quá khứ và có liên hệ với hiện tại. Phủ định thêm not sau have/has; câu hỏi đưa have/has lên trước chủ ngữ, giữ quá khứ phân từ."}, {"type": "example", "text": "We’ve spent hours in the recording studio."}, {"type": "example", "text": "I haven’t made a recording."}, {"type": "example", "text": "Have you seen this website?"}]}, {"title": "Just: vừa mới", "blocks": [{"type": "text", "text": "Just thường đứng sau have/has và trước động từ chính, diễn tả sự việc vừa xảy ra cách đây ít phút."}, {"type": "example", "text": "I’ve just arrived."}]}, {"title": "Already: đã ... rồi", "blocks": [{"type": "text", "text": "Already có thể đứng sau have/has, trước động từ chính hoặc cuối câu. Trong cách dùng của bài, không dùng already trong câu phủ định. Nó cho biết việc đã xảy ra trước thời điểm hiện tại."}, {"type": "example", "text": "I’ve already made one recording."}, {"type": "example", "text": "I’ve made one recording already."}]}, {"title": "Yet: cho đến bây giờ", "blocks": [{"type": "text", "text": "Dùng yet ở cuối câu phủ định và câu hỏi. Trong phủ định, hành động vẫn chưa hoàn tất; trong câu hỏi, người nói nghĩ người nghe có kế hoạch làm việc đó vào khoảng hiện tại."}, {"type": "example", "text": "I haven’t finished this recording yet."}, {"type": "meaning", "text": "Tôi vẫn đang thực hiện bản thu, chưa xong."}, {"type": "example", "text": "Have you made a recording yet?"}, {"type": "meaning", "text": "Bạn đã thực hiện bản thu theo dự định chưa?"}]}, {"title": "Ever: đã từng", "blocks": [{"type": "text", "text": "Dùng ever trong câu hỏi, trước động từ chính. Nó có nghĩa “vào bất cứ lúc nào từ trước đến nay”, thường hỏi trải nghiệm trong đời."}, {"type": "example", "text": "Have you ever made a recording?"}]}]}, {"unit": 8, "title": "So sánh hơn, bằng và nhất", "english": "Comparative and superlative adjectives", "source_page": "154", "sections": [{"title": "Cách tạo dạng: tính từ một âm tiết", "blocks": [{"type": "text", "text": "Với tính từ một âm tiết, thêm -er để so sánh hơn và -est để so sánh nhất. Nếu tận cùng bằng -e, chỉ thêm -r và -st. Với tận cùng một nguyên âm + một phụ âm, thường gấp đôi phụ âm cuối trước -er/-est."}, {"type": "table", "rows": [["Tính từ", "So sánh hơn", "So sánh nhất"], ["new", "newer", "(the) newest"], ["light", "lighter", "(the) lightest"], ["nice", "nicer", "(the) nicest"], ["big", "bigger", "(the) biggest"]]}]}, {"title": "Tận cùng phụ âm + y", "blocks": [{"type": "text", "text": "Đổi -y thành -ier và -iest."}, {"type": "example", "text": "tidy → tidier → (the) tidiest"}, {"type": "example", "text": "funny → funnier → (the) funniest"}]}, {"title": "Tính từ dài và tính từ ghép", "blocks": [{"type": "text", "text": "Với tính từ từ hai âm tiết trở lên, thường dùng more và the most. Các tính từ ghép từ hai từ cũng dùng more và the most theo mẫu dưới đây."}, {"type": "example", "text": "active → more active → (the) most active"}, {"type": "example", "text": "modern → more modern → (the) most modern"}, {"type": "example", "text": "user-friendly → more user-friendly → (the) most user-friendly"}]}, {"title": "Dạng bất quy tắc", "blocks": [{"type": "table", "rows": [["Tính từ", "So sánh hơn", "So sánh nhất"], ["good", "better", "(the) best"], ["bad", "worse", "(the) worst"], ["far", "further/farther", "(the) furthest/farthest"]]}]}, {"title": "So sánh hơn với than", "blocks": [{"type": "text", "text": "Khi muốn nói một vật/người có mức độ cao hơn vật/người khác, thường dùng tính từ so sánh hơn + than."}, {"type": "example", "text": "Your bike is newer than mine."}, {"type": "example", "text": "The grammar book was more useful than the dictionary."}]}, {"title": "Mức độ kém hơn", "blocks": [{"type": "text", "text": "Dùng less + tính từ + than, hoặc not as + tính từ + as."}, {"type": "example", "text": "My bike is less new than yours."}, {"type": "example", "text": "The dictionary was less useful than the grammar book."}, {"type": "example", "text": "My bike isn’t as good as yours."}, {"type": "example", "text": "The dictionary wasn’t as useful as the grammar book."}]}, {"title": "So sánh bằng", "blocks": [{"type": "formula", "text": "as + tính từ + as"}, {"type": "text", "text": "Dùng khi hai người/vật có mức độ bằng nhau về đặc điểm đang so sánh."}, {"type": "example", "text": "My bedroom is as big as my brother’s bedroom."}]}, {"title": "So sánh nhất", "blocks": [{"type": "text", "text": "Dùng dạng so sánh nhất khi nói một người/vật hơn hoặc kém tất cả những người/vật còn lại trong nhóm. The least + tính từ diễn tả mức độ thấp nhất."}, {"type": "example", "text": "Your bike is the newest in the race and mine is the oldest."}, {"type": "example", "text": "The grammar book was the most useful."}, {"type": "meaning", "text": "Trong tất cả những cuốn sách đã dùng, sách ngữ pháp hữu ích nhất."}, {"type": "example", "text": "The dictionary was the least useful."}]}, {"title": "The hoặc từ sở hữu trước so sánh nhất", "blocks": [{"type": "text", "text": "Thường dùng the hoặc từ/cụm từ sở hữu trước dạng so sánh nhất."}, {"type": "example", "text": "The fastest runner in our school is Amy."}, {"type": "example", "text": "Amy is the school’s most successful runner."}, {"type": "example", "text": "Game shows are my least favourite TV programmes."}]}]}, {"unit": 9, "title": "Các dạng tương lai và tương lai tiếp diễn", "english": "Future forms; future continuous", "source_page": "155", "sections": [{"title": "Hiện tại tiếp diễn cho sự sắp xếp chắc chắn", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn cho sự sắp xếp chắc chắn trong tương lai, thường nêu thời gian."}, {"type": "example", "text": "Charlie is leaving on Tuesday."}, {"type": "example", "text": "What are you doing in the holidays?"}]}, {"title": "Will: dự đoán, đề nghị và lời hứa", "blocks": [{"type": "text", "text": "Dùng will cho dự đoán chung về tương lai; dùng cho lời đề nghị giúp đỡ hoặc lời hứa liên quan đến tương lai. Won’t = will not."}, {"type": "example", "text": "The price of phones will fall."}, {"type": "example", "text": "Smart watches won’t do everything laptops can do."}, {"type": "example", "text": "I’ll help you set up the new equipment."}]}, {"title": "Going to: kế hoạch và ý định", "blocks": [{"type": "text", "text": "Dùng going to cho kế hoạch cá nhân trong tương lai, tương tự cách dùng hiện tại tiếp diễn; cũng dùng cho ý định chắc chắn."}, {"type": "example", "text": "Charlie is going to leave soon."}, {"type": "example", "text": "What are you going to do after school?"}, {"type": "example", "text": "We’re going to drive to the south coast."}]}, {"title": "Tương lai tiếp diễn: cấu trúc", "blocks": [{"type": "formula", "text": "will/won’t + be + động từ -ing"}, {"type": "example", "text": "I’ll be working."}, {"type": "example", "text": "He won’t be playing."}, {"type": "example", "text": "Will you be living ...?"}]}, {"title": "Tương lai tiếp diễn: cách dùng", "blocks": [{"type": "text", "text": "Dùng để nói về việc chắc chắn sẽ đang diễn ra tại một thời điểm cụ thể trong tương lai."}, {"type": "example", "text": "I’ll be working for my dad next year."}, {"type": "example", "text": "He won’t be playing tennis tomorrow morning."}, {"type": "example", "text": "Will you be working all weekend?"}]}]}, {"unit": 10, "title": "Câu điều kiện và unless", "english": "Conditional sentences", "source_page": "156", "sections": [{"title": "Điều kiện loại 0: cấu trúc", "blocks": [{"type": "text", "text": "Dùng hiện tại ở cả hai mệnh đề. Khi mệnh đề if đứng đầu, dùng dấu phẩy để ngăn với mệnh đề chính; khi mệnh đề if đứng sau, không cần dấu phẩy trong mẫu này."}, {"type": "formula", "text": "If + hiện tại, hiện tại. / Hiện tại + if + hiện tại."}, {"type": "example", "text": "If a lioness has cubs to protect, she is more dangerous."}, {"type": "example", "text": "A lioness is more dangerous if she has cubs to protect."}]}, {"title": "Điều kiện loại 0: tình huống thực tế", "blocks": [{"type": "text", "text": "Dùng để mô tả sự việc hoặc tình huống có thật, thực tế xảy ra. If thường có nghĩa tương tự when trong loại câu này."}, {"type": "example", "text": "Wild animals aren’t dangerous if people behave sensibly."}, {"type": "example", "text": "A lioness is more dangerous when she has cubs to protect."}]}, {"title": "Điều kiện loại 1: cấu trúc", "blocks": [{"type": "formula", "text": "If + hiện tại, will/won’t + động từ nguyên mẫu."}, {"type": "formula", "text": "Will/won’t + động từ nguyên mẫu + if + hiện tại."}, {"type": "example", "text": "If she thinks her cubs are in danger, a lioness will attack."}, {"type": "example", "text": "A lioness will attack if she thinks her cubs are in danger."}]}, {"title": "Điều kiện loại 1: khả năng có thể xảy ra", "blocks": [{"type": "text", "text": "Dùng để hình dung điều có khả năng xảy ra trong tương lai khi điều kiện được đáp ứng."}, {"type": "example", "text": "If the forests disappear, the weather will be more extreme."}]}, {"title": "Điều kiện loại 2: cấu trúc", "blocks": [{"type": "formula", "text": "If + quá khứ, would/wouldn’t + động từ nguyên mẫu."}, {"type": "formula", "text": "Would/wouldn’t + động từ nguyên mẫu + if + quá khứ."}, {"type": "example", "text": "If politicians cared about the rainforests, they’d (would) do more to protect them."}, {"type": "example", "text": "If people cared about their planet, they wouldn’t pollute the sea."}, {"type": "example", "text": "Politicians would do more to protect the rainforests if they cared about them."}, {"type": "example", "text": "There wouldn’t be any apples if bees didn’t exist."}]}, {"title": "Điều kiện loại 2: giả định hiện tại hoặc tương lai", "blocks": [{"type": "text", "text": "Dùng để nói về điều khó xảy ra hoặc tưởng tượng ở hiện tại/tương lai. Dạng quá khứ ở đây diễn tả giả định, không đơn thuần là thời gian quá khứ."}, {"type": "example", "text": "If I had a garden, I’d grow lots of fruit."}, {"type": "meaning", "text": "Tôi không có vườn nên không trồng trái cây."}, {"type": "example", "text": "We wouldn’t eat honey if we didn’t like it."}, {"type": "meaning", "text": "Thực tế chúng tôi thích mật ong nên có ăn mật ong."}]}, {"title": "Unless = if ... not", "blocks": [{"type": "text", "text": "Có thể dùng unless thay if ... not trong câu điều kiện. Chú ý nghĩa phủ định đã nằm trong unless."}, {"type": "example", "text": "We wouldn’t eat honey unless we liked it."}, {"type": "meaning", "text": "Unless we liked it tương đương if we didn’t like it trong câu này."}, {"type": "example", "text": "Unless we do something to protect the rainforests soon, they will all disappear."}, {"type": "meaning", "text": "Tương đương If we don’t do something soon ...: nếu không sớm hành động, rừng mưa sẽ biến mất."}]}]}, {"unit": 11, "title": "Quá khứ hoàn thành", "english": "Past perfect", "source_page": "157", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "formula", "text": "had + quá khứ phân từ"}, {"type": "table", "rows": [["Khẳng định", "Phủ định", "Câu hỏi"], ["had looked", "hadn’t looked", "had he looked?"], ["had written", "hadn’t written", "had he written?"]]}]}, {"title": "Hành động xảy ra trước một mốc quá khứ", "blocks": [{"type": "text", "text": "Dùng quá khứ hoàn thành cho hành động hoặc sự kiện xảy ra trước một hành động/sự kiện khác trong quá khứ. Thì này thường làm rõ thứ tự các sự kiện và cung cấp bối cảnh; hành động quá khứ chính thường dùng quá khứ đơn."}, {"type": "example", "text": "I’d never been to a live concert so I was really excited when we went to one last weekend."}, {"type": "meaning", "text": "Chưa từng đi xem hòa nhạc là tình trạng trước chuyến đi cuối tuần trước; chuyến đi là sự kiện quá khứ chính."}]}, {"title": "Before và after", "blocks": [{"type": "text", "text": "Thường dùng before hoặc after trong câu có quá khứ hoàn thành để làm rõ trình tự."}, {"type": "example", "text": "I’d seen the film before but I enjoyed seeing it again."}, {"type": "example", "text": "After we’d sung Happy Birthday, my sister opened her presents."}]}]}, {"unit": 12, "title": "Bắt buộc, cần thiết và lời khuyên (2)", "english": "Modals: obligation, necessity and advice (2)", "source_page": "158", "sections": [{"title": "Should và shouldn’t: lời khuyên", "blocks": [{"type": "text", "text": "Dùng should/shouldn’t + động từ nguyên mẫu để khuyên ai đó, hoặc khi người nói tin rằng một việc là điều đúng nên làm."}, {"type": "example", "text": "You should arrive at the airport early."}, {"type": "example", "text": "You shouldn’t take too much hand luggage."}]}, {"title": "Need to: điều quan trọng cần làm", "blocks": [{"type": "text", "text": "Dùng need to + động từ khi cho rằng việc đó quan trọng nhưng không phải quy tắc hay luật."}, {"type": "example", "text": "You need to keep your passport in a safe place."}]}, {"title": "Have to: yêu cầu do quy tắc/luật", "blocks": [{"type": "text", "text": "Trong cách phân biệt của bài, dùng have to + động từ khi một việc cần thiết vì quy tắc hoặc luật yêu cầu."}, {"type": "example", "text": "You have to get a visa."}, {"type": "example", "text": "You have to show your passport when you enter the country."}]}, {"title": "Không cần thiết: ba cách diễn đạt", "blocks": [{"type": "text", "text": "Khi một việc không cần thiết, có thể dùng don’t have to + động từ; needn’t + động từ; hoặc don’t need to + động từ. Sau needn’t không có to."}, {"type": "example", "text": "You don’t have to pay for your food on this flight."}, {"type": "example", "text": "You needn’t take an umbrella – it won’t rain."}, {"type": "example", "text": "You don’t need to get to the airport early."}]}]}, {"unit": 13, "title": "Câu bị động", "english": "The passive", "source_page": "159", "sections": [{"title": "Cấu trúc chung", "blocks": [{"type": "formula", "text": "be + quá khứ phân từ"}, {"type": "text", "text": "Muốn nói hiện tại hay quá khứ, thay đổi dạng của be. Chủ ngữ của câu bị động là người/vật chịu tác động hoặc được nhấn mạnh."}]}, {"title": "Bị động hiện tại đơn", "blocks": [{"type": "formula", "text": "is/are + quá khứ phân từ"}, {"type": "example", "text": "Millions of photos are posted online every day."}, {"type": "example", "text": "These toys aren’t sold in supermarkets."}]}, {"title": "Bị động quá khứ đơn", "blocks": [{"type": "formula", "text": "was/were + quá khứ phân từ"}, {"type": "example", "text": "This picture was drawn to illustrate a story."}, {"type": "example", "text": "The artists weren’t told what to paint."}]}, {"title": "Bị động với động từ khuyết thiếu", "blocks": [{"type": "text", "text": "Các động từ như can, could, must, may, might thường dùng trong cấu trúc bị động. Giữ be ở dạng nguyên mẫu."}, {"type": "formula", "text": "động từ khuyết thiếu + be + quá khứ phân từ"}, {"type": "example", "text": "The writer of the poem can’t be identified."}, {"type": "example", "text": "The students may be allowed to film the show."}, {"type": "example", "text": "Tickets must be booked in advance."}]}, {"title": "Tác nhân thực hiện hành động (agent)", "blocks": [{"type": "text", "text": "Agent là người/vật thực hiện hành động. Tác nhân của động từ bị động chính là chủ ngữ của câu chủ động tương ứng."}, {"type": "example", "text": "Someone sent Sam a letter."}, {"type": "meaning", "text": "Someone vừa là chủ ngữ vừa là tác nhân thực hiện hành động."}, {"type": "example", "text": "Sam was sent a letter."}, {"type": "meaning", "text": "Sam là chủ ngữ nhưng không phải tác nhân gửi thư."}]}, {"title": "Khi không biết tác nhân", "blocks": [{"type": "text", "text": "Thường dùng bị động khi không biết ai thực hiện/đã thực hiện hành động."}, {"type": "example", "text": "My bag was taken while I was sunbathing."}, {"type": "example", "text": "A lot of clothes are made in small factories."}]}, {"title": "Khi tác nhân không quan trọng", "blocks": [{"type": "example", "text": "My new phone was delivered yesterday."}, {"type": "example", "text": "This room must be cleaned immediately."}]}, {"title": "Khi muốn nhấn mạnh chủ ngữ bị động", "blocks": [{"type": "example", "text": "I was asked to sing at the end-of-term concert!"}, {"type": "meaning", "text": "Người được mời hát là tôi, không phải người khác."}, {"type": "example", "text": "Your brother must be invited to the party."}, {"type": "meaning", "text": "Trọng tâm là anh/em trai của bạn."}]}, {"title": "By + tác nhân", "blocks": [{"type": "text", "text": "Dùng by nếu cần nói rõ ai thực hiện hành động trong câu bị động."}, {"type": "example", "text": "My friends gave me lots of presents on my birthday."}, {"type": "example", "text": "I was given lots of presents by my friends on my birthday."}, {"type": "example", "text": "The photographer didn’t pay that model very much."}, {"type": "example", "text": "That model wasn’t paid very much by the photographer."}]}]}, {"unit": 14, "title": "Mệnh đề quan hệ", "english": "Relative clauses", "source_page": "160", "sections": [{"title": "Mệnh đề quan hệ xác định", "blocks": [{"type": "text", "text": "Mệnh đề quan hệ xác định cung cấp thông tin thiết yếu để xác định người, vật hoặc nơi đang nói tới. Không tách nó khỏi phần còn lại bằng dấu phẩy."}, {"type": "example", "text": "The cakes that my brother makes are really good."}, {"type": "meaning", "text": "Cần phần that my brother makes để biết người nói đang nhắc tới những chiếc bánh nào."}]}, {"title": "Từ mở đầu mệnh đề xác định", "blocks": [{"type": "table", "rows": [["Từ", "Chỉ/diễn tả"], ["who", "Người"], ["which", "Vật"], ["that", "Người hoặc vật"], ["whose", "Quan hệ sở hữu"], ["where", "Nơi chốn"]]}, {"type": "example", "text": "There’s the girl who won the cookery competition."}, {"type": "example", "text": "She showed me the recipe which she invented."}, {"type": "example", "text": "I can email the recipe that I told you about."}, {"type": "example", "text": "That’s the boy whose mum designs sunglasses."}, {"type": "example", "text": "This is the place where I bought my book."}]}, {"title": "Chủ ngữ hoặc tân ngữ trong mệnh đề quan hệ", "blocks": [{"type": "text", "text": "Who, which, that có thể làm chủ ngữ hoặc tân ngữ của mệnh đề quan hệ. Xác định vai trò của chúng để biết có được lược bỏ hay không."}, {"type": "example", "text": "The woman who/that runs the café is very friendly."}, {"type": "meaning", "text": "Who/that là chủ ngữ của runs."}, {"type": "example", "text": "There’s the chef who/that I told you about."}, {"type": "meaning", "text": "Who/that là tân ngữ; I là chủ ngữ của told."}, {"type": "example", "text": "He showed me a recipe which/that he often uses."}, {"type": "meaning", "text": "Which/that là tân ngữ của uses."}]}, {"title": "Lược bỏ khi làm tân ngữ", "blocks": [{"type": "text", "text": "Có thể lược bỏ who, which hoặc that nếu nó làm tân ngữ trong mệnh đề quan hệ xác định. Phần trong ngoặc có thể bỏ."}, {"type": "example", "text": "The cakes (which/that) my brother makes are really good."}, {"type": "example", "text": "There’s the chef (who) I told you about."}, {"type": "example", "text": "He showed me a recipe (which/that) he often uses."}, {"type": "example", "text": "I can email the recipe (which/that) I told you about."}]}, {"title": "Không lược bỏ khi làm chủ ngữ", "blocks": [{"type": "text", "text": "Không thể bỏ who, which hoặc that khi nó là chủ ngữ của mệnh đề quan hệ."}, {"type": "example", "text": "The woman who runs the café is very friendly."}]}, {"title": "Mệnh đề quan hệ không xác định", "blocks": [{"type": "text", "text": "Mệnh đề quan hệ không xác định bổ sung thông tin về người/vật đã được xác định. Luôn tách nó khỏi phần còn lại bằng dấu phẩy."}, {"type": "example", "text": "The cakes on this plate, which my brother helped to make, are really good."}, {"type": "meaning", "text": "Bỏ which my brother helped to make, ta vẫn biết đó là các chiếc bánh trên đĩa này."}]}, {"title": "Từ mở đầu và điều không được làm", "blocks": [{"type": "text", "text": "Mệnh đề không xác định dùng who (người), where (nơi), which (vật) hoặc whose (sở hữu); không dùng that. Không bao giờ lược bỏ từ quan hệ trong loại mệnh đề này."}, {"type": "example", "text": "My brother, who is an excellent cook, has written a cookbook."}, {"type": "example", "text": "The recipes, which he tested carefully, require lots of special ingredients."}, {"type": "meaning", "text": "Lỗi cần tránh: The recipes, that he tested carefully, ..."}, {"type": "example", "text": "My grandparents, whose kitchen he uses, are proud of what he’s done."}]}]}, {"unit": 15, "title": "Mạo từ a/an, the và không dùng mạo từ", "english": "Articles: a/an, the and zero article", "source_page": "161", "sections": [{"title": "A/an: lần đầu nhắc tới", "blocks": [{"type": "text", "text": "Dùng a/an trước danh từ đếm được số ít khi nhắc đến một người/vật lần đầu."}, {"type": "example", "text": "I live in a flat near the city centre."}]}, {"title": "A/an: nghề nghiệp/vai trò", "blocks": [{"type": "text", "text": "Dùng a/an khi nói nghề nghiệp hoặc một người làm gì."}, {"type": "example", "text": "My mum’s a doctor, my dad’s an architect and my brother’s a student."}]}, {"title": "The: nhắc lại hoặc duy nhất", "blocks": [{"type": "text", "text": "Dùng the trước danh từ khi nhắc đến lần thứ hai, hoặc khi chỉ có một đối tượng phù hợp trong ngữ cảnh."}, {"type": "example", "text": "Our flat is near a park. The park has several tennis courts."}, {"type": "example", "text": "My brother likes swimming in the sea."}]}, {"title": "The: người/vật cụ thể", "blocks": [{"type": "example", "text": "The school I go to is not far away."}]}, {"title": "The với tên địa lý", "blocks": [{"type": "text", "text": "Dùng the với tên dãy núi và tên các quốc gia/nhà nước ở dạng số nhiều; dùng với tên sa mạc, đại dương hoặc sông."}, {"type": "example", "text": "the Urals, the United Arab Emirates"}, {"type": "example", "text": "the Sahara, the Pacific, the Amazon"}]}, {"title": "Không dùng mạo từ khi nói chung", "blocks": [{"type": "text", "text": "Không dùng mạo từ trước danh từ không đếm được hoặc danh từ đếm được số nhiều khi nói về chúng nói chung."}, {"type": "example", "text": "Volleyball is my favourite sport."}, {"type": "example", "text": "Teenagers are usually interested in sport."}]}, {"title": "Không dùng mạo từ với nhóm tên riêng này", "blocks": [{"type": "text", "text": "Không dùng mạo từ với tên thành phố/thị trấn, quốc gia, châu lục; đảo riêng lẻ, ngọn núi riêng lẻ và hồ, theo các mẫu tên riêng trong bài."}, {"type": "example", "text": "New Zealand, Rome, Europe, Sicily, Mount Fuji, Lake Issyk Kul"}]}]}, {"unit": 16, "title": "Câu tường thuật", "english": "Reported speech", "source_page": "162", "sections": [{"title": "Lùi thì khi động từ tường thuật ở quá khứ", "blocks": [{"type": "text", "text": "Khi động từ tường thuật như said, told, explained ở thì quá khứ, thì của động từ trong lời nói trực tiếp chuyển đổi theo bảng. That có thể xuất hiện trong câu tường thuật."}, {"type": "table", "rows": [["Chuyển đổi", "Lời trực tiếp", "Lời tường thuật"], ["Hiện tại đơn → quá khứ đơn", "‘I enjoy watching films.’", "He said he enjoyed watching films."], ["Hiện tại tiếp diễn → quá khứ tiếp diễn", "‘That girl is acting well.’", "He said that girl was acting well."], ["Quá khứ đơn → quá khứ hoàn thành", "‘She studied at film school.’", "He said (that) she’d (had) studied at film school."], ["Hiện tại hoàn thành → quá khứ hoàn thành", "‘I haven’t seen her before.’", "He said he hadn’t seen her before."], ["will → would", "‘She’ll be famous one day.’", "He said she’d (would) be famous one day."], ["can → could", "‘She can sing well too.’", "He said she could sing well too."]]}]}, {"title": "Các dạng không thay đổi", "blocks": [{"type": "text", "text": "Không đổi could, would, should, might, used to hoặc quá khứ hoàn thành khi tường thuật."}, {"type": "example", "text": "‘You could visit her website.’ → He said I could visit her website."}, {"type": "example", "text": "‘She used to be in a TV series.’ → He said she used to be in a TV series."}, {"type": "example", "text": "‘She hadn’t appeared on TV before that.’ → He said she hadn’t appeared on TV before that."}]}, {"title": "Đại từ trong câu tường thuật", "blocks": [{"type": "text", "text": "Đại từ đôi khi cần đổi để đúng người nói, người nghe và người được nhắc tới; không đổi máy móc nếu đối tượng vẫn giữ nguyên."}, {"type": "example", "text": "‘I enjoy watching films,’ said Tom. → Tom said he enjoyed watching films."}, {"type": "example", "text": "‘You can watch a film after dinner,’ said the boys’ mum. → The boys’ mum said they could watch a film after dinner."}]}, {"title": "Động từ tường thuật", "blocks": [{"type": "text", "text": "Có thể mở đầu bằng said, told, insisted, announced, demanded, explained, v.v. Sau told bắt buộc có tân ngữ chỉ người nghe; said không theo mẫu told + người nghe này."}, {"type": "example", "text": "She said she enjoyed acting."}, {"type": "example", "text": "She told us she enjoyed acting."}]}, {"title": "Dùng that", "blocks": [{"type": "text", "text": "Sau động từ tường thuật thường có that."}, {"type": "example", "text": "She said that she enjoyed acting."}, {"type": "example", "text": "She told us that she enjoyed acting."}, {"type": "example", "text": "She explained that she enjoyed acting."}]}, {"title": "Insisted, suggested, demanded + should", "blocks": [{"type": "text", "text": "Insisted, suggested và demanded có thể theo sau bằng that + chủ ngữ + should + động từ nguyên mẫu thay cho một thì quá khứ."}, {"type": "example", "text": "‘You must give us your autograph.’"}, {"type": "example", "text": "We insisted that she gave us her autograph."}, {"type": "example", "text": "We insisted that she should give us her autograph."}, {"type": "example", "text": "‘Let’s watch the film again.’ → I suggested that we should watch the film again."}]}]}, {"unit": 17, "title": "Câu hỏi tường thuật", "english": "Reported questions", "source_page": "163", "sections": [{"title": "Trật tự câu tường thuật", "blocks": [{"type": "text", "text": "Trật tự trong phần câu hỏi được tường thuật giống câu khẳng định: chủ ngữ đứng trước động từ. Không giữ trật tự đảo của câu hỏi trực tiếp."}, {"type": "example", "text": "‘What’s the time?’ → She asked me what the time was."}]}, {"title": "Thì, trợ động từ và đại từ", "blocks": [{"type": "text", "text": "Sau động từ tường thuật ở quá khứ, động từ chuyển thì giống câu tường thuật phát biểu. Đại từ cũng đổi theo ngữ cảnh như ở Unit 16."}, {"type": "text", "text": "Không giữ did/didn’t làm trợ động từ tạo câu hỏi trong phần câu hỏi tường thuật."}, {"type": "example", "text": "‘When did you get up today?’ → He asked me when I got up today."}, {"type": "meaning", "text": "Lỗi cần tránh: ... when did I get up today."}]}, {"title": "Câu hỏi Yes/No: if hoặc whether", "blocks": [{"type": "text", "text": "Mở đầu phần tường thuật bằng if hoặc whether, sau đó là chủ ngữ + động từ."}, {"type": "example", "text": "‘Are you busy?’ → She asked if I was busy."}, {"type": "example", "text": "‘Did he send an email?’ → I asked whether he’d sent an email."}, {"type": "example", "text": "‘Do you often play video games?’ → He asked whether we often played video games."}, {"type": "example", "text": "‘Have you seen my website?’ → She asked if I’d seen her website."}]}, {"title": "Câu hỏi Wh-: giữ từ để hỏi", "blocks": [{"type": "text", "text": "Phần câu hỏi tường thuật bắt đầu bằng cùng từ để hỏi của câu trực tiếp, rồi dùng trật tự chủ ngữ + động từ."}, {"type": "example", "text": "‘What time is it?’ → She asked what time it was."}, {"type": "example", "text": "‘When are you coming home?’ → He asked when we were coming home."}, {"type": "example", "text": "‘Where can I charge my phone?’ → He asked where he could charge his phone."}, {"type": "example", "text": "‘Which websites have they looked at?’ → I asked which websites they’d looked at."}]}, {"title": "Ask, want to know và wonder", "blocks": [{"type": "text", "text": "Có thể dùng ask (hỏi), want to know (muốn biết) hoặc wonder (tự hỏi/băn khoăn) để mở đầu câu hỏi tường thuật."}, {"type": "example", "text": "‘Are you busy?’ → She asked if I was busy."}, {"type": "example", "text": "‘Did he send an email?’ → I wanted to know whether he’d sent an email."}, {"type": "example", "text": "‘Do you often play video games?’ → He wondered whether we often played video games."}]}, {"title": "Người nhận câu hỏi sau asked", "blocks": [{"type": "text", "text": "Asked đôi khi được theo sau bằng danh từ hoặc đại từ chỉ người được hỏi."}, {"type": "example", "text": "‘What time is it?’ → She asked the nurse what time it was."}, {"type": "example", "text": "‘When are you coming home?’ → He asked us when we were coming home."}, {"type": "example", "text": "‘Which websites have they looked at?’ → I asked them which websites they’d looked at."}]}]}, {"unit": 18, "title": "Nhờ người khác làm: have something done", "english": "Have something done", "source_page": "164", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "formula", "text": "một dạng của have + tân ngữ + quá khứ phân từ"}, {"type": "text", "text": "Quá khứ phân từ mô tả hành động được thực hiện. Have thay đổi theo thì/cấu trúc; tân ngữ là người/vật nhận hành động."}, {"type": "table", "rows": [["Phần đầu câu", "Các quá khứ phân từ có thể dùng"], ["I’m going to have my hair", "coloured / cut / done."], ["We had our hair", "coloured / cut / done."], ["They’ve never had their hair", "coloured / cut / done."], ["You should have your hair", "coloured / cut / done."], ["He’ll probably have his hair", "coloured / cut / done."], ["She needs to have her hair", "coloured / cut / done."]]}]}, {"title": "Ý nghĩa: người khác làm cho mình", "blocks": [{"type": "text", "text": "Dùng have something done cho việc một người khác thực hiện cho chúng ta; chủ ngữ không tự thực hiện hành động đó."}, {"type": "example", "text": "We want to have our hair cut."}, {"type": "meaning", "text": "Chúng tôi muốn ai đó cắt tóc cho mình."}, {"type": "example", "text": "I’m going to have my hair done."}, {"type": "meaning", "text": "Ai đó sẽ làm tóc cho tôi."}]}, {"title": "Có cần nêu người thực hiện không?", "blocks": [{"type": "text", "text": "Thường không nói rõ người thực hiện trừ khi thông tin đó quan trọng. Có thể thêm by + người làm khi cần nhấn mạnh."}, {"type": "example", "text": "I had my hair done."}, {"type": "meaning", "text": "Ai đó, có lẽ là thợ làm tóc, đã làm tóc cho tôi."}, {"type": "example", "text": "I had my hair coloured by my mum."}, {"type": "meaning", "text": "Nhấn mạnh mẹ tôi là người nhuộm tóc cho tôi."}]}, {"title": "Get trong tình huống thân mật", "blocks": [{"type": "text", "text": "Có thể dùng get thay have trong tình huống thân mật hơn."}, {"type": "example", "text": "I’m going to have/get my bike fixed this weekend."}, {"type": "example", "text": "My parents had/got their photo taken in front of Buckingham Palace."}]}]}, {"unit": 19, "title": "Mệnh đề tương phản, mục đích và lý do", "english": "Different types of clause", "source_page": "165", "sections": [{"title": "Mệnh đề tương phản", "blocks": [{"type": "text", "text": "Dùng although, whereas và while để nối các mệnh đề cung cấp thông tin khác nhau hoặc bất ngờ/trái với điều có thể dự đoán."}]}, {"title": "Although và whereas: vị trí", "blocks": [{"type": "text", "text": "Although và whereas có thể đứng giữa câu hoặc đứng đầu câu để nhấn mạnh hơn. Although nghĩa là “mặc dù”; whereas đối chiếu hai thực tế “trong khi”."}, {"type": "example", "text": "I enjoyed my holiday job although it was hard work."}, {"type": "example", "text": "Although my holiday job was hard work, I enjoyed it."}, {"type": "meaning", "text": "Công việc vất vả nhưng tôi vẫn thích."}, {"type": "example", "text": "I prefer to get up early, whereas most of my friends like to sleep late."}, {"type": "example", "text": "Whereas most of my friends like to sleep late, I prefer to get up early."}, {"type": "meaning", "text": "Khác với phần lớn bạn bè, tôi thích dậy sớm."}]}, {"title": "While: tương phản", "blocks": [{"type": "text", "text": "Trong cách dùng tương phản ở bài này, while thường đứng đầu câu."}, {"type": "example", "text": "While I don’t enjoy going for a run, I know it’s good for me."}, {"type": "meaning", "text": "Tôi không thích chạy bộ nhưng biết việc đó tốt cho mình."}]}, {"title": "Mục đích: in order to", "blocks": [{"type": "text", "text": "Dùng cấu trúc mở đầu bằng so that hoặc in order to để giải thích mục đích trong cùng một câu. In order to có thể đứng giữa câu hoặc đầu câu để nhấn mạnh; theo sau là động từ nguyên mẫu."}, {"type": "formula", "text": "in order to + động từ nguyên mẫu"}, {"type": "example", "text": "I want to work in an office in order to learn about business software."}, {"type": "example", "text": "In order to learn about business software, I want to work in an office."}]}, {"title": "Mục đích: so that", "blocks": [{"type": "text", "text": "So that đứng giữa câu; theo sau là một mệnh đề có chủ ngữ và động từ, như I can learn trong ví dụ."}, {"type": "formula", "text": "so that + chủ ngữ + động từ"}, {"type": "example", "text": "I want to work in an office so that I can learn about business software."}]}, {"title": "Lý do: because và as", "blocks": [{"type": "text", "text": "Dùng mệnh đề bắt đầu bằng because hoặc as khi muốn giải thích lý do trong cùng câu. Cả hai có thể đứng giữa câu hoặc đầu câu để nhấn mạnh hơn. Trong cách dùng này, as cùng nghĩa với because."}, {"type": "example", "text": "I needed to get a job because I wanted to save money for my holiday."}, {"type": "example", "text": "Because I wanted to save money for my holiday, I needed to get a job."}, {"type": "example", "text": "I decided to walk to work as it was a fine morning."}, {"type": "example", "text": "As it was a fine morning, I decided to walk to work."}]}]}, {"unit": 20, "title": "Động từ có hai tân ngữ", "english": "Verbs with two objects", "source_page": "166", "sections": [{"title": "Chủ ngữ, động từ và tân ngữ trực tiếp", "blocks": [{"type": "text", "text": "Động từ chủ động thường có chủ ngữ và nhiều khi có tân ngữ trực tiếp. Tân ngữ trực tiếp thường là một vật/sự việc nhận hành động."}, {"type": "table", "rows": [["Chủ ngữ", "Động từ", "Tân ngữ trực tiếp"], ["I", "sent", "a text."], ["Maisie", "wrote", "a note about the volleyball match."]]}]}, {"title": "Hai tân ngữ: trực tiếp và gián tiếp", "blocks": [{"type": "text", "text": "Một số động từ có cả tân ngữ trực tiếp và tân ngữ gián tiếp. Tân ngữ gián tiếp thường là một người: người nhận hoặc người được làm việc gì cho."}]}, {"title": "Tân ngữ trực tiếp đứng trước", "blocks": [{"type": "text", "text": "Khi tân ngữ trực tiếp đứng trước, dùng to hoặc for trước tân ngữ gián tiếp."}, {"type": "table", "rows": [["Chủ ngữ", "Động từ", "Tân ngữ trực tiếp", "Tân ngữ gián tiếp"], ["I", "sent", "a text", "to my aunt."], ["Maisie", "wrote", "a note about the volleyball match", "for the teacher."]]}]}, {"title": "Tân ngữ gián tiếp đứng trước", "blocks": [{"type": "text", "text": "Khi tân ngữ gián tiếp đứng trước, không dùng to hoặc for."}, {"type": "table", "rows": [["Chủ ngữ", "Động từ", "Tân ngữ gián tiếp", "Tân ngữ trực tiếp"], ["I", "sent", "my aunt", "a text."], ["Maisie", "wrote", "the teacher", "a note about the volleyball match."]]}]}, {"title": "Các động từ có thể có hai tân ngữ", "blocks": [{"type": "text", "text": "Ghi nhớ các động từ trong bài: bring, buy, cook, choose, fetch, give, lend, make, offer, owe, pay, send, show, take, teach, tell, throw, write."}]}]}], "pages": [{"unit": 1, "title": "Danh từ đếm được", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Danh từ đếm được có dạng số ít và số nhiều. Một số danh từ có dạng số nhiều bất quy tắc, cần ghi nhớ riêng."}, {"type": "example", "text": "card → cards; phone → phones"}, {"type": "example", "text": "child → children; woman → women; person → people"}]}, {"unit": 1, "title": "Danh từ không đếm được", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Các danh từ không đếm được trong bài được dùng như danh từ số ít: bread, information, news, homework, money, water. Có thể dùng cụm chỉ đơn vị hoặc lượng để diễn đạt lượng của chúng."}, {"type": "example", "text": "a slice of bread"}, {"type": "example", "text": "a great deal of money"}, {"type": "example", "text": "two glasses of water"}]}, {"unit": 1, "title": "Một từ có thể thuộc cả hai nhóm", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Một số danh từ vừa đếm được vừa không đếm được, tùy ý nghĩa: một tiếng động cụ thể/tiếng ồn nói chung; một sợi tóc/tóc nói chung; một cốc cà phê/cà phê như một thức uống."}, {"type": "example", "text": "There’s a strange noise coming from that box."}, {"type": "example", "text": "Can you hear that noise?"}, {"type": "example", "text": "There’s a hair in my soup!"}, {"type": "example", "text": "I’ve got long hair."}]}, {"unit": 1, "title": "Một từ có thể thuộc cả hai nhóm", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "example", "text": "Do you want a coffee?"}, {"type": "example", "text": "Coffee is my favourite drink."}]}, {"unit": 1, "title": "Some, any, no, plenty of, a lot of", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Dùng some, any, no, plenty of và (not) a lot of với danh từ đếm được số nhiều và danh từ không đếm được. Trong câu khẳng định, a lot of và lots of có cùng nghĩa “nhiều”. Plenty of diễn tả nhiều, đủ dùng."}, {"type": "example", "text": "I’ve got some biscuits and some cheese."}, {"type": "example", "text": "We haven’t got any apples or any milk."}, {"type": "example", "text": "There are no oranges and the shop has no fruit juice."}]}, {"unit": 1, "title": "Some, any, no, plenty of, a lot of", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "example", "text": "I’ve bought plenty of vegetables and cheese."}, {"type": "example", "text": "There are a lot of people here today but there isn’t a lot of food."}]}, {"unit": 1, "title": "Phân biệt any, no và some trong câu hỏi", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Dùng any trong câu hỏi và câu phủ định. Để diễn đạt “không có” trong câu có động từ khẳng định, dùng no. Không thêm một phủ định khác trước no trong mẫu này."}, {"type": "example", "text": "Is there any cake?"}, {"type": "example", "text": "There is no cake."}, {"type": "example", "text": "I don’t need any help."}, {"type": "text", "text": "Đôi khi dùng some trong câu hỏi khi mời/cung cấp điều gì và khi mong đợi câu trả lời Yes."}]}, {"unit": 1, "title": "Phân biệt any, no và some trong câu hỏi", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "example", "text": "Would you like some tea?"}]}, {"unit": 1, "title": "Many, much và several", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Dùng (not) many với danh từ đếm được trong câu khẳng định, phủ định và câu hỏi."}, {"type": "example", "text": "Many students enjoy meeting in this café."}, {"type": "example", "text": "We don’t have many places to meet our friends."}, {"type": "example", "text": "Do you go to many parties during the holidays?"}]}, {"unit": 1, "title": "Many, much và several", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Dùng (not) much với danh từ không đếm được trong câu phủ định và câu hỏi. Trong cách dùng thông thường của bài, dùng a lot of cho câu khẳng định; a lot of cũng dùng được trong câu hỏi."}, {"type": "example", "text": "My brother isn’t much help around the house."}, {"type": "example", "text": "My sister always gives me a lot of help."}, {"type": "example", "text": "Do you watch much / a lot of sport on television?"}]}, {"unit": 1, "title": "Many, much và several", "english": "Countable and uncountable nouns; determiners", "blocks": [{"type": "text", "text": "Dùng several (một vài/một số) với danh từ đếm được số nhiều."}, {"type": "example", "text": "I’ve got several friends in the States."}]}, {"unit": 2, "title": "Dạng -ing là gì?", "english": "-ing forms", "blocks": [{"type": "text", "text": "Dạng -ing của động từ như being, knowing, seeing, having, running đôi khi được gọi là hiện tại phân từ (present participle) hoặc danh động từ (gerund), tùy vai trò trong câu."}]}, {"unit": 2, "title": "Sau động từ chỉ thích/không thích", "english": "-ing forms", "blocks": [{"type": "text", "text": "Dùng động từ -ing sau các động từ diễn tả thích hoặc không thích: like, love, enjoy, dislike, hate, not mind (không phiền), can’t stand (không chịu nổi)."}, {"type": "example", "text": "I love going out with my friends."}, {"type": "example", "text": "We all hate revising for a test."}, {"type": "example", "text": "Marie doesn’t mind helping other students with maths."}, {"type": "example", "text": "My dad hates being late for work."}]}, {"unit": 2, "title": "Sau động từ chỉ thích/không thích", "english": "-ing forms", "blocks": [{"type": "example", "text": "My mum can’t stand doing housework."}]}, {"unit": 2, "title": "Sau tính từ + giới từ", "english": "-ing forms", "blocks": [{"type": "text", "text": "Dùng -ing sau một số cụm tính từ + giới từ để nói làm việc gì tốt đến đâu hoặc cảm thấy thế nào về việc đó. Các tính từ này đi sau be."}]}, {"unit": 2, "title": "Sau tính từ + giới từ", "english": "-ing forms", "blocks": [{"type": "table", "rows": [["Cụm từ", "Nghĩa"], ["good at / bad at", "Giỏi / kém về việc gì"], ["keen on / interested in", "Ham thích / quan tâm đến"], ["crazy about", "Rất mê"], ["afraid of", "Sợ"], ["tired of", "Chán/ngán việc gì"]]}]}, {"unit": 2, "title": "Sau tính từ + giới từ", "english": "-ing forms", "blocks": [{"type": "example", "text": "My brother’s good at singing."}, {"type": "example", "text": "We are crazy about dancing."}, {"type": "example", "text": "I’m interested in learning languages."}, {"type": "example", "text": "Our cats are afraid of getting wet."}]}, {"unit": 2, "title": "Dùng cụm -ing làm chủ ngữ", "english": "-ing forms", "blocks": [{"type": "text", "text": "Một cụm bắt đầu bằng động từ -ing có thể làm chủ ngữ của câu. Chủ ngữ thường đứng đầu câu; cả cụm chỉ một hoạt động."}, {"type": "example", "text": "Playing online games is a fun thing to do."}, {"type": "example", "text": "Keeping in touch with friends is easy, because of the internet."}]}, {"unit": 3, "title": "Hiện tại đơn: cấu trúc", "english": "Present simple and continuous", "blocks": [{"type": "text", "text": "Dấu / hoặc dấu phẩy trong bảng biểu thị các lựa chọn chủ ngữ/động từ. Chọn một chủ ngữ và dạng động từ tương ứng trong câu thực tế."}]}, {"unit": 3, "title": "Hiện tại đơn: cấu trúc", "english": "Present simple and continuous", "blocks": [{"type": "table", "rows": [["Dạng câu", "I/You/We/They", "He/She/It"], ["Khẳng định", "play / study", "plays / studies"], ["Phủ định", "don’t play / study", "doesn’t play / study"], ["Câu hỏi", "Do I/you/we/they play / study?", "Does he/she/it play / study?"]]}]}, {"unit": 3, "title": "Việc thường xuyên và thói quen", "english": "Present simple and continuous", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn cho việc ta làm đều đặn hoặc điều thường xảy ra."}, {"type": "example", "text": "Most evenings, we play video games after dinner."}, {"type": "example", "text": "My sister doesn’t get home from school till four o’clock."}, {"type": "example", "text": "What time do you start school?"}, {"type": "example", "text": "Our teacher usually helps us with grammar."}]}, {"unit": 3, "title": "Sự thật, hệ thống và quá trình", "english": "Present simple and continuous", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn cho sự thật hoặc điều nhìn chung đúng; dùng để mô tả các hệ thống và quá trình."}, {"type": "example", "text": "My brother doesn’t live near us."}, {"type": "example", "text": "Swimming helps you keep fit."}, {"type": "example", "text": "The Earth goes around the sun."}, {"type": "example", "text": "Water freezes when it gets cold."}]}, {"unit": 3, "title": "Động từ trạng thái", "english": "Present simple and continuous", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn với động từ trạng thái, diễn tả điều ta thích, nghĩ và cảm thấy. Những động từ này thường không dùng ở dạng tiếp diễn: believe, dislike, hate, know, like, love, prefer, remember, think, understand, want, wish."}, {"type": "example", "text": "Sam thinks this is the best café in town."}, {"type": "example", "text": "Jonah doesn’t know where his phone is."}, {"type": "example", "text": "I remember my first ever holiday."}]}, {"unit": 3, "title": "Hiện tại tiếp diễn: cấu trúc", "english": "Present simple and continuous", "blocks": [{"type": "formula", "text": "am/is/are + động từ -ing"}]}, {"unit": 3, "title": "Hiện tại tiếp diễn: cấu trúc", "english": "Present simple and continuous", "blocks": [{"type": "table", "rows": [["Dạng câu", "I", "You/We/They", "He/She/It"], ["Khẳng định", "I’m (am) watching / running.", "You/We/They’re (are) watching / running.", "He/She/It’s (is) watching / running."], ["Phủ định", "I’m not (am not) watching / running.", "You/We/They aren’t (’re not / are not) watching / running.", "He/She/It isn’t (’s not / is not) watching / running."], ["Câu hỏi", "Am I watching / running?", "Are you/we/they watching / running?", "Is he/she/it watching / running?"]]}]}, {"unit": 3, "title": "Hành động hiện tại và kế hoạch đã sắp xếp", "english": "Present simple and continuous", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn cho việc đang xảy ra ngay bây giờ."}, {"type": "example", "text": "We’re sitting on the train at the moment."}, {"type": "meaning", "text": "At the moment = ngay lúc này."}, {"type": "text", "text": "Dùng cho kế hoạch, sự sắp xếp trong tương lai mà ta đã chắc chắn."}, {"type": "example", "text": "I’m meeting some friends after school."}, {"type": "meaning", "text": "Cuộc gặp đã được sắp xếp từ trước."}]}, {"unit": 4, "title": "Tạo dạng quá khứ đơn", "english": "Past simple; used to", "blocks": [{"type": "text", "text": "Thông thường thêm -ed vào động từ nguyên mẫu để tạo quá khứ đơn. Nhiều động từ thông dụng bất quy tắc không có đuôi -ed."}, {"type": "example", "text": "open → opened"}, {"type": "example", "text": "break → broke; feel → felt; put → put; rise → rose"}, {"type": "example", "text": "run → ran; say → said; take → took; think → thought"}, {"type": "text", "text": "Phủ định và câu hỏi dùng didn’t (did not) và did + động từ nguyên mẫu."}]}, {"unit": 4, "title": "Tạo dạng quá khứ đơn", "english": "Past simple; used to", "blocks": [{"type": "example", "text": "I didn’t open the window."}, {"type": "example", "text": "Did she lock the car?"}, {"type": "text", "text": "Be có hai dạng quá khứ: was/wasn’t và were/weren’t."}, {"type": "example", "text": "I wasn’t in school yesterday."}, {"type": "example", "text": "Were you late today?"}]}, {"unit": 4, "title": "Hành động/sự kiện đã hoàn tất", "english": "Past simple; used to", "blocks": [{"type": "text", "text": "Dùng quá khứ đơn cho một hành động hoặc sự kiện đơn lẻ đã kết thúc trong quá khứ."}, {"type": "example", "text": "I grew up in California."}, {"type": "example", "text": "I didn’t learn to drive there."}, {"type": "example", "text": "Did your mum work in the film studios?"}]}, {"unit": 4, "title": "Sự việc ở một thời điểm quá khứ cụ thể", "english": "Past simple; used to", "blocks": [{"type": "example", "text": "I went to a football match last night."}, {"type": "example", "text": "My friends didn’t send me a card on my birthday."}, {"type": "example", "text": "Did you find your phone when you went home?"}]}, {"unit": 4, "title": "Việc lặp lại trong quá khứ", "english": "Past simple; used to", "blocks": [{"type": "text", "text": "Quá khứ đơn cũng diễn tả những việc xảy ra thường xuyên trong quá khứ."}, {"type": "example", "text": "I went to my last school by bike every day."}, {"type": "example", "text": "Didn’t you catch the bus on rainy days?"}]}, {"unit": 4, "title": "Used to: trước đây từng", "english": "Past simple; used to", "blocks": [{"type": "text", "text": "Dùng used to + động từ nguyên mẫu để nói về thói quen hoặc tình huống trong quá khứ mà hiện nay đã khác. Phủ định và câu hỏi dùng use to, không dùng used to sau did/didn’t."}]}, {"unit": 4, "title": "Used to: trước đây từng", "english": "Past simple; used to", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc"], ["Khẳng định", "I/He/She/We/You/They used to go."], ["Phủ định", "I/He/She/We/You/They didn’t use to go."], ["Câu hỏi", "Did I/he/she/we/you/they use to go?"]]}]}, {"unit": 4, "title": "Used to: trước đây từng", "english": "Past simple; used to", "blocks": [{"type": "example", "text": "We used to live in a small flat."}, {"type": "meaning", "text": "Nay chúng tôi không còn sống trong căn hộ nhỏ đó."}, {"type": "example", "text": "They used to cycle everywhere."}, {"type": "meaning", "text": "Nay họ không còn đi xe đạp đến mọi nơi."}, {"type": "example", "text": "I didn’t use to like camping."}, {"type": "meaning", "text": "Trước đây tôi không thích cắm trại; bây giờ tôi thích."}]}, {"unit": 5, "title": "Ôn cấu trúc quá khứ đơn", "english": "Past simple and continuous", "blocks": [{"type": "text", "text": "Be có dạng was/wasn’t, were/weren’t. Động từ thường có quy tắc thêm -ed; nhiều động từ thông dụng bất quy tắc. Câu hỏi dùng did; phủ định dùng didn’t (did not) + động từ nguyên mẫu."}, {"type": "example", "text": "It was cold yesterday."}, {"type": "example", "text": "Were there many people at the party?"}, {"type": "example", "text": "open → opened; think → thought; take → took; put → put"}]}, {"unit": 5, "title": "Ôn cấu trúc quá khứ đơn", "english": "Past simple and continuous", "blocks": [{"type": "example", "text": "I didn’t open the window."}, {"type": "example", "text": "Did she lock the car?"}]}, {"unit": 5, "title": "Quá khứ đơn: sự việc đã kết thúc", "english": "Past simple and continuous", "blocks": [{"type": "text", "text": "Dùng quá khứ đơn cho hành động đã hoàn tất và những điều xảy ra trong quá khứ."}, {"type": "example", "text": "I lived in Russia."}, {"type": "example", "text": "Did the river flood last winter?"}, {"type": "example", "text": "I didn’t go to a party last weekend."}]}, {"unit": 5, "title": "Quá khứ tiếp diễn: cấu trúc", "english": "Past simple and continuous", "blocks": [{"type": "text", "text": "Tạo quá khứ tiếp diễn bằng quá khứ của be + hiện tại phân từ (động từ -ing)."}]}, {"unit": 5, "title": "Quá khứ tiếp diễn: cấu trúc", "english": "Past simple and continuous", "blocks": [{"type": "table", "rows": [["Dạng câu", "I/He/She/It", "You/We/They"], ["Khẳng định", "was eating / sleeping.", "were eating / sleeping."], ["Phủ định", "wasn’t (was not) eating / sleeping.", "weren’t (were not) eating / sleeping."], ["Câu hỏi", "Was I/he/she/it eating / sleeping?", "Were you/we/they eating / sleeping?"]]}]}, {"unit": 5, "title": "Hành động đang diễn ra và bối cảnh câu chuyện", "english": "Past simple and continuous", "blocks": [{"type": "text", "text": "Dùng quá khứ tiếp diễn cho hành động/tình huống đang diễn ra tại một thời điểm trong quá khứ."}, {"type": "example", "text": "It was raining all night."}, {"type": "text", "text": "Dùng để mô tả bối cảnh của một câu chuyện."}, {"type": "example", "text": "We were travelling with some friends and visiting lots of great cities."}]}, {"unit": 5, "title": "Hành động đang diễn ra bị xen vào", "english": "Past simple and continuous", "blocks": [{"type": "text", "text": "Quá khứ tiếp diễn diễn tả hành động đang diễn ra; quá khứ đơn diễn tả hành động ngắn xen vào."}, {"type": "example", "text": "I was waiting for a bus when you texted."}, {"type": "example", "text": "At the time the exam started, I was sitting in a traffic jam."}]}, {"unit": 5, "title": "Động từ trạng thái", "english": "Past simple and continuous", "blocks": [{"type": "text", "text": "Trong cách dùng trạng thái của bài, không dùng quá khứ tiếp diễn với động từ chỉ điều ta thích, nghĩ và cảm thấy: believe, hate, know, like, love, mean, need, own, prefer, understand, want."}, {"type": "example", "text": "I didn’t like the film. I didn’t understand it."}, {"type": "meaning", "text": "Lỗi cần tránh: I wasn’t liking the film. I wasn’t understanding it."}]}, {"unit": 6, "title": "Must, should, ought to", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "text", "text": "Những động từ này không đổi dạng theo chủ ngữ và đứng trước động từ nguyên mẫu khác. Must/should đi trực tiếp với động từ; ought có to. Không thường dùng ought not to."}, {"type": "example", "text": "I must have a shower."}, {"type": "example", "text": "You should eat more vegetables."}, {"type": "example", "text": "He ought to wear a coat."}, {"type": "example", "text": "We mustn’t go into the house."}]}, {"unit": 6, "title": "Must, should, ought to", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "example", "text": "She shouldn’t worry so much."}]}, {"unit": 6, "title": "Have to: dạng thay đổi theo chủ ngữ", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định", "Câu hỏi"], ["I/You/We/They", "have to work.", "don’t have to work.", "Do I/you/we/they have to work?"], ["He/She/It", "has to work.", "doesn’t have to work.", "Does he/she/it have to work?"]]}]}, {"unit": 6, "title": "Must và have to: bắt buộc, hoàn toàn cần thiết", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "example", "text": "You must rest your leg for five days."}, {"type": "example", "text": "I have to leave home at seven o’clock to get the bus."}]}, {"unit": 6, "title": "Mustn’t: không được phép", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "text", "text": "Mustn’t diễn tả việc rất quan trọng là không được làm: một sự cấm đoán."}, {"type": "example", "text": "You mustn’t go into that room."}, {"type": "example", "text": "He mustn’t cycle without a helmet."}]}, {"unit": 6, "title": "Don’t/doesn’t have to: không cần", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "text", "text": "Don’t/doesn’t have to diễn tả không cần thiết làm gì. Khác với mustn’t, người đó vẫn có thể làm nếu muốn."}, {"type": "example", "text": "I don’t have to get to school before eight."}, {"type": "example", "text": "My mother doesn’t have to work at weekends."}]}, {"unit": 6, "title": "Should và ought to: nên", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "text", "text": "Should và ought to chỉ một ý hay/điều nên làm; mức độ nhẹ hơn must và have to."}, {"type": "example", "text": "You should try to relax before your exam."}, {"type": "example", "text": "We ought to finish our homework before we go out."}]}, {"unit": 6, "title": "Shouldn’t: không nên", "english": "Modals: obligation, necessity and advice (1)", "blocks": [{"type": "text", "text": "Shouldn’t diễn tả điều không nên làm, nhẹ hơn mustn’t."}, {"type": "example", "text": "You shouldn’t go out when you’ve got homework to do."}, {"type": "example", "text": "I shouldn’t eat sweets before a meal."}]}, {"unit": 7, "title": "Quá khứ đơn", "english": "Present perfect and past simple", "blocks": [{"type": "meaning", "text": "Xem cấu trúc quá khứ đơn: Unit 4, trang 150."}, {"type": "text", "text": "Dùng quá khứ đơn cho hành động đã hoàn tất, bắt đầu và kết thúc trong quá khứ. Đôi khi câu nêu rõ thời điểm hành động xảy ra."}, {"type": "example", "text": "We spent hours in the recording studio yesterday."}, {"type": "example", "text": "I didn’t finish my song."}, {"type": "example", "text": "Did they learn lots of songs last weekend?"}]}, {"unit": 7, "title": "Hiện tại hoàn thành", "english": "Present perfect and past simple", "blocks": [{"type": "formula", "text": "have/has + quá khứ phân từ (past participle)"}, {"type": "text", "text": "Dùng hiện tại hoàn thành cho điều bắt đầu trong quá khứ và có liên hệ với hiện tại. Phủ định thêm not sau have/has; câu hỏi đưa have/has lên trước chủ ngữ, giữ quá khứ phân từ."}, {"type": "example", "text": "We’ve spent hours in the recording studio."}, {"type": "example", "text": "I haven’t made a recording."}, {"type": "example", "text": "Have you seen this website?"}]}, {"unit": 7, "title": "Just: vừa mới", "english": "Present perfect and past simple", "blocks": [{"type": "text", "text": "Just thường đứng sau have/has và trước động từ chính, diễn tả sự việc vừa xảy ra cách đây ít phút."}, {"type": "example", "text": "I’ve just arrived."}]}, {"unit": 7, "title": "Already: đã ... rồi", "english": "Present perfect and past simple", "blocks": [{"type": "text", "text": "Already có thể đứng sau have/has, trước động từ chính hoặc cuối câu. Trong cách dùng của bài, không dùng already trong câu phủ định. Nó cho biết việc đã xảy ra trước thời điểm hiện tại."}, {"type": "example", "text": "I’ve already made one recording."}, {"type": "example", "text": "I’ve made one recording already."}]}, {"unit": 7, "title": "Yet: cho đến bây giờ", "english": "Present perfect and past simple", "blocks": [{"type": "text", "text": "Dùng yet ở cuối câu phủ định và câu hỏi. Trong phủ định, hành động vẫn chưa hoàn tất; trong câu hỏi, người nói nghĩ người nghe có kế hoạch làm việc đó vào khoảng hiện tại."}, {"type": "example", "text": "I haven’t finished this recording yet."}, {"type": "meaning", "text": "Tôi vẫn đang thực hiện bản thu, chưa xong."}, {"type": "example", "text": "Have you made a recording yet?"}, {"type": "meaning", "text": "Bạn đã thực hiện bản thu theo dự định chưa?"}]}, {"unit": 7, "title": "Ever: đã từng", "english": "Present perfect and past simple", "blocks": [{"type": "text", "text": "Dùng ever trong câu hỏi, trước động từ chính. Nó có nghĩa “vào bất cứ lúc nào từ trước đến nay”, thường hỏi trải nghiệm trong đời."}, {"type": "example", "text": "Have you ever made a recording?"}]}, {"unit": 8, "title": "Cách tạo dạng: tính từ một âm tiết", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Với tính từ một âm tiết, thêm -er để so sánh hơn và -est để so sánh nhất. Nếu tận cùng bằng -e, chỉ thêm -r và -st. Với tận cùng một nguyên âm + một phụ âm, thường gấp đôi phụ âm cuối trước -er/-est."}]}, {"unit": 8, "title": "Cách tạo dạng: tính từ một âm tiết", "english": "Comparative and superlative adjectives", "blocks": [{"type": "table", "rows": [["Tính từ", "So sánh hơn", "So sánh nhất"], ["new", "newer", "(the) newest"], ["light", "lighter", "(the) lightest"], ["nice", "nicer", "(the) nicest"], ["big", "bigger", "(the) biggest"]]}]}, {"unit": 8, "title": "Tận cùng phụ âm + y", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Đổi -y thành -ier và -iest."}, {"type": "example", "text": "tidy → tidier → (the) tidiest"}, {"type": "example", "text": "funny → funnier → (the) funniest"}]}, {"unit": 8, "title": "Tính từ dài và tính từ ghép", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Với tính từ từ hai âm tiết trở lên, thường dùng more và the most. Các tính từ ghép từ hai từ cũng dùng more và the most theo mẫu dưới đây."}, {"type": "example", "text": "active → more active → (the) most active"}, {"type": "example", "text": "modern → more modern → (the) most modern"}, {"type": "example", "text": "user-friendly → more user-friendly → (the) most user-friendly"}]}, {"unit": 8, "title": "Dạng bất quy tắc", "english": "Comparative and superlative adjectives", "blocks": [{"type": "table", "rows": [["Tính từ", "So sánh hơn", "So sánh nhất"], ["good", "better", "(the) best"], ["bad", "worse", "(the) worst"], ["far", "further/farther", "(the) furthest/farthest"]]}]}, {"unit": 8, "title": "So sánh hơn với than", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Khi muốn nói một vật/người có mức độ cao hơn vật/người khác, thường dùng tính từ so sánh hơn + than."}, {"type": "example", "text": "Your bike is newer than mine."}, {"type": "example", "text": "The grammar book was more useful than the dictionary."}]}, {"unit": 8, "title": "Mức độ kém hơn", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Dùng less + tính từ + than, hoặc not as + tính từ + as."}, {"type": "example", "text": "My bike is less new than yours."}, {"type": "example", "text": "The dictionary was less useful than the grammar book."}, {"type": "example", "text": "My bike isn’t as good as yours."}, {"type": "example", "text": "The dictionary wasn’t as useful as the grammar book."}]}, {"unit": 8, "title": "So sánh bằng", "english": "Comparative and superlative adjectives", "blocks": [{"type": "formula", "text": "as + tính từ + as"}, {"type": "text", "text": "Dùng khi hai người/vật có mức độ bằng nhau về đặc điểm đang so sánh."}, {"type": "example", "text": "My bedroom is as big as my brother’s bedroom."}]}, {"unit": 8, "title": "So sánh nhất", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Dùng dạng so sánh nhất khi nói một người/vật hơn hoặc kém tất cả những người/vật còn lại trong nhóm. The least + tính từ diễn tả mức độ thấp nhất."}, {"type": "example", "text": "Your bike is the newest in the race and mine is the oldest."}, {"type": "example", "text": "The grammar book was the most useful."}, {"type": "meaning", "text": "Trong tất cả những cuốn sách đã dùng, sách ngữ pháp hữu ích nhất."}, {"type": "example", "text": "The dictionary was the least useful."}]}, {"unit": 8, "title": "The hoặc từ sở hữu trước so sánh nhất", "english": "Comparative and superlative adjectives", "blocks": [{"type": "text", "text": "Thường dùng the hoặc t
