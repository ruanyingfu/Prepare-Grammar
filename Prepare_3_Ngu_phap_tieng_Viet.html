'use strict';
const units=[{"unit": 1, "english": "Present simple and present continuous", "title": "Hiện tại đơn và hiện tại tiếp diễn", "source_page": "147", "sections": [{"title": "Thì hiện tại đơn", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn để nói về những điều luôn đúng hoặc xảy ra thường xuyên. Thì này thường đi với often, usually, every day, twice a week, v.v."}, {"type": "example", "text": "I usually work hard."}, {"type": "example", "text": "She learns English at school."}, {"type": "example", "text": "Does he work here? No, he doesn’t."}, {"type": "example", "text": "Do they often go to the cinema? Yes, they do."}]}, {"title": "Cách thêm s ở ngôi thứ ba số ít", "blocks": [{"type": "table", "rows": [["Quy tắc", "Ví dụ"], ["Phần lớn động từ: thêm -s", "learns, works, lives, walks"], ["Động từ tận cùng bằng -o, -s, -sh, -ch, -x, -zz: thêm -es", "goes, misses, watches, boxes, buzzes"], ["Động từ tận cùng bằng phụ âm + -y: bỏ -y, thêm -ies", "studies, carries"], ["Động từ bất quy tắc", "have → has"]]}]}, {"title": "Thì hiện tại tiếp diễn", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn để nói về những việc đang xảy ra ngay bây giờ hoặc ở thời điểm hiện tại. Thì này thường đi với now, at the moment, today, this week, v.v."}, {"type": "example", "text": "I’m teaching my brother to swim at the moment."}, {"type": "example", "text": "They’re playing tennis now."}, {"type": "example", "text": "You aren’t practising the piano much this week."}, {"type": "example", "text": "Are we getting fitter? Yes, we are."}]}, {"title": "Cách thêm ing", "blocks": [{"type": "table", "rows": [["Quy tắc", "Ví dụ"], ["Phần lớn động từ: thêm -ing", "playing, going, learning"], ["Tận cùng bằng -e: bỏ -e, thêm -ing", "live → living; make → making"], ["Tận cùng bằng -ie: đổi -ie thành -y, thêm -ing", "lie → lying"], ["Một âm tiết, tận cùng bằng một nguyên âm + một phụ âm (trừ w, x, y): gấp đôi phụ âm, thêm -ing", "sit → sitting; swim → swimming"], ["Hai âm tiết, tận cùng bằng một nguyên âm có trọng âm + một phụ âm: gấp đôi phụ âm, thêm -ing", "begin → beginning (nhưng open → opening)"], ["Tiếng Anh Anh: gấp đôi l cuối trong travel", "travel → travelling (tiếng Anh Mỹ: travel → traveling)"]]}]}]}, {"unit": 2, "english": "Verbs we don’t usually use in the continuous", "title": "Động từ thường không dùng ở thì tiếp diễn", "source_page": "148", "sections": [{"title": "Các nhóm động từ thường không dùng", "blocks": [{"type": "text", "text": "Một số động từ thường không dùng ở thì hiện tại tiếp diễn."}, {"type": "text", "text": "Động từ chỉ suy nghĩ: believe, understand, know, think, mean, hope."}, {"type": "example", "text": "Scientists believe the Earth is 4.6 billion years old."}, {"type": "meaning", "text": "Không dùng: Scientists are believing …"}, {"type": "text", "text": "Động từ chỉ thích hoặc không thích, mong muốn và nhu cầu: like, hate, love, want, need, prefer."}, {"type": "example", "text": "I like those monkeys over there."}, {"type": "meaning", "text": "Không dùng: I’m liking …"}, {"type": "text", "text": "Động từ chỉ sở hữu: own, belong, have."}, {"type": "example", "text": "That coat belongs to me."}, {"type": "meaning", "text": "Không dùng: That coat’s belonging …"}, {"type": "text", "text": "Động từ chỉ cảm giác: see, feel, hear, smell, taste."}, {"type": "example", "text": "The water feels very cold."}]}, {"title": "Cảm giác ở thời điểm hiện tại", "blocks": [{"type": "text", "text": "Tuy nhiên, có thể dùng hiện tại tiếp diễn để nói một người trông như thế nào hoặc cảm thấy thế nào ngay lúc này."}, {"type": "example", "text": "How do you feel today? I feel better."}, {"type": "example", "text": "How are you feeling today? I’m feeling better."}, {"type": "meaning", "text": "Hai cách trên đều dùng được."}, {"type": "text", "text": "Ta thường dùng can với các động từ chỉ cảm giác này."}, {"type": "example", "text": "I can hear the sea from my bedroom."}, {"type": "meaning", "text": "Không dùng: I’m hearing."}]}, {"title": "Hai cách dùng của think", "blocks": [{"type": "text", "text": "Khi think mang nghĩa “có ý kiến hoặc nhận định” về điều gì, ta không dùng dạng tiếp diễn."}, {"type": "example", "text": "Scientists think there are about 1,000 wild pandas left."}, {"type": "meaning", "text": "Không dùng: Scientists are thinking …"}, {"type": "text", "text": "Khi think mang nghĩa “cân nhắc”, ta dùng dạng tiếp diễn."}, {"type": "example", "text": "I’m thinking of working in a zoo when I’m older."}]}]}, {"unit": 3, "english": "Past simple and subject questions", "title": "Quá khứ đơn và câu hỏi về chủ ngữ", "source_page": "149", "sections": [{"title": "Quá khứ đơn của be", "blocks": [{"type": "meaning", "text": "Dấu / phân cách các lựa chọn chủ ngữ; không đọc các đại từ thành một chủ ngữ ghép."}, {"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / He / She / It was at home.\nYou / We / They were at school."], ["Phủ định", "I / He / She / It wasn’t at school.\nYou / We / They weren’t at home."], ["Câu hỏi", "Was I / he / she / it at home?\nWere you / we / they at school?"], ["Trả lời ngắn", "Yes, I / he / she / it was.\nNo, I / he / she / it wasn’t.\nYes, you / we / they were.\nNo, you / we / they weren’t."]]}]}, {"title": "Động từ có quy tắc và bất quy tắc", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / You / He / She / It / We / They climbed …\nI / You / He / She / It / We / They knew …"], ["Phủ định", "I / You / He / She / It / We / They didn’t want …\nI / You / He / She / It / We / They didn’t write …"], ["Câu hỏi", "Did I / you / he / she / it / we / they travel?\nDid I / you / he / she / it / we / they fly?"], ["Trả lời ngắn", "Yes, I / you / he / she / it / we / they did.\nNo, I / you / he / she / it / we / they didn’t."]]}, {"type": "text", "text": "Dùng quá khứ đơn để nói về những việc đã xảy ra hoặc không xảy ra trong quá khứ."}, {"type": "example", "text": "Simon and I travelled by tram to the bus station."}, {"type": "example", "text": "We didn’t want my parents to drive us."}]}, {"title": "Cách thêm ed", "blocks": [{"type": "table", "rows": [["Quy tắc", "Ví dụ"], ["Phần lớn động từ: thêm -ed", "play → played; climb → climbed"], ["Tận cùng bằng -e: thêm -d", "decide → decided; arrive → arrived"], ["Tận cùng bằng phụ âm + -y: đổi -y thành -i, thêm -ed", "carry → carried"], ["Một âm tiết, tận cùng bằng một nguyên âm + một phụ âm (trừ w, x, y): gấp đôi phụ âm, thêm -ed", "stop → stopped"], ["Hai âm tiết, tận cùng bằng một nguyên âm có trọng âm + một phụ âm: gấp đôi phụ âm, thêm -ed", "prefer → preferred"], ["Tiếng Anh Anh: gấp đôi l cuối trong travel", "travel → travelled (tiếng Anh Mỹ: travel → traveled)"]]}, {"type": "meaning", "text": "Xem bảng động từ bất quy tắc ở trang 167."}]}, {"title": "Câu hỏi về chủ ngữ", "blocks": [{"type": "text", "text": "Thông thường, ta dùng do hoặc did trong câu hỏi."}, {"type": "example", "text": "Where do you live?"}, {"type": "example", "text": "What did you eat yesterday?"}, {"type": "text", "text": "Tuy nhiên, nếu từ hỏi (who, what, v.v.) chính là chủ ngữ, ta không dùng do hoặc did."}, {"type": "example", "text": "Who helped you? My mum helped me."}, {"type": "meaning", "text": "Hỏi về chủ ngữ: Who tương ứng với My mum, người thực hiện hành động helped."}, {"type": "example", "text": "Who did you help? I helped my sister."}, {"type": "meaning", "text": "Hỏi về tân ngữ: Who tương ứng với my sister, người nhận hành động help."}]}]}, {"unit": 4, "english": "Past continuous and past simple", "title": "Quá khứ tiếp diễn và quá khứ đơn", "source_page": "150", "sections": [{"title": "Cấu trúc quá khứ tiếp diễn", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / He / She / It was eating a sandwich.\nYou / We / They were standing on the balcony."], ["Phủ định", "I / He / She / It wasn’t working in the garden.\nYou / We / They weren’t reading a book."], ["Câu hỏi", "Was I / he / she / it building some cupboards?\nWere you / we / they painting the gate?"], ["Trả lời ngắn", "Yes, I / he / she / it was.\nNo, he / she / it wasn’t.\nYes, you / we / they were.\nNo, you / we / they weren’t."]]}, {"type": "meaning", "text": "Xem cách thêm -ing ở Unit 1, trang 147."}]}, {"title": "Khi dùng quá khứ tiếp diễn", "blocks": [{"type": "text", "text": "Dùng quá khứ tiếp diễn để miêu tả những hoạt động đang diễn ra tại một thời điểm cụ thể trong quá khứ. Đôi khi các hoạt động xảy ra cùng lúc. Ta không tập trung vào lúc chúng bắt đầu hoặc kết thúc."}, {"type": "example", "text": "Mum and Dad were cooking, my brother was playing and I was doing my homework."}, {"type": "text", "text": "Trong cách dùng của bài này, dùng quá khứ tiếp diễn sau while để nói về một hành động hoặc sự việc kéo dài, xảy ra đồng thời với một hành động khác."}, {"type": "example", "text": "While Gary was painting the bedroom, Paula was painting the living room."}]}, {"title": "Khi dùng quá khứ đơn", "blocks": [{"type": "text", "text": "Dùng quá khứ đơn khi một hành động xảy ra sau một hành động khác."}, {"type": "example", "text": "I put on my coat and I left the house. Then, it started to rain."}, {"type": "text", "text": "Trong cách dùng của bài này, dùng quá khứ đơn sau when để nói về một hành động hoặc sự việc ngắn hơn, xảy ra giữa một hành động kéo dài hoặc làm gián đoạn hành động đó."}, {"type": "example", "text": "I was putting on my coat when it started to rain."}, {"type": "meaning", "text": "Xem quá khứ đơn ở Unit 3, trang 149."}]}]}, {"unit": 5, "english": "Comparative and superlative adverbs", "title": "So sánh hơn và so sánh nhất của trạng từ", "source_page": "151", "sections": [{"title": "Các dạng trạng từ", "blocks": [{"type": "table", "rows": [["Tính từ", "Trạng từ", "So sánh hơn", "So sánh nhất"], ["slow", "slowly", "more slowly", "the most slowly"], ["easy", "easily", "more easily", "the most easily"], ["simple", "simply", "more simply", "the most simply"], ["beautiful", "beautifully", "more beautifully", "the most beautifully"], ["good", "well", "better", "the best"], ["fast", "fast", "faster", "the fastest"], ["hard", "hard", "harder", "the hardest"], ["late", "late", "later", "the latest"]]}, {"type": "meaning", "text": "Bốn dòng đầu là các dạng có quy tắc; bốn dòng cuối là các dạng bất quy tắc trong bảng trên."}, {"type": "text", "text": "Tính từ miêu tả danh từ; trạng từ miêu tả động từ."}, {"type": "text", "text": "Phần lớn trạng từ được tạo bằng cách thêm -ly vào tính từ."}, {"type": "example", "text": "bad → badly, careful → carefully, easy → easily"}, {"type": "text", "text": "Một số trạng từ không tận cùng bằng -ly."}, {"type": "example", "text": "good → well, fast → fast, hard → hard, late → late"}]}, {"title": "So sánh hơn của trạng từ", "blocks": [{"type": "text", "text": "Dùng so sánh hơn của trạng từ để so sánh hai đối tượng."}, {"type": "example", "text": "My brother talks more quickly than me."}, {"type": "text", "text": "Dùng more với trạng từ tận cùng bằng -ly."}, {"type": "example", "text": "Jack did the exam more carefully than Nick."}, {"type": "text", "text": "Từ có nghĩa trái với more là less."}, {"type": "example", "text": "Nick did the exam less carefully than Jack."}, {"type": "text", "text": "Thêm -er vào fast, hard và late."}, {"type": "example", "text": "Peter swims faster than Mike. Jim arrived later than me."}, {"type": "text", "text": "Dạng so sánh hơn của well là better."}, {"type": "example", "text": "My sister speaks French better than my mum."}, {"type": "text", "text": "Dạng so sánh hơn của badly là worse."}, {"type": "example", "text": "I did much worse in my exam than Theo."}, {"type": "text", "text": "Cũng có thể dùng often để so sánh tần suất."}, {"type": "example", "text": "I play tennis more often than basketball."}]}, {"title": "So sánh với as", "blocks": [{"type": "text", "text": "Cũng có thể dùng (not) as + trạng từ + as để so sánh."}, {"type": "example", "text": "Oliver talks as loudly as Phil."}, {"type": "meaning", "text": "Oliver và Phil đều nói to như nhau."}, {"type": "example", "text": "Jane doesn’t write as quickly as Paula."}, {"type": "meaning", "text": "Paula viết nhanh hơn Jane."}]}, {"title": "So sánh nhất của trạng từ", "blocks": [{"type": "text", "text": "Dùng so sánh nhất của trạng từ để so sánh một đối tượng với ít nhất hai đối tượng khác."}, {"type": "example", "text": "My dad walks the most slowly in our family."}, {"type": "text", "text": "Dùng most với trạng từ tận cùng bằng -ly."}, {"type": "example", "text": "Of all our teachers, our maths teacher speaks the most quickly."}, {"type": "text", "text": "Từ có nghĩa trái với most là least."}, {"type": "example", "text": "Kevin did his exam the least carefully."}, {"type": "text", "text": "Thêm -est vào fast, hard và late."}, {"type": "example", "text": "Jason ran the fastest, so he won the race."}, {"type": "text", "text": "Dạng so sánh nhất của well là the best."}, {"type": "example", "text": "My grandma cooks the best in my house."}, {"type": "text", "text": "Dạng so sánh nhất của badly là the worst."}, {"type": "example", "text": "None of the teams played very well, but our team played the worst."}, {"type": "text", "text": "Cũng có thể dùng often để so sánh tần suất."}, {"type": "example", "text": "When I was young, I played football the most often."}]}]}, {"unit": 6, "english": "Possession", "title": "Cách diễn đạt sự sở hữu", "source_page": "152", "sections": [{"title": "Sở hữu cách với dấu nháy", "blocks": [{"type": "text", "text": "Dùng ’s (dấu nháy + s) để diễn đạt sự sở hữu của người và động vật."}, {"type": "example", "text": "That’s my brother’s hat."}, {"type": "meaning", "text": "Trong bài này, tránh dùng: the hat of my brother."}, {"type": "example", "text": "Where’s the cat’s bowl?"}, {"type": "meaning", "text": "Trong bài này, tránh dùng: the bowl of the cat."}, {"type": "text", "text": "Với danh từ số ít, dùng ’s."}, {"type": "example", "text": "my mum’s necklace, my teacher’s ring"}, {"type": "text", "text": "Với danh từ số nhiều tận cùng bằng -s, đặt dấu nháy (’) sau danh từ số nhiều."}, {"type": "example", "text": "my friends’ shoes"}, {"type": "meaning", "text": "Trong bài này, tránh dùng: the shoes of my friends."}, {"type": "example", "text": "my cousins’ jackets"}, {"type": "meaning", "text": "Trong bài này, tránh dùng: the jackets of my cousins."}, {"type": "text", "text": "Nếu danh từ số nhiều không tận cùng bằng -s (ví dụ children, men, women, people), dùng ’s."}, {"type": "example", "text": "The children’s bedroom is over there."}]}, {"title": "Từ hạn định và đại từ sở hữu", "blocks": [{"type": "table", "rows": [["Từ hạn định sở hữu", "Đại từ sở hữu"], ["my", "mine"], ["your", "yours"], ["his", "his"], ["her", "hers"], ["our", "ours"], ["their", "theirs"]]}, {"type": "text", "text": "Dùng đại từ sở hữu để thay cho cụm từ hạn định sở hữu + danh từ."}, {"type": "example", "text": "Is that my pencil on your desk? No, yours is over there."}, {"type": "meaning", "text": "yours = your pencil (bút chì của bạn)."}, {"type": "example", "text": "Is this your jacket? No, it’s hers."}, {"type": "meaning", "text": "hers = her jacket (áo khoác của cô ấy)."}, {"type": "example", "text": "Who do these books belong to? They’re ours."}, {"type": "meaning", "text": "ours = our books (sách của chúng tôi)."}]}, {"title": "Cấu trúc a friend of mine", "blocks": [{"type": "text", "text": "Có thể dùng a friend of mine/yours/his, v.v. thay cho one of my/your/his, v.v. friends để nói “một người bạn của tôi/bạn/anh ấy”."}, {"type": "example", "text": "This ball belongs to a friend of mine. He lent it to me."}, {"type": "meaning", "text": "Không dùng: a friend of me."}, {"type": "example", "text": "Neil finished his homework. A classmate of his helped him."}, {"type": "meaning", "text": "Không dùng: a classmate of him."}]}]}, {"unit": 7, "english": "Present continuous for future", "title": "Hiện tại tiếp diễn diễn đạt tương lai", "source_page": "153", "sections": [{"title": "Việc đang xảy ra và kế hoạch tương lai", "blocks": [{"type": "meaning", "text": "Xem hiện tại tiếp diễn ở Unit 1, trang 147."}, {"type": "text", "text": "Ta thường dùng hiện tại tiếp diễn để nói về những việc đang xảy ra ngay bây giờ hoặc tại thời điểm hiện tại."}, {"type": "example", "text": "Tim’s in the park. He’s climbing a tree."}, {"type": "text", "text": "Cũng có thể dùng hiện tại tiếp diễn để nói về kế hoạch và những việc đã sắp xếp cho tương lai."}, {"type": "example", "text": "I’m meeting Julie later. We’re playing tennis."}]}, {"title": "Cụm từ chỉ thời gian tương lai", "blocks": [{"type": "text", "text": "Khi dùng hiện tại tiếp diễn để nói về tương lai, ta thường thêm một cụm từ chỉ thời gian tương lai (later, on Monday morning, at 6 pm tomorrow, v.v.) để làm rõ rằng ta đang nói về tương lai."}, {"type": "example", "text": "We’re learning how to ski."}, {"type": "meaning", "text": "Đang học trượt tuyết ngay lúc này."}, {"type": "example", "text": "We’re learning how to ski next weekend."}, {"type": "meaning", "text": "Việc đã sắp xếp cho cuối tuần tới."}]}]}, {"unit": 8, "english": "Future with will and future with may / might", "title": "Tương lai với will và may hoặc might", "source_page": "154", "sections": [{"title": "Cấu trúc với will", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / You / He / She / It / We / They’ll (will) be very different in the future."], ["Phủ định", "I / You / He / She / It / We / They won’t (will not) live in big houses."], ["Câu hỏi", "Will I / you / he / she / it / we / they drive cars?"], ["Trả lời ngắn", "Yes, I / you / he / she / it / we / they will.\nNo, I / you / he / she / it / we / they won’t (will not)."]]}]}, {"title": "Cách dùng will", "blocks": [{"type": "text", "text": "Dùng will để nói về những điều ta nghĩ chắc chắn sẽ xảy ra trong tương lai."}, {"type": "example", "text": "Everyone will live in big cities in the future."}, {"type": "example", "text": "We won’t live in small towns."}, {"type": "text", "text": "Ta thường dùng những cụm như I think, I hope, I’m sure hoặc I’m certain với will."}, {"type": "example", "text": "I think I’ll work in a big bank."}, {"type": "example", "text": "I’m sure my friends won’t live in the same town."}]}, {"title": "Cấu trúc với may và might", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / You / He / She / It / We / They may / might book the hotel today."], ["Phủ định", "I / You / He / She / It / We / They may not / might not ring you later."]]}]}, {"title": "Khả năng trong tương lai", "blocks": [{"type": "text", "text": "Dùng may và might để nói về những điều có thể xảy ra trong tương lai."}, {"type": "example", "text": "It may rain tomorrow."}, {"type": "meaning", "text": "Người nói chưa chắc chắn."}, {"type": "example", "text": "We might go for a walk later."}, {"type": "meaning", "text": "Chúng tôi chưa chắc chắn."}, {"type": "text", "text": "Khi nói về khả năng trong tương lai ở bài này, may và might có cùng ý nghĩa."}, {"type": "example", "text": "I may / might buy some new trainers tomorrow. Mine are very old."}, {"type": "example", "text": "Jack’s feeling ill. He may not / might not go to school tomorrow."}, {"type": "text", "text": "Ta ít dùng may hoặc might để hỏi về khả năng trong tương lai; thường dùng will."}, {"type": "example", "text": "What will you take on the school trip?"}, {"type": "example", "text": "I may take my sun hat and I might take my sunglasses."}]}]}, {"unit": 9, "english": "Must, must not (mustn’t), have to, don’t have to", "title": "Must và have to diễn đạt nghĩa vụ", "source_page": "155", "sections": [{"title": "Must và mustn’t", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / You / He / She / It / We / They must go."], ["Phủ định", "I / You / He / She / It / We / They mustn’t go."]]}, {"type": "text", "text": "Dùng must và mustn’t để nói về quy định và nghĩa vụ: must diễn đạt việc phải làm; mustn’t diễn đạt việc không được làm."}, {"type": "example", "text": "You must switch off your mobile phone in class."}, {"type": "example", "text": "You mustn’t eat or drink in the classroom."}, {"type": "text", "text": "Ta ít dùng must trong câu hỏi. Thường dùng Do (I, you, v.v.) have to …?"}, {"type": "example", "text": "Do I have to wear a swimming hat?"}]}, {"title": "Have to và don’t have to", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / You / We / They have to go.\nHe / She / It has to go."], ["Phủ định", "I / You / We / They don’t (do not) have to go.\nHe / She / It doesn’t (does not) have to go."], ["Câu hỏi", "Do I / you / we / they have to go?\nDoes he / she / it have to go?"], ["Trả lời ngắn", "Yes, I / you / we / they do.\nYes, he / she / it does.\nNo, I / you / we / they don’t.\nNo, he / she / it doesn’t."]]}, {"type": "text", "text": "Dùng have to để nói một việc là cần thiết; dùng don’t have to để nói một việc không cần thiết."}, {"type": "example", "text": "You have to bring sandwiches."}, {"type": "meaning", "text": "Bạn cần mang bánh mì kẹp."}, {"type": "example", "text": "You don’t have to bring a drink."}, {"type": "meaning", "text": "Bạn không cần mang đồ uống."}]}, {"title": "Phân biệt mustn’t và don’t have to", "blocks": [{"type": "text", "text": "Must và have to có ý nghĩa tương tự trong các cách dùng của bài này."}, {"type": "example", "text": "I’ve got a test tomorrow. I must study. or I have to study."}, {"type": "text", "text": "Mustn’t và don’t have to có ý nghĩa khác nhau."}, {"type": "example", "text": "You mustn’t be late for class."}, {"type": "meaning", "text": "Bạn không được đi học muộn. Đây là quy định."}, {"type": "example", "text": "You don’t have to bring your own equipment."}, {"type": "meaning", "text": "Không cần mang dụng cụ riêng, nhưng bạn có thể mang nếu muốn."}]}, {"title": "Nghĩa vụ trong quá khứ", "blocks": [{"type": "text", "text": "Trong quá khứ, dùng had to thay cho must và have to."}, {"type": "example", "text": "I didn’t watch the film because I had to study."}, {"type": "text", "text": "Dạng quá khứ của don’t have to và do you have to là didn’t have to và did you have to."}, {"type": "example", "text": "Did you have to stay at school late yesterday? No, I didn’t."}, {"type": "example", "text": "My mum didn’t have to go to work this morning, so she drove me to school."}]}]}, {"unit": 10, "english": "Verb patterns — gerunds and infinitives", "title": "Dạng động từ theo sau động từ khác", "source_page": "156", "sections": [{"title": "Danh động từ và động từ nguyên mẫu có to", "blocks": [{"type": "text", "text": "Khi hai động từ đi cùng nhau trong một câu, động từ thứ hai thường ở dạng danh động từ (gerund: sleeping, swimming, v.v.) hoặc động từ nguyên mẫu có to (infinitive: to sleep, to swim)."}, {"type": "example", "text": "I want to meet my new neighbours."}, {"type": "example", "text": "I don’t mind helping close friends."}, {"type": "text", "text": "Sau một số động từ, dùng động từ nguyên mẫu có to."}, {"type": "example", "text": "We hope to see you soon."}, {"type": "example", "text": "He’s learning to play the guitar."}, {"type": "text", "text": "Sau những động từ khác, dùng danh động từ."}, {"type": "example", "text": "He finished doing his homework and watched TV."}, {"type": "example", "text": "My dad enjoys playing chess."}]}, {"title": "Động từ dùng được cả hai dạng", "blocks": [{"type": "text", "text": "Sau start, begin, prefer, like, love, có thể dùng danh động từ hoặc động từ nguyên mẫu có to."}, {"type": "example", "text": "We went to the beach, but then it started raining."}, {"type": "example", "text": "… it started to rain."}, {"type": "meaning", "text": "Hai cách trên đều dùng được."}, {"type": "example", "text": "My friends began playing that game two hours ago."}, {"type": "example", "text": "My friends began to play …"}, {"type": "meaning", "text": "Hai cách trên đều dùng được."}]}, {"title": "Danh động từ sau giới từ", "blocks": [{"type": "text", "text": "Cũng dùng danh động từ sau giới từ (at, in, for, v.v.)."}, {"type": "example", "text": "Thank you for inviting me to your party."}, {"type": "example", "text": "I’m thinking of buying a new bike."}]}, {"title": "Bảng các nhóm động từ", "blocks": [{"type": "table", "rows": [["Dạng theo sau", "Động từ trong sách"], ["Động từ + danh động từ", "finish, don’t mind, enjoy, miss"], ["Động từ + nguyên mẫu có to", "decide, choose, learn, help, hope, plan, want, need"], ["Dùng được cả danh động từ và nguyên mẫu có to", "start, begin, prefer, like, love"]]}]}, {"title": "Danh động từ làm chủ ngữ", "blocks": [{"type": "text", "text": "Có thể dùng danh động từ làm chủ ngữ của một động từ."}, {"type": "example", "text": "Joining the film club was a really good idea."}]}]}, {"unit": 11, "english": "Determiners", "title": "Từ hạn định", "source_page": "157", "sections": [{"title": "Mạo từ a và an", "blocks": [{"type": "text", "text": "Dùng a hoặc an khi nhắc tới một đối tượng lần đầu và khi nói chung về các đối tượng."}, {"type": "example", "text": "I visited a museum in Paris."}, {"type": "example", "text": "I bought an ice cream and a can of lemonade."}]}, {"title": "Mạo từ the", "blocks": [{"type": "text", "text": "Dùng the khi nói về một đối tượng đã được nhắc tới."}, {"type": "example", "text": "I visited a museum in Paris. The museum was very old."}, {"type": "text", "text": "Dùng the trước dạng so sánh nhất."}, {"type": "example", "text": "London is the biggest city in England."}, {"type": "text", "text": "Dùng the trước first, second, v.v."}, {"type": "example", "text": "The first man to walk on the moon was Neil Armstrong."}, {"type": "text", "text": "Dùng the khi chỉ có một đối tượng trong ngữ cảnh đang nói tới."}, {"type": "example", "text": "I went to the sea to swim."}, {"type": "meaning", "text": "Trong ngữ cảnh này, chỉ có một vùng biển ở gần."}]}, {"title": "Both và all", "blocks": [{"type": "text", "text": "Dùng both để nói về hai đối tượng."}, {"type": "example", "text": "Both Rachel and Ruth enjoy going to the theatre."}, {"type": "meaning", "text": "Không dùng: The both Rachel and Ruth …"}, {"type": "text", "text": "Dùng all để nói về toàn bộ số người hoặc vật."}, {"type": "example", "text": "We visited all the museums in the city."}]}, {"title": "Another và other", "blocks": [{"type": "text", "text": "Dùng another với danh từ số ít để nói về “một người hoặc vật khác”. Another được viết thành một từ."}, {"type": "example", "text": "This café is closed. There’s another one over there."}, {"type": "text", "text": "Dùng other với danh từ số nhiều và danh từ không đếm được để nói chung về người hoặc vật khác với những đối tượng đang được nhắc tới."}, {"type": "example", "text": "We wanted to see the palace and the cathedral, but my sister wanted to visit other places."}, {"type": "meaning", "text": "Không dùng: another places."}, {"type": "example", "text": "Were there other people there?"}]}, {"title": "The other", "blocks": [{"type": "text", "text": "Dùng the other với danh từ số ít hoặc số nhiều để nói về một hoặc nhiều đối tượng còn lại đã được nhắc tới."}, {"type": "example", "text": "We didn’t eat in the other restaurant."}, {"type": "meaning", "text": "Ta biết chỉ có hai nhà hàng; the other restaurant là nhà hàng còn lại."}, {"type": "example", "text": "The other famous places to visit are all in the old town."}, {"type": "meaning", "text": "Ta đang nói về một danh sách các địa điểm nổi tiếng."}]}]}, {"unit": 12, "english": "Relative pronouns who, which, that", "title": "Đại từ quan hệ who which và that", "source_page": "158", "sections": [{"title": "Bổ sung thông tin bằng mệnh đề", "blocks": [{"type": "text", "text": "Dùng who, which và that với một mệnh đề ngắn để bổ sung thông tin về người hoặc vật."}, {"type": "example", "text": "An actor is a person who plays a part in a film or play."}, {"type": "example", "text": "A thriller is a type of film which is very exciting."}]}, {"title": "Who dùng cho người", "blocks": [{"type": "text", "text": "Dùng who với người."}, {"type": "example", "text": "A fan is a person who loves watching, reading or listening to something."}]}, {"title": "Which dùng cho vật", "blocks": [{"type": "text", "text": "Dùng which với vật."}, {"type": "example", "text": "Horror is a type of film which is too frightening for young children."}]}, {"title": "That dùng cho người hoặc vật", "blocks": [{"type": "text", "text": "Trong các mệnh đề của bài này, có thể dùng that cho người hoặc vật."}, {"type": "example", "text": "My sister is someone that loves all science fiction stories."}, {"type": "example", "text": "3D films are films that make everything on screen seem more real."}]}]}, {"unit": 13, "english": "Present perfect with ever and never", "title": "Hiện tại hoàn thành với ever và never", "source_page": "159", "sections": [{"title": "Cấu trúc hiện tại hoàn thành", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc và ví dụ"], ["Khẳng định", "I / You / We / They’ve (have) talked.\nHe / She / It’s (has) decided."], ["Phủ định", "I / You / We / They haven’t (have not) gone.\nHe / She / It hasn’t (has not) taken."], ["Câu hỏi", "Have I / you / we / they painted?\nHas he / she / it worked?"], ["Trả lời ngắn", "Yes, I / you / we / they have.\nNo, I / you / we / they haven’t.\nYes, he / she / it has.\nNo, he / she / it hasn’t."]]}, {"type": "text", "text": "Có thể dùng hiện tại hoàn thành để nói về những trải nghiệm trước thời điểm hiện tại."}, {"type": "example", "text": "I’ve tried rock climbing."}, {"type": "text", "text": "Cấu trúc gồm have/has + quá khứ phân từ (past participle)."}, {"type": "example", "text": "My sister hasn’t slept in a tent."}]}, {"title": "Quá khứ phân từ", "blocks": [{"type": "text", "text": "Với động từ có quy tắc, quá khứ phân từ được viết giống dạng quá khứ đơn. Xem quy tắc chính tả ở Unit 3."}, {"type": "example", "text": "My mum has worked for a famous magazine."}, {"type": "text", "text": "Với động từ bất quy tắc trong cách trình bày của bài này, quá khứ phân từ không được tạo bằng quy tắc thêm -ed."}, {"type": "example", "text": "I have spoken to a film star."}, {"type": "meaning", "text": "Xem bảng quá khứ phân từ ở trang 167."}]}, {"title": "Ever và never", "blocks": [{"type": "text", "text": "Đôi khi dùng ever trong câu hỏi hiện tại hoàn thành để diễn đạt “đã từng trong đời”."}, {"type": "example", "text": "Have you ever climbed a tree?"}, {"type": "text", "text": "Đôi khi dùng never trong câu trần thuật hiện tại hoàn thành để diễn đạt “chưa bao giờ trong đời”."}, {"type": "example", "text": "My grandparents have never flown in a plane."}]}, {"title": "Không đi với thời điểm quá khứ đã kết thúc", "blocks": [{"type": "text", "text": "Trong cách dùng của bài này, không dùng những cụm chỉ thời gian quá khứ như yesterday, last weekend, two days ago, v.v. với hiện tại hoàn thành. Dùng chúng với quá khứ đơn."}, {"type": "example", "text": "I played tennis yesterday."}, {"type": "meaning", "text": "Không dùng: I’ve played tennis yesterday."}]}]}, {"unit": 14, "english": "Present perfect with just, yet and already", "title": "Hiện tại hoàn thành với just yet và already", "source_page": "160", "sections": [{"title": "Các ví dụ mở đầu", "blocks": [{"type": "meaning", "text": "Xem hiện tại hoàn thành ở Unit 13, trang 159."}, {"type": "text", "text": "Có thể dùng hiện tại hoàn thành với just, yet và already."}, {"type": "example", "text": "I’ve just bought a new pair of shoes. Do you like them?"}, {"type": "example", "text": "I’m full. I’ve already eaten five slices of pizza."}, {"type": "example", "text": "Have you seen that film yet?"}, {"type": "example", "text": "No, I haven’t seen it yet, but I’m going to see it tomorrow."}]}, {"title": "Just diễn đạt vừa mới", "blocks": [{"type": "text", "text": "Dùng hiện tại hoàn thành với just để nói một việc vừa xảy ra cách đây rất ít thời gian. Just đứng giữa have/has và quá khứ phân từ."}, {"type": "example", "text": "Would you like something to eat? No, thanks. I’ve just eaten."}, {"type": "meaning", "text": "Người nói vừa ăn cách đây rất ít thời gian."}]}, {"title": "Already diễn đạt đã rồi", "blocks": [{"type": "text", "text": "Dùng hiện tại hoàn thành với already để nói một việc đã xảy ra trước thời điểm hiện tại, thường sớm hơn dự kiến. Already thường dùng trong câu khẳng định và thường đứng giữa have/has với quá khứ phân từ."}, {"type": "example", "text": "Mum: You should do your homework."}, {"type": "example", "text": "Son: I’ve already done it."}, {"type": "meaning", "text": "Người con đã làm xong bài tập sớm hơn mẹ nghĩ."}]}, {"title": "Yet diễn đạt tính đến lúc này", "blocks": [{"type": "text", "text": "Dùng hiện tại hoàn thành với yet để hỏi hoặc nói về việc tính đến thời điểm hiện tại. Ta thường nghĩ việc đó có thể xảy ra trong tương lai. Yet thường đứng cuối câu hỏi hoặc câu phủ định."}, {"type": "example", "text": "Dave: Have you been to the new café yet?"}, {"type": "example", "text": "Sue: No, I haven’t been yet."}, {"type": "meaning", "text": "Sue có thể sẽ tới quán cà phê trong tương lai."}]}]}, {"unit": 15, "english": "Present perfect with since and for", "title": "Hiện tại hoàn thành với since và for", "source_page": "161", "sections": [{"title": "Từ quá khứ đến hiện tại", "blocks": [{"type": "meaning", "text": "Xem hiện tại hoàn thành ở Unit 13, trang 159."}, {"type": "text", "text": "Có thể dùng hiện tại hoàn thành để nói về một hành động hoặc tình trạng bắt đầu trong quá khứ và vẫn tiếp tục ở hiện tại. Dùng since và for để nói việc đó đã kéo dài bao lâu."}, {"type": "example", "text": "We’ve lived in this house since March."}, {"type": "example", "text": "We’ve lived in this house for four months."}]}, {"title": "Since đi với mốc bắt đầu", "blocks": [{"type": "text", "text": "Dùng since với thời điểm hành động hoặc tình trạng bắt đầu."}, {"type": "example", "text": "I’ve had this computer since 2013, January, my birthday, etc."}, {"type": "meaning", "text": "2013, January và my birthday là các mốc thời gian lựa chọn thay thế trong ví dụ."}]}, {"title": "For đi với khoảng thời gian", "blocks": [{"type": "text", "text": "Dùng for với một khoảng thời gian, chẳng hạn số giờ, tháng, năm, v.v."}, {"type": "example", "text": "My dad’s worked in that bank for eight weeks, six months, two years, etc."}, {"type": "meaning", "text": "eight weeks, six months và two years là các khoảng thời gian lựa chọn thay thế trong ví dụ."}]}, {"title": "How long hỏi đã bao lâu", "blocks": [{"type": "text", "text": "Ta thường dùng how long với hiện tại hoàn thành để đặt câu hỏi."}, {"type": "example", "text": "How long have you had your dog?"}, {"type": "example", "text": "We’ve had it since last year / for 11 months."}]}]}, {"unit": 16, "english": "Present perfect and past simple", "title": "Hiện tại hoàn thành và quá khứ đơn", "source_page": "162", "sections": [{"title": "Hiện tại hoàn thành và kết quả hiện tại", "blocks": [{"type": "meaning", "text": "Xem quá khứ đơn ở Unit 3, trang 149; hiện tại hoàn thành ở Units 13–15, trang 159–161."}, {"type": "text", "text": "Dùng hiện tại hoàn thành để nói về hành động đã kết thúc trong quá khứ nhưng kết quả vẫn quan trọng ở hiện tại. Ta không tập trung vào thời điểm hành động xảy ra."}, {"type": "example", "text": "My brother’s happy because he has won a competition."}]}, {"title": "Các cách dùng khác của hiện tại hoàn thành", "blocks": [{"type": "text", "text": "Dùng với ever và never để nói về trải nghiệm tính đến thời điểm hiện tại."}, {"type": "example", "text": "I’ve never learned French."}, {"type": "meaning", "text": "Tính đến lúc này chưa học, nhưng có thể sẽ học trong tương lai."}, {"type": "text", "text": "Dùng với just, already và yet để nói về những việc gần đây đã làm hoặc chưa làm."}, {"type": "example", "text": "We’ve just finished eating. I haven’t read that book yet."}, {"type": "text", "text": "Dùng để nói về   const b=section.blocks[i];

   let rows=[b.rows[0]];
   for(const r of b.rows.slice(1)){
    const cand={type:'table',rows:[...rows,r]};

const readToc=el('nav','read-toc');readToc.setAttribute('aria-label','Mục lục Units');intro.append(readToc);wrap.append(intro);
for(const u of units){const article=el('article','read-unit');article.id='read-unit-'+u.unit;article.append(el('h2',null,'Unit '+u.unit+' · '+u.title),el('p','read-eng',u.english+' · Trang '+u.source_page));const link=el('a',null,'Unit '+u.unit+' · '+u.title);link.href='#'+article.id;link.onclick=e=>{e.preventDefault();goReading(u.unit,0)};readToc.append(link);
 u.sections.forEach((sec,idx)=>{const area=el('section','read-section');area.id='read-'+u.unit+'-'+idx;area.dataset.unit=u.unit;area.dataset.section=idx;area.append(el('h3',null,sec.title));const content=el('div','read-content');sec.blocks.forEach(b=>{const n=block(b);if(b.type==='table'){const sc=el('div','table-scroll');sc.tabIndex=0;sc.setAttribute('aria-label',sec.title);sc.append(n);content.append(sc)}else content.append(n)});area.append(content);article.append(area);sectionMap.push({unit:u.unit,index:idx,title:sec.title,node:area});});wrap.append(article);}
wrap.append(el('footer','read-end',meta.brand+' · '+meta.teacher));reader.append(wrap);
function font(){document.body.style.setProperty('--readsize',readFont+'px');document.getElementById('fontLabel').textContent=readFont+' px';document.getElementById('fontDown').disabled=readFont===16;document.getElementById('fontUp').disabled=readFont===26;}
function currentReading(){const line=document.getElementById('modehead').getBoundingClientRect().bottom+25;let best=sectionMap[0];for(const s of sectionMap){if(s.node.getBoundingClientRect().top<=line)best=s;else break}return best;}
function savePosition(){if(reading){const s=currentReading();activeSection=s;remember({unit:s.unit,index:s.index,font:readFont,offset:document.getElementById('modehead').getBoundingClientRect().bottom-s.node.getBoundingClientRect().top});}}
function goReading(unit,index=0,offset=0){const item=sectionMap.find(x=>x.unit===Number(unit)&&x.index===Number(index))||sectionMap[0];activeSection=item;requestAnimationFrame(()=>{const top=window.scrollY+item.node.getBoundingClientRect().top-document.getElementById('modehead').getBoundingClientRect().height-offset-15;window.scrollTo(0,Math.max(0,top));try{history.replaceState(null,'','#lesson='+item.unit+'-'+item.index)}catch(e){}savePosition()});}
const slideShow=show;show=function(i){slideShow(i);if(reading){const s=slides[current];const target=sectionMap.find(x=>x.unit===s.unit&&x.title===s.section)||sectionMap.find(x=>x.unit===s.unit);if(target)goReading(target.unit,target.index);else window.scrollTo(0,0);}};window.deck.show=show;
function syncReaderHeader(){document.body.style.setProperty('--reader-header-height',document.getElementById('modehead').offsetHeight+'px')}
function setMode(wantRead,initial=false){let target;if(reading&&!wantRead)target=currentReading();else if(!reading&&wantRead){const s=slides[current];target=sectionMap.find(x=>x.unit===s.unit&&x.title===s.section)||sectionMap.find(x=>x.unit===s.unit);}
 reading=wantRead;document.body.classList.toggle('reading',reading);document.documentElement.style.overflow=reading?'auto':'hidden';document.documentElement.style.height=reading?'auto':'100%';modeSwitch.textContent=reading?'Chuyển sang Slide Mode':'Chuyển sang Reading Mode';modeSwitch.setAttribute('aria-pressed',String(reading));
 syncReaderHeader();if(reading){font();if(initial&&saved)goReading(saved.unit,saved.index,saved.offset||0);else if(target)goReading(target.unit,target.index);else window.scrollTo(0,0);}else{window.scrollTo(0,0);if(target){const pos=slides.findIndex(x=>x.unit===target.unit&&x.section===target.title);slideShow(pos>=0?pos:unitFirst[target.unit]);}document.getElementById('viewport').style.top=document.getElementById('modehead').offsetHeight+'px';scale();}}
modeSwitch.onclick=()=>setMode(!reading);document.getElementById('modeMenu').onclick=openMenu;
document.getElementById('fontDown').onclick=()=>{readFont=Math.max(16,readFont-1);font();savePosition()};document.getElementById('fontUp').onclick=()=>{readFont=Math.min(26,readFont+1);font();savePosition()};
let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(savePosition,180)},{passive:true});window.addEventListener('pagehide',savePosition);
document.addEventListener('keydown',e=>{if(reading&&!toc.open&&!['INPUT','SELECT','BUTTON'].includes(e.target.tagName)&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' ','Home','End','PageUp','PageDown'].includes(e.key))e.stopImmediatePropagation();},true);
window.addEventListener('resize',()=>{syncReaderHeader();if(!reading){document.getElementById('viewport').style.top=document.getElementById('modehead').offsetHeight+'px';scale();}});
const lessonHash=initialLessonHash.match(/lesson=(\d+)-(\d+)/);setMode(matchMedia('(max-width:760px)').matches||!!lessonHash,true);if(lessonHash)goReading(Number(lessonHash[1]),Number(lessonHash[2]));
document.getElementById('viewport').style.top=document.getElementById('modehead').offsetHeight+'px';scale();
if(typeof ResizeObserver!=='undefined'){new ResizeObserver(syncReaderHeader).observe(document.getElementById('modehead'))}syncReaderHeader();
window.lessonView={setMode,goReading,sectionMap,get reading(){return reading}};
</script>
</body></html>
