#modebar{position:fixed;top:0;left:0;right:0;height:58px;z-index:15;background:#122b42;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px;font-size:15px}#brand strong{letter-spacing:1.5px}#brand small{display:block;color:#b4d4e8;font-size:11px;margin-top:3px}#modebar button{border:1px solid #6d91a7;border-radius:7px;background:#244a63;color:white;padding:9px 12px;font-size:14px;min-height:40px}#readingTools{display:none;gap:5px}#viewport{top:58px}#reading{display:none}body.reading{overflow:auto;height:auto;background:var(--bg);color:var(--ink)}html:has(body.reading){overflow:auto;height:auto}body.reading #reading{display:block;padding:88px 20px 70px;max-width:960px;margin:auto;font-size:var(--readsize,19px);line-height:1.65}body.reading #viewport,body.reading #toolbar{display:none}body.reading #readingTools{display:flex}.read-hero{border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:30px}.read-hero h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.7px}.read-hero .sub{font-size:18px;margin:10px 0}.read-unit{margin:55px 0}.read-unit>h2{font-size:1.65em;line-height:1.25;margin:10px 0}.read-unit>.sub{font-size:1em}.read-section{scroll-margin-top:82px;margin:30px 0 45px}.read-section h3{font-size:1.25em;line-height:1.35;border-bottom:1px solid var(--line);padding-bottom:12px}.read-section p{margin:12px 0}.read-section .example{font-weight:600;color:var(--example);padding-left:14px;border-left:3px solid var(--accent)}.read-section .meaning{color:var(--muted);font-size:.93em}.read-section .formula{font-weight:bold;color:var(--formula)}.read-section table{font-size:.86em;line-height:1.5;table-layout:auto;margin:20px 0;min-width:100%}.read-section th,.read-section td{font-size:inherit;padding:12px;border-width:1px;overflow-wrap:break-word}.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.read-section table{min-width:520px}.read-section table tr td:first-child{min-width:100px}.read-unit .eyebrow{font-size:14px;margin:0}.read-footer{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:14px}.reading #fullscreen{display:none}.reading #modebar{box-shadow:0 2px 12px #0002}#modeActions{display:flex;gap:6px;align-items:center}
@media(max-width:750px){#modebar{padding:7px 9px}#brand strong{font-size:13px}#brand small{font-size:10px}#modebar button{font-size:12px;padding:8px}#readingTools{gap:3px}#toolbar{height:108px;flex-wrap:wrap;justify-content:center;align-content:center}#viewport{bottom:108px}#toolbar select{max-width:190px}body.reading #reading{padding:80px 16px 50px}.read-section table{min-width:460px}#readingTools button{padding:8px 6px}#counter{min-width:75px}}

<script>
'use strict';
const units=[{"unit": 1, "english": "Present simple and continuous", "title": "Hiện tại đơn và hiện tại tiếp diễn", "sections": [{"title": "Thì hiện tại đơn", "blocks": [{"type": "text", "text": "Động từ ở thì hiện tại đơn có hai dạng, tùy theo chủ ngữ."}, {"type": "table", "rows": [["Chủ ngữ", "Dạng động từ", "Ví dụ"], ["I, You, We, They", "Động từ nguyên mẫu", "get, study, watch, go"], ["He, She, It", "Thêm -s", "gets"], ["He, She, It", "Thêm -es", "watches, goes"], ["He, She, It", "Đổi -y thành -ies", "studies"]]}, {"type": "text", "text": "Dùng do/does not + động từ nguyên mẫu để tạo câu phủ định; dùng do/does + chủ ngữ + động từ nguyên mẫu để đặt câu hỏi."}, {"type": "table", "rows": [["Chủ ngữ", "Phủ định", "Câu hỏi"], ["I, You, We, They", "don’t get, study, watch, go", "Do I, you, we, they get, study, watch, go?"], ["He, She, It", "doesn’t get, study, watch, go", "Does he, she, it get, study, watch, go?"]]}, {"type": "text", "text": "Dùng hiện tại đơn cho những việc xảy ra thường xuyên."}, {"type": "example", "text": "I walk to school with a friend every day."}, {"type": "example", "text": "My sister doesn’t go to the sports club very often."}, {"type": "example", "text": "What do you do on Sundays?"}, {"type": "text", "text": "Dùng hiện tại đơn để nói về sự thật."}, {"type": "example", "text": "We live near my grandparents."}, {"type": "example", "text": "The weather doesn’t get very cold here."}, {"type": "text", "text": "Dùng hiện tại đơn với động từ chỉ trạng thái (state verbs), diễn tả suy nghĩ hoặc cảm xúc. Những động từ này thường không dùng ở dạng tiếp diễn: believe, hate, know, like, love, mean, need, own, prefer, understand, want."}, {"type": "example", "text": "Mike knows the answer to your question. / Alice doesn’t understand what you want."}, {"type": "example", "text": "I don’t remember your address. / What does this word mean?"}, {"type": "example", "text": "Does your teacher own a sports car?"}]}, {"title": "Thì hiện tại tiếp diễn", "blocks": [{"type": "text", "text": "Dùng am/are/is + động từ thêm -ing. Thêm not sau am/are/is để phủ định; đưa am/are/is lên trước chủ ngữ để đặt câu hỏi."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định", "Câu hỏi"], ["I", "I am (’m) playing.", "I’m not working.", "Am I helping?"], ["You, We, They", "You/We/They are (’re) working.", "They aren’t helping.", "Are you working?"], ["He, She, It", "He/She/It is (’s) helping.", "She isn’t playing.", "Is he playing?"]]}, {"type": "text", "text": "Dùng hiện tại tiếp diễn cho hành động đang xảy ra ngay lúc nói hoặc trong khoảng thời gian hiện tại."}, {"type": "example", "text": "We’re doing our homework."}, {"type": "meaning", "text": "Chúng tôi đang làm bài tập, tức là đang ở giữa quá trình làm bài."}, {"type": "text", "text": "Dùng cho tình huống tạm thời."}, {"type": "example", "text": "I’m helping my dad in his office this week."}, {"type": "meaning", "text": "Tuần này tôi giúp bố ở văn phòng; không phải tuần nào tôi cũng giúp."}, {"type": "text", "text": "Dùng cho kế hoạch tương lai."}, {"type": "example", "text": "They’re playing table tennis after school."}, {"type": "meaning", "text": "Họ có kế hoạch chơi bóng bàn sau giờ học."}]}]}, {"unit": 2, "english": "Past simple", "title": "Thì quá khứ đơn", "sections": [{"title": "Động từ có quy tắc", "blocks": [{"type": "text", "text": "Dạng quá khứ đơn của động từ có quy tắc là động từ + -ed. Với động từ tận cùng bằng phụ âm + -y, đổi -y thành -ied. Dạng động từ này giống nhau với I, you, he, she, it, we và they."}, {"type": "example", "text": "I looked. / He watched. / We studied. / They played."}]}, {"title": "Động từ bất quy tắc", "blocks": [{"type": "text", "text": "Động từ bất quy tắc có dạng quá khứ riêng; dạng này cũng giống nhau với mọi chủ ngữ."}, {"type": "table", "rows": [["Nguyên mẫu", "Quá khứ", "Nguyên mẫu", "Quá khứ"], ["buy", "bought", "make", "made"], ["do", "did", "meet", "met"], ["feel", "felt", "put", "put"], ["get", "got", "run", "ran"], ["give", "gave", "say", "said"], ["go", "went", "take", "took"], ["have", "had", "think", "thought"], ["know", "knew", "wear", "wore"]]}, {"type": "text", "text": "Xem danh sách động từ bất quy tắc ở trang 158."}]}, {"title": "Phủ định và câu hỏi", "blocks": [{"type": "text", "text": "Với cả động từ có quy tắc và bất quy tắc, dùng didn’t (did not) + động từ nguyên mẫu để phủ định; dùng did + chủ ngữ + động từ nguyên mẫu để đặt câu hỏi."}, {"type": "table", "rows": [["Chủ ngữ", "Phủ định", "Câu hỏi"], ["I, You, He, She, It, We, They", "didn’t buy it / get it / look", "Did I/you/he/she/it/we/they buy it / get it / look?"]]}]}, {"title": "Động từ be", "blocks": [{"type": "text", "text": "Be có hai dạng ở quá khứ đơn: was và were."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định và phủ định", "Câu hỏi"], ["I, He, She, It", "was / wasn’t", "Was she?"], ["You, We, They", "were / weren’t", "Were you?"]]}]}, {"title": "Cách dùng", "blocks": [{"type": "text", "text": "Dùng quá khứ đơn để nói về hành động, cảm xúc và trạng thái đã kết thúc trong quá khứ."}, {"type": "example", "text": "I had coffee with some friends."}, {"type": "example", "text": "I didn’t eat anything."}, {"type": "example", "text": "Did your sister enjoy the concert?"}, {"type": "text", "text": "Chúng ta thường nêu thời điểm sự việc xảy ra."}, {"type": "example", "text": "I met my mum after school."}, {"type": "example", "text": "The teacher didn’t give us any homework yesterday."}, {"type": "example", "text": "Did you go out last night?"}]}]}, {"unit": 3, "english": "Comparatives and superlatives", "title": "So sánh hơn và so sánh nhất", "sections": [{"title": "Cách tạo dạng so sánh của tính từ", "blocks": [{"type": "table", "rows": [["Loại tính từ", "Cách biến đổi", "Ví dụ"], ["Một âm tiết", "Thêm -er và -est", "new → newer → (the) newest"], ["Tận cùng bằng -e", "Thêm -r và -st", "nice → nicer → (the) nicest"], ["Một âm tiết, tận cùng bằng nguyên âm + phụ âm", "Thường gấp đôi phụ âm cuối rồi thêm -er/-est", "big → bigger → (the) biggest"], ["Hai âm tiết, tận cùng bằng -y", "Đổi -y thành -i rồi thêm -er/-est", "funny → funnier → (the) funniest"], ["Các tính từ khác có từ hai âm tiết trở lên", "Thường dùng more và the most", "interesting → more interesting → (the) most interesting; beautiful → more beautiful → (the) most beautiful"], ["Bất quy tắc", "Dùng dạng riêng", "good → better → (the) best; bad → worse → (the) worst"]]}]}, {"title": "Cấu trúc so sánh hơn", "blocks": [{"type": "text", "text": "Để so sánh hai người hoặc hai vật theo cấu trúc khẳng định, dùng tính từ so sánh hơn + than."}, {"type": "example", "text": "Your laptop is faster than mine."}, {"type": "example", "text": "The girls were more friendly than the boys."}, {"type": "text", "text": "Để nói hai người hoặc hai vật không ngang bằng nhau về một đặc điểm, dùng not as + tính từ + as, nghĩa là “không ... bằng ...”."}, {"type": "example", "text": "My laptop isn’t as fast as yours."}, {"type": "example", "text": "The boys weren’t as friendly as the girls."}]}, {"title": "Cấu trúc so sánh nhất", "blocks": [{"type": "text", "text": "Chúng ta thường dùng the trước tính từ ở dạng so sánh nhất."}, {"type": "example", "text": "This laptop is the fastest in the shop."}, {"type": "example", "text": "The Brazilians were the most friendly."}]}]}, {"unit": 4, "english": "Past continuous", "title": "Thì quá khứ tiếp diễn", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "text", "text": "Quá khứ tiếp diễn có cấu trúc tương tự hiện tại tiếp diễn, nhưng động từ be ở dạng quá khứ. Dùng was/were + động từ thêm -ing."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định"], ["I, He, She, It", "was running"], ["You, We, They", "were talking"]]}, {"type": "text", "text": "Dùng wasn’t (was not) hoặc weren’t (were not) để phủ định."}, {"type": "table", "rows": [["Chủ ngữ", "Phủ định"], ["I, He, She, It", "wasn’t running"], ["You, We, They", "weren’t talking"]]}, {"type": "text", "text": "Đưa was hoặc were lên trước chủ ngữ để đặt câu hỏi."}, {"type": "example", "text": "Was he running?"}, {"type": "example", "text": "Were you talking?"}]}, {"title": "Cách dùng", "blocks": [{"type": "text", "text": "Dùng quá khứ tiếp diễn để nói về hành động hoặc sự việc đang diễn ra tại một thời điểm cụ thể trong quá khứ."}, {"type": "example", "text": "I was chatting to my friends online."}, {"type": "example", "text": "We were texting my mum."}, {"type": "example", "text": "It wasn’t raining at that time."}, {"type": "example", "text": "They weren’t listening to me."}, {"type": "example", "text": "Was it snowing?"}, {"type": "example", "text": "Were the boys watching us?"}]}]}, {"unit": 5, "english": "Past simple and continuous", "title": "Quá khứ đơn và quá khứ tiếp diễn", "sections": [{"title": "Quá khứ tiếp diễn", "blocks": [{"type": "text", "text": "Xem cấu trúc ở Unit 4. Dùng quá khứ tiếp diễn để nói về hành động hoặc sự việc đang diễn ra tại một thời điểm cụ thể trong quá khứ."}, {"type": "example", "text": "At lunchtime, I was texting a friend."}, {"type": "example", "text": "It was raining."}, {"type": "example", "text": "The students weren’t playing computer games."}, {"type": "example", "text": "Was the teacher riding her motorbike?"}]}, {"title": "Quá khứ đơn", "blocks": [{"type": "text", "text": "Xem cấu trúc ở Unit 2. Dùng quá khứ đơn cho hành động đã hoàn tất trong quá khứ, thường kèm thời điểm xảy ra."}, {"type": "example", "text": "I met my friends at the shopping centre yesterday."}, {"type": "example", "text": "We didn’t buy anything, but we looked at some new phones."}, {"type": "text", "text": "Dùng quá khứ đơn cho hai hoặc nhiều hành động xảy ra nối tiếp nhau."}, {"type": "example", "text": "Amy showed me her new bag and then I went home."}, {"type": "example", "text": "When Jules lost his key, we all helped to look for it."}, {"type": "example", "text": "I finished my drink and washed the glass."}]}, {"title": "Kết hợp hai thì", "blocks": [{"type": "text", "text": "Khi một hành động ngắn hơn xen vào một hành động đang diễn ra trong quá khứ, dùng quá khứ đơn cho hành động xen vào và quá khứ tiếp diễn cho hành động đang diễn ra."}, {"type": "example", "text": "I was chatting with some friends when I saw you on the bus."}, {"type": "meaning", "text": "Tôi đang trò chuyện với vài người bạn thì nhìn thấy bạn trên xe buýt."}, {"type": "example", "text": "The singer threw his guitar at some fans because they were annoying him."}, {"type": "meaning", "text": "Ca sĩ ném đàn về phía một số người hâm mộ vì họ đang làm anh ấy khó chịu."}, {"type": "example", "text": "She didn’t eat anything for lunch because she was feeling nervous."}, {"type": "meaning", "text": "Cô ấy không ăn gì vào bữa trưa vì lúc đó đang cảm thấy lo lắng."}]}]}, {"unit": 6, "english": "Some any much many a lot of a few a little", "title": "Các từ chỉ số lượng", "sections": [{"title": "Some và any", "blocks": [{"type": "text", "text": "Dùng some và any với danh từ đếm được số nhiều và danh từ không đếm được."}, {"type": "text", "text": "Dùng some trong câu khẳng định."}, {"type": "example", "text": "We bought some petrol and some sweets at the garage."}, {"type": "text", "text": "Dùng any trong câu hỏi và câu phủ định."}, {"type": "example", "text": "I haven’t got any homework tonight."}, {"type": "example", "text": "Are there any good clubs near here?"}, {"type": "example", "text": "Is there any fruit in the fridge?"}, {"type": "example", "text": "They don’t want any salad."}]}, {"title": "Much many và a lot of", "blocks": [{"type": "text", "text": "Những từ này diễn tả số lượng lớn."}, {"type": "text", "text": "Dùng a lot of với danh từ đếm được số nhiều và danh từ không đếm được, trong câu khẳng định, phủ định và câu hỏi."}, {"type": "example", "text": "I took a lot of photos last night."}, {"type": "example", "text": "There’s a lot of milk in the fridge."}, {"type": "example", "text": "We haven’t got a lot of money for clothes."}, {"type": "text", "text": "Many thường đi với danh từ đếm được số nhiều trong câu hỏi và câu phủ định."}, {"type": "example", "text": "We haven’t got many photos of our holiday."}, {"type": "example", "text": "Are many people coming to your party?"}, {"type": "text", "text": "Much thường đi với danh từ không đếm được trong câu phủ định và câu hỏi."}, {"type": "example", "text": "I haven’t got much time to help you."}, {"type": "example", "text": "Is there much traffic on this road at night?"}]}, {"title": "A few và a little", "blocks": [{"type": "text", "text": "Những từ này diễn tả số lượng nhỏ. Trong cách dùng được trình bày ở bài này, a few và a little xuất hiện trong câu khẳng định và câu hỏi, không dùng trong câu phủ định."}, {"type": "text", "text": "Dùng a few với danh từ đếm được số nhiều."}, {"type": "example", "text": "I invited a few friends to a barbecue on my birthday."}, {"type": "example", "text": "Do you want a few grapes with the cheese?"}, {"type": "text", "text": "Dùng a little với danh từ không đếm được."}, {"type": "example", "text": "I’d like a little sugar in my coffee, please."}, {"type": "example", "text": "Have you got a little time to spare?"}]}]}, {"unit": 7, "english": "Have to and must should", "title": "Sự bắt buộc và lời khuyên", "sections": [{"title": "Have to và must", "blocks": [{"type": "text", "text": "Have to thay đổi dạng theo chủ ngữ và thời của câu."}, {"type": "example", "text": "I have to go to school. / We don’t have to go in the car."}, {"type": "example", "text": "You had to go to school. / She has to be home by 10 pm."}, {"type": "example", "text": "He doesn’t have to do any homework today. / They didn’t have to clean the car."}, {"type": "text", "text": "Không rút gọn have/has trong câu khẳng định với have to. Hai cách viết sau là sai trong cấu trúc này: “You’ve to go.” và “He’s to stay.”"}, {"type": "text", "text": "Must chỉ có một dạng, không có dạng quá khứ. Khi nói về sự bắt buộc trong quá khứ, dùng had to."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I, You, He, She, We, They", "must catch the early bus", "mustn’t be late"]]}, {"type": "text", "text": "Dùng must và have to để nói về quy định hoặc việc cần thiết phải làm."}, {"type": "example", "text": "You must be 18 to see that film."}, {"type": "example", "text": "He has to practise the guitar every day."}, {"type": "text", "text": "Trong quá khứ, dùng had to."}, {"type": "example", "text": "You had to be 18 to see that film."}, {"type": "example", "text": "He had to practise the guitar every day."}, {"type": "text", "text": "Dùng mustn’t khi một việc không được phép làm."}, {"type": "example", "text": "I mustn’t sleep in class."}, {"type": "example", "text": "You mustn’t read that letter."}, {"type": "text", "text": "Don’t/doesn’t have to có nghĩa là không cần làm; didn’t have to có nghĩa là đã không cần làm."}, {"type": "example", "text": "She doesn’t have to answer that email."}, {"type": "example", "text": "I didn’t have to do a test."}]}, {"title": "Should và shouldn’t", "blocks": [{"type": "text", "text": "Should chỉ có một dạng."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I, You, He, She, We, They", "should tidy the living room", "shouldn’t make a mess"]]}, {"type": "text", "text": "Dùng should khi cho rằng làm một việc là ý hay, nên làm."}, {"type": "example", "text": "I should buy a present for my mum."}, {"type": "example", "text": "They should build a new sports centre."}, {"type": "text", "text": "Dùng shouldn’t khi cho rằng một việc không nên làm."}, {"type": "example", "text": "You shouldn’t do your homework in front of the TV."}, {"type": "example", "text": "We shouldn’t eat too many chips."}, {"type": "text", "text": "Dùng should trong câu hỏi để xin lời khuyên."}, {"type": "example", "text": "What should I say in my interview?"}, {"type": "example", "text": "Which shoes should I wear with this dress?"}]}]}, {"unit": 8, "english": "Future be going to and present continuous", "title": "Tương lai với be going to và hiện tại tiếp diễn", "sections": [{"title": "Hiện tại tiếp diễn cho kế hoạch và sự sắp xếp", "blocks": [{"type": "text", "text": "Xem cấu trúc hiện tại tiếp diễn ở Unit 1. Dùng thì này để nói về kế hoạch cụ thể đã được xác định trước, thường kèm thời gian."}, {"type": "example", "text": "I’m flying to Spain at the weekend."}, {"type": "example", "text": "He’s not working next week."}, {"type": "example", "text": "What time are you leaving?"}]}, {"title": "Be going to cho dự định", "blocks": [{"type": "text", "text": "Cấu trúc: am/is/are (not) + going to + động từ nguyên mẫu. Với câu hỏi, đưa am/is/are lên trước chủ ngữ."}, {"type": "example", "text": "I’m going to run."}, {"type": "example", "text": "We’re going to finish."}, {"type": "example", "text": "You’re not going to win."}, {"type": "example", "text": "They’re not going to arrive."}, {"type": "example", "text": "Is she going to leave?"}, {"type": "example", "text": "Are you going to play?"}, {"type": "text", "text": "Dùng be going to cho việc chúng ta dự định làm trong tương lai."}, {"type": "example", "text": "I’m going to visit Italy one day."}, {"type": "example", "text": "We’re going to work really hard."}, {"type": "example", "text": "I’m not going to eat any more chocolate."}, {"type": "text", "text": "Dùng be going to cho việc mà chúng ta biết có khả năng sẽ xảy ra."}, {"type": "example", "text": "You drive well now. I’m sure you’re going to pass your driving test."}, {"type": "meaning", "text": "Bây giờ bạn lái xe tốt; người nói dự đoán bạn sẽ đỗ dựa trên điều mình biết."}, {"type": "example", "text": "Look at that blue sky! It’s not going to rain today."}, {"type": "meaning", "text": "Nhìn trời xanh, người nói dự đoán hôm nay sẽ không mưa."}]}]}, {"unit": 9, "english": "Present perfect", "title": "Thì hiện tại hoàn thành", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "text", "text": "Với cả động từ có quy tắc và bất quy tắc, dùng has/have + quá khứ phân từ (past participle)."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định và phủ định", "Câu hỏi"], ["I, You, We, They", "have (’ve) / haven’t + bought", "Have I/you/we/they bought ...?"], ["He, She, It", "has (’s) / hasn’t + lived", "Has he/she/it lived ...?"]]}, {"type": "text", "text": "Với động từ có quy tắc, quá khứ phân từ giống dạng quá khứ đơn: động từ + -(e)d."}, {"type": "table", "rows": [["Nguyên mẫu", "Quá khứ đơn", "Quá khứ phân từ"], ["turn", "turned", "turned"], ["like", "liked", "liked"]]}, {"type": "text", "text": "Với động từ bất quy tắc, quá khứ phân từ có thể giống hoặc khác dạng quá khứ đơn."}, {"type": "table", "rows": [["Nguyên mẫu", "Quá khứ đơn", "Quá khứ phân từ"], ["make", "made", "made"], ["find", "found", "found"], ["be", "was/were", "been"], ["do", "did", "done"], ["break", "broke", "broken"], ["know", "knew", "known"]]}, {"type": "text", "text": "Xem danh sách động từ bất quy tắc ở trang 158."}]}, {"title": "Cách dùng", "blocks": [{"type": "text", "text": "Dùng hiện tại hoàn thành cho trải nghiệm hoặc sự việc trong quá khứ có liên hệ với hiện tại."}, {"type": "example", "text": "We’ve spent all our money. (= Bây giờ chúng tôi không còn tiền.)"}, {"type": "example", "text": "We haven’t eaten lunch. (= Bây giờ chúng tôi đang đói.)"}, {"type": "example", "text": "Have you visited Paris? (= Bạn có biết Paris không?)"}]}, {"title": "Been và gone", "blocks": [{"type": "text", "text": "Trong hiện tại hoàn thành, have/has gone và have/has been diễn tả việc đi đến một nơi nhưng có nghĩa khác nhau."}, {"type": "text", "text": "Have/has gone: người đó đã đi và hiện đang ở nơi khác."}, {"type": "example", "text": "Tessa has gone to the club. (= Tessa không ở đây; cô ấy đang ở câu lạc bộ.)"}, {"type": "example", "text": "Jack’s gone to the city centre. (= Jack không ở đây; cậu ấy đang ở trung tâm thành phố.)"}, {"type": "text", "text": "Have/has been: người đó đã từng đến nơi ấy nhưng hiện không còn ở đó."}, {"type": "example", "text": "Tessa has been to the club. (= Tessa đã tới câu lạc bộ trước đây; hiện không ở đó.)"}, {"type": "example", "text": "Jack’s been to the city centre. (= Jack từng ở trung tâm thành phố trước thời điểm hiện tại; bây giờ không ở đó.)"}]}, {"title": "Ever never và câu trả lời ngắn", "blocks": [{"type": "text", "text": "Ever và never đi với hiện tại hoàn thành để nói “đã từng trong đời” hoặc “chưa từng trong đời”. Có thể trả lời bằng Yes, I have hoặc No, I haven’t."}, {"type": "example", "text": "Have you ever been to Lapland?"}, {"type": "example", "text": "Yes, I have. (= Đã từng đến trước đây.) / No, I haven’t. (= Chưa từng đến trong đời.)"}]}]}, {"unit": 10, "english": "Present perfect and past simple How long for since", "title": "Hiện tại hoàn thành và quá khứ đơn", "sections": [{"title": "Hiện tại hoàn thành", "blocks": [{"type": "text", "text": "Xem cấu trúc ở Unit 9. Dùng hiện tại hoàn thành để nói về trải nghiệm trong đời tính đến hiện tại. Không dùng cụm chỉ thời gian quá khứ đã kết thúc với thì này."}, {"type": "example", "text": "She’s seen that film."}, {"type": "example", "text": "They’ve heard that song."}, {"type": "example", "text": "We haven’t visited this museum."}, {"type": "example", "text": "Have you tried Thai food?"}]}, {"title": "Quá khứ đơn", "blocks": [{"type": "text", "text": "Xem cấu trúc ở Unit 2. Dùng quá khứ đơn để nói rõ sự việc xảy ra khi nào."}, {"type": "example", "text": "She saw the film last week."}, {"type": "example", "text": "They heard that song at a concert."}, {"type": "example", "text": "We visited this museum last time we came to London."}, {"type": "example", "text": "Did you try Thai food when you were in Bangkok?"}]}, {"title": "How long", "blocks": [{"type": "text", "text": "Dùng How long với hiện tại hoàn thành để hỏi về khoảng thời gian kéo dài đến hiện tại, nghĩa là “bao lâu rồi”."}, {"type": "example", "text": "How long have you lived here?"}, {"type": "example", "text": "How long have you known your best friend?"}]}, {"title": "For và since", "blocks": [{"type": "text", "text": "For đi trước khoảng thời gian, cho biết sự việc kéo dài bao lâu."}, {"type": "example", "text": "for ten years / for a long time / for six weeks"}, {"type": "meaning", "text": "trong mười năm / trong một thời gian dài / trong sáu tuần"}, {"type": "text", "text": "Since đi trước mốc thời gian, cho biết sự việc bắt đầu từ khi nào."}, {"type": "example", "text": "since six o’clock / since my birthday party / since last year"}, {"type": "meaning", "text": "từ lúc sáu giờ / từ bữa tiệc sinh nhật của tôi / từ năm ngoái"}, {"type": "text", "text": "Nếu sau since có một mệnh đề với động từ, động từ đó dùng quá khứ đơn."}, {"type": "example", "text": "I have known him since I was eleven, since I started school, since I arrived in Madrid."}, {"type": "meaning", "text": "Tôi quen anh ấy từ khi tôi mười một tuổi / từ khi tôi bắt đầu đi học / từ khi tôi đến Madrid."}]}]}, {"unit": 11, "english": "Will and be going to", "title": "Tương lai với will và be going to", "sections": [{"title": "Will", "blocks": [{"type": "text", "text": "Cấu trúc: will/won’t + động từ nguyên mẫu. Với câu hỏi, đưa will lên trước chủ ngữ."}, {"type": "example", "text": "We’ll (will) write."}, {"type": "example", "text": "She won’t go."}, {"type": "example", "text": "Will they want ...?"}, {"type": "text", "text": "Dùng will cho dự đoán chung về tương lai."}, {"type": "example", "text": "People will be healthier."}, {"type": "example", "text": "Medicines won’t cure everything."}, {"type": "example", "text": "Will everyone live longer?"}, {"type": "text", "text": "Dùng will khi quyết định làm một việc ngay trong lúc nói."}, {"type": "example", "text": "I’ll have a cake with my coffee."}, {"type": "example", "text": "I won’t wait any longer."}]}, {"title": "Be going to", "blocks": [{"type": "text", "text": "Xem cấu trúc ở Unit 8. Dùng be going to để nói về việc đã quyết định làm từ trước."}, {"type": "example", "text": "Our teacher is going to give us the test results soon."}, {"type": "example", "text": "I’m not going to spend a lot of money today."}, {"type": "example", "text": "What are we going to eat tonight?"}, {"type": "text", "text": "Dùng be going to để dự đoán dựa trên điều chúng ta nhìn thấy hoặc biết."}, {"type": "example", "text": "Business is good - we’re going to be rich!"}, {"type": "meaning", "text": "Việc kinh doanh đang thuận lợi, nên người nói dự đoán sẽ giàu."}, {"type": "example", "text": "Look at the crowd round the table - the food’s going to run out."}, {"type": "meaning", "text": "Có nhiều người quanh bàn, nên người nói dự đoán thức ăn sắp hết."}]}]}, {"unit": 12, "english": "Modals of probability", "title": "Động từ tình thái dùng để suy đoán", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "text", "text": "Động từ tình thái không thay đổi dạng theo chủ ngữ. Các động từ tình thái dùng để suy đoán luôn có một động từ khác theo sau."}, {"type": "table", "rows": [["Chủ ngữ", "Động từ tình thái và động từ theo sau"], ["I, You, He, She, It, We, They", "must be tired / might die / could bite / can’t exist"]]}]}, {"title": "Must", "blocks": [{"type": "text", "text": "Dùng must + động từ nguyên mẫu để nói về điều mà chúng ta tin chắc là đúng."}, {"type": "example", "text": "The explorers found two new species. They must be very excited."}, {"type": "meaning", "text": "Tôi chắc rằng họ rất hào hứng."}, {"type": "example", "text": "They’ve walked through the jungle for four days. They must feel tired."}, {"type": "meaning", "text": "Tôi chắc rằng họ cảm thấy mệt."}]}, {"title": "Might và could", "blocks": [{"type": "text", "text": "Dùng might/could + động từ nguyên mẫu để nói về điều có thể xảy ra hoặc có thể đúng."}, {"type": "example", "text": "I’ve never seen an animal like this before. It could be / might be a new species."}, {"type": "meaning", "text": "Có lẽ đây là một loài mới."}, {"type": "example", "text": "Other new species could exist in these mountains."}, {"type": "meaning", "text": "Có lẽ còn những loài mới khác trong các ngọn núi này."}, {"type": "example", "text": "Don’t touch it, it might bite you."}, {"type": "meaning", "text": "Có lẽ nó sẽ cắn bạn nếu bạn chạm vào nó."}]}, {"title": "Can’t", "blocks": [{"type": "text", "text": "Dùng can’t + động từ nguyên mẫu để nói về điều mà chúng ta tin là không thể đúng. Không dùng mustn’t với nghĩa suy đoán này."}, {"type": "example", "text": "I’ve seen a picture of this animal in an old book, so it can’t be a new species."}, {"type": "meaning", "text": "Tôi chắc rằng đây không phải một loài mới."}, {"type": "example", "text": "He’s an intelligent person; he can’t believe those silly stories!"}, {"type": "meaning", "text": "Tôi chắc rằng anh ấy không tin những câu chuyện ngớ ngẩn ấy."}]}]}, {"unit": 13, "english": "Just already and yet", "title": "Just already và yet với hiện tại hoàn thành", "sections": [{"title": "Just already và yet với hiện tại hoàn thành", "blocks": [{"type": "text", "text": "Just, already và yet được dùng với thì hiện tại hoàn thành trong bài này."}]}, {"title": "Just", "blocks": [{"type": "text", "text": "Just có nghĩa là “vừa mới”, tức sự việc xảy ra cách đây một thời gian rất ngắn. Just đứng trước động từ chính trong câu khẳng định."}, {"type": "example", "text": "I’ve just passed my driving test."}, {"type": "example", "text": "The match has just started."}, {"type": "example", "text": "We’ve just moved house."}]}, {"title": "Already", "blocks": [{"type": "text", "text": "Already có nghĩa là “đã”, tức sự việc xảy ra trước thời điểm hiện tại. Từ này nhấn mạnh hành động đã hoàn tất, không tập trung vào việc nó xảy ra cách đây bao lâu. Đôi khi already có nghĩa là “sớm hơn dự kiến”. Already đứng trước động từ chính trong câu khẳng định."}, {"type": "example", "text": "I’ve already driven five hundred kilometres, I don’t want to drive any more."}, {"type": "example", "text": "My brother has already left school. He’s at university now."}, {"type": "example", "text": "My dad had flu last week but he’s already gone back to work."}, {"type": "example", "text": "Our little sister’s already learned how to open cupboards, although she’s only one!"}]}, {"title": "Yet", "blocks": [{"type": "text", "text": "Yet có nghĩa là “cho đến bây giờ”, thường nhấn mạnh rằng người nói đã mong sự việc xảy ra trước thời điểm hiện tại."}, {"type": "text", "text": "Trong câu phủ định, yet đứng cuối câu, thường mang nghĩa “chưa”."}, {"type": "example", "text": "I haven’t finished my sandwich yet."}, {"type": "meaning", "text": "Tôi đang ăn và cần thêm thời gian để ăn xong."}, {"type": "example", "text": "We haven’t decided which film to watch yet."}, {"type": "meaning", "text": "Chúng tôi vẫn đang suy nghĩ nên xem phim nào."}, {"type": "text", "text": "Đôi khi yet gợi ý rằng sự việc có thể xảy ra trong tương lai."}, {"type": "example", "text": "You haven’t seen my new bike yet."}, {"type": "meaning", "text": "Có thể bạn sẽ nhìn thấy chiếc xe mới của tôi vào lúc nào đó sắp tới."}, {"type": "text", "text": "Trong câu hỏi, yet đứng cuối câu, thường mang nghĩa “đã ... chưa”."}, {"type": "example", "text": "Have you phoned Jade yet?"}, {"type": "meaning", "text": "Tôi nghĩ bạn đã định gọi cho Jade vào khoảng thời gian này."}, {"type": "example", "text": "Has Francis bought Mum a birthday card yet?"}, {"type": "meaning", "text": "Tôi nghĩ Francis nên sớm mua thiệp sinh nhật cho mẹ."}]}]}, {"unit": 14, "english": "Relative clauses", "title": "Mệnh đề quan hệ", "sections": [{"title": "Vai trò", "blocks": [{"type": "text", "text": "Dùng mệnh đề quan hệ để xác định người, vật hoặc nơi chốn đang được nói tới."}, {"type": "example", "text": "The film that we saw last night was really funny."}, {"type": "meaning", "text": "Cần phần “that we saw last night” để biết người nói đang nhắc đến bộ phim nào."}, {"type": "example", "text": "The actor that played Mrs Wood was brilliant."}, {"type": "meaning", "text": "Cần phần “that played Mrs Wood” để biết người nói đang nhắc đến diễn viên nào."}]}, {"title": "Who that và which", "blocks": [{"type": "text", "text": "Dùng who hoặc that để nói về người."}, {"type": "example", "text": "There’s the woman who I met at the singing competition."}, {"type": "example", "text": "I preferred the singer that got the second prize."}, {"type": "text", "text": "Dùng which hoặc that để nói về vật."}, {"type": "example", "text": "I enjoy singing songs which make people laugh."}, {"type": "example", "text": "My friend sang a song that she wrote about her home town."}]}, {"title": "Chủ ngữ và tân ngữ trong mệnh đề quan hệ", "blocks": [{"type": "text", "text": "Who, which hoặc that có thể làm chủ ngữ hoặc tân ngữ của mệnh đề quan hệ."}, {"type": "table", "rows": [["Ví dụ", "Vai trò trong mệnh đề quan hệ"], ["I preferred the singer that got the second prize.", "that là chủ ngữ của got"], ["I enjoy singing songs which make people laugh.", "which là chủ ngữ của make"], ["There’s the woman who I met at the singing competition.", "who là tân ngữ của met; I là chủ ngữ"], ["My friend sang a song that she wrote about her home town.", "that là tân ngữ của wrote; she là chủ ngữ"]]}]}, {"title": "Where", "blocks": [{"type": "text", "text": "Dùng where để nói về nơi chốn."}, {"type": "example", "text": "We went to the house where the film director lives."}, {"type": "meaning", "text": "where the film director lives tương đương “which the film director lives in”."}, {"type": "example", "text": "I know a website where you can find all kinds of films."}, {"type": "meaning", "text": "Bạn có thể tìm mọi loại phim ở trang web đó: “You can find all kinds of films there.”"}]}]}, {"unit": 15, "english": "Present simple passive", "title": "Câu bị động ở thì hiện tại đơn", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "text", "text": "Dùng be ở hiện tại + quá khứ phân từ của động từ."}, {"type": "table", "rows": [["Chủ ngữ", "Be", "Quá khứ phân từ"], ["I", "am", "given"], ["You, We, They", "are", "helped"], ["He, She, It", "is", "recommended"]]}, {"type": "text", "text": "Thêm not sau be để phủ định; đưa be lên trước chủ ngữ để đặt câu hỏi."}, {"type": "example", "text": "I’m given a maths test every week."}, {"type": "example", "text": "I’m not given a maths test every week."}, {"type": "example", "text": "Are you given a maths test every week?"}, {"type": "example", "text": "Robbie is helped with his homework."}, {"type": "example", "text": "Robbie isn’t helped with his homework."}, {"type": "example", "text": "Is Robbie helped with his homework?"}, {"type": "example", "text": "These apps are recommended on lots of websites."}, {"type": "example", "text": "These apps aren’t recommended on many websites."}, {"type": "example", "text": "Are these apps recommended on many websites?"}]}, {"title": "By và người thực hiện hành động", "blocks": [{"type": "text", "text": "Khi nêu người hoặc vật thực hiện hành động trong câu bị động, dùng by."}, {"type": "example", "text": "My teacher gives me a maths test every week. (chủ động)"}, {"type": "example", "text": "I’m given a maths test by my teacher every week. (bị động)"}, {"type": "example", "text": "Robbie’s parents don’t help him with his homework. (chủ động)"}, {"type": "example", "text": "Robbie isn’t helped with his homework by his parents. (bị động)"}, {"type": "example", "text": "Do a lot of people admire the girls for their courage? (chủ động)"}, {"type": "example", "text": "Are the girls admired by a lot of people for their courage? (bị động)"}]}, {"title": "Cách dùng", "blocks": [{"type": "text", "text": "Dùng câu bị động khi việc nêu người hoặc vật thực hiện hành động không quan trọng."}, {"type": "example", "text": "This app is used for sharing photos."}, {"type": "example", "text": "Our exam results are published online."}, {"type": "example", "text": "Teenagers are allowed to drive in my country."}, {"type": "text", "text": "Dùng câu bị động khi không biết người hoặc vật thực hiện hành động."}, {"type": "example", "text": "These new phones are made in China."}, {"type": "example", "text": "The streets are cleaned at night."}, {"type": "example", "text": "My dad is sent lots of brochures."}, {"type": "text", "text": "Thêm by khi muốn nhấn mạnh người hoặc vật thực hiện hành động."}, {"type": "example", "text": "This app is used by millions of people for sharing photos."}, {"type": "example", "text": "My dad is sent lots of brochures by car companies."}]}]}, {"unit": 16, "english": "Zero and first conditional", "title": "Câu điều kiện loại 0 và loại 1", "sections": [{"title": "Hai mệnh đề trong câu điều kiện", "blocks": [{"type": "text", "text": "Câu điều kiện diễn tả một tình huống có thể xảy ra và kết quả của nó. Câu có hai mệnh đề: mệnh đề điều kiện và mệnh đề kết quả. Mệnh đề điều kiện bắt đầu bằng if hoặc unless. Có thể đặt một trong hai mệnh đề lên trước mà không đổi nghĩa."}]}, {"title": "Câu điều kiện loại 0", "blocks": [{"type": "text", "text": "Cả mệnh đề điều kiện và mệnh đề kết quả đều dùng hiện tại đơn."}, {"type": "formula", "text": "If + hiện tại đơn, hiện tại đơn."}, {"type": "example", "text": "If plants have enough light, they grow well."}, {"type": "example", "text": "If plants don’t have enough light, they don’t grow well."}, {"type": "text", "text": "Khi mệnh đề if đứng đầu, dùng dấu phẩy giữa hai mệnh đề. Cũng có thể đặt mệnh đề if ở cuối câu."}, {"type": "example", "text": "Plants grow well if they have enough light."}, {"type": "text", "text": "Dùng loại 0 để nói về điều đúng hoặc luôn xảy ra."}, {"type": "example", "text": "If you give plants enough food and water, they grow well."}, {"type": "example", "text": "If you don’t give plants enough food and water, they don’t grow well."}, {"type": "text", "text": "Trong câu điều kiện loại 0, if thường có cùng nghĩa với when."}, {"type": "example", "text": "Plants grow well when you give them enough food and water."}]}, {"title": "Câu điều kiện loại 1", "blocks": [{"type": "text", "text": "Mệnh đề điều kiện dùng hiện tại đơn; mệnh đề kết quả dùng will/won’t + động từ nguyên mẫu."}, {"type": "formula", "text": "If + hiện tại đơn, will/won’t + động từ nguyên mẫu."}, {"type": "example", "text": "If we share a taxi, we’ll save money."}, {"type": "example", "text": "If we take a taxi, we won’t get wet."}, {"type": "example", "text": "If we don’t take a taxi, we’ll get wet."}, {"type": "text", "text": "Dùng dấu phẩy khi mệnh đề if đứng đầu. Có thể đặt mệnh đề if ở cuối."}, {"type": "example", "text": "We’ll save money if we share a taxi."}, {"type": "text", "text": "Dùng loại 1 cho sự việc có thể hoặc có khả năng xảy ra trong tương lai."}, {"type": "example", "text": "If this café closes, we’ll lose our jobs."}, {"type": "example", "text": "We’ll lose our jobs if this café closes."}, {"type": "example", "text": "We won’t lose our jobs if this café doesn’t close."}, {"type": "text", "text": "Trong loại 1, if và when khác nghĩa."}, {"type": "example", "text": "If this café closes, we’ll lose our jobs."}, {"type": "meaning", "text": "Người nói cho rằng quán có thể đóng cửa, nhưng chưa chắc."}, {"type": "example", "text": "When this café closes, we’ll lose our jobs."}, {"type": "meaning", "text": "Người nói biết quán sẽ đóng cửa."}]}, {"title": "Unless", "blocks": [{"type": "text", "text": "Unless có nghĩa là if not, tức “nếu không” hoặc “trừ khi”."}, {"type": "example", "text": "Plants don’t grow unless they have light. (= if they don’t have light)"}, {"type": "example", "text": "I’ll stay at home unless it stops raining. (= if it doesn’t stop raining)"}, {"type": "example", "text": "Unless I’m invited, I won’t go to the party. (= if I’m not invited)"}]}]}, {"unit": 17, "english": "Reported commands", "title": "Tường thuật mệnh lệnh yêu cầu và lời khuyên", "sections": [{"title": "Lời nói trực tiếp", "blocks": [{"type": "text", "text": "Khi muốn người khác làm hoặc không làm một việc, chúng ta có thể nói:"}, {"type": "table", "rows": [["Loại lời nói", "Ví dụ"], ["Mệnh lệnh", "Open the door! / Don’t open the door!"], ["Yêu cầu", "Please open the door. / Please don’t open the door."], ["Mệnh lệnh", "You must open the door! / You mustn’t open the door!"], ["Lời khuyên hoặc gợi ý", "You should open the door. / You shouldn’t open the door."]]}]}, {"title": "Tường thuật lời nói khẳng định", "blocks": [{"type": "text", "text": "Dùng động từ tường thuật + đại từ tân ngữ + to + động từ nguyên mẫu để tường thuật mệnh lệnh hoặc yêu cầu khẳng định."}, {"type": "table", "rows": [["Lời nói trực tiếp", "Lời tường thuật"], ["Dad said to me, ‘Open the door!’", "Dad told me to open the door."], ["Dad said to me, ‘Please open the door!’", "Dad asked me to open the door."], ["I said to the boys, ‘You must close the door!’", "I told them to close the door."], ["I said to the boys, ‘You should close the door.’", "I advised them to close the door."]]}]}, {"title": "Tường thuật lời nói phủ định", "blocks": [{"type": "text", "text": "Dùng động từ tường thuật + đại từ tân ngữ + not to + động từ nguyên mẫu để tường thuật mệnh lệnh hoặc yêu cầu phủ định."}, {"type": "table", "rows": [["Lời nói trực tiếp", "Lời tường thuật"], ["Dad said to me, ‘Don’t open the door!’", "Dad told me not to open the door."], ["Dad said to me, ‘Please don’t open the door!’", "Dad asked me not to open the door."], ["I said to the boys, ‘You mustn’t close the door!’", "I told them not to close the door."], ["I said to the boys, ‘You shouldn’t close the door.’", "I advised them not to close the door."]]}]}, {"title": "Động từ tường thuật", "blocks": [{"type": "text", "text": "Có thể dùng nhiều động từ khác nhau để diễn tả điều người nói muốn người khác làm."}, {"type": "example", "text": "She convinced me to stay, but my friend warned me not to listen to her."}, {"type": "text", "text": "Các động từ thường dùng: advise (khuyên), ask (yêu cầu), convince (thuyết phục), encourage (khuyến khích), order (ra lệnh), persuade (thuyết phục), remind (nhắc), tell (bảo), warn (cảnh báo)."}, {"type": "text", "text": "Không dùng say theo cấu trúc trên. Câu sau là sai: “He said me to open the door.”"}]}]}, {"unit": 18, "english": "Second conditional", "title": "Câu điều kiện loại 2", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "text", "text": "Câu điều kiện gồm mệnh đề điều kiện và mệnh đề kết quả, diễn tả một tình huống và kết quả của nó. Mệnh đề điều kiện bắt đầu bằng if hoặc unless. Hai mệnh đề có thể đổi vị trí mà không thay đổi nghĩa."}, {"type": "text", "text": "Loại 2 dùng quá khứ đơn trong mệnh đề điều kiện và would (’d)/wouldn’t + động từ nguyên mẫu trong mệnh đề kết quả."}, {"type": "formula", "text": "If + quá khứ đơn, would/wouldn’t + động từ nguyên mẫu."}, {"type": "example", "text": "If I was a journalist, I’d (would) meet lots of famous people."}, {"type": "text", "text": "Dùng dấu phẩy khi mệnh đề if đứng đầu; cũng có thể đặt mệnh đề if ở cuối."}, {"type": "example", "text": "I’d (would) meet lots of famous people if I was a journalist."}, {"type": "text", "text": "Đôi khi dùng I were thay cho I was trong mệnh đề điều kiện."}, {"type": "example", "text": "If I were a journalist, I’d (would) meet lots of famous people."}, {"type": "text", "text": "Không dùng when thay cho if trong câu điều kiện loại 2."}]}, {"title": "Cách dùng", "blocks": [{"type": "text", "text": "Dùng loại 2 để nói về tình huống khó xảy ra hoặc không thể xảy ra ở hiện tại hay tương lai và kết quả giả định của tình huống đó."}, {"type": "example", "text": "If I were a millionaire, I’d buy a desert island."}, {"type": "meaning", "text": "Tôi không phải triệu phú nên sẽ không mua một hòn đảo hoang."}, {"type": "example", "text": "We wouldn’t send many texts if they cost a lot of money."}, {"type": "meaning", "text": "Gửi tin nhắn rẻ nên chúng tôi gửi nhiều."}, {"type": "example", "text": "If my brother got up earlier, he wouldn’t have to run for the train every morning."}, {"type": "meaning", "text": "Anh/em trai tôi không dậy đủ sớm nên sáng nào cũng phải chạy cho kịp tàu."}, {"type": "example", "text": "If I could get a job, I’d (would) have enough money to go out."}, {"type": "meaning", "text": "Tôi không kiếm được việc nên không có đủ tiền đi chơi."}, {"type": "example", "text": "The students wouldn’t play football unless they enjoyed it."}, {"type": "meaning", "text": "Các học sinh thích chơi bóng đá; đó là lý do các bạn ấy chơi."}]}, {"title": "Câu hỏi và câu trả lời", "blocks": [{"type": "text", "text": "Chúng ta thường dùng câu điều kiện loại 2 để đặt câu hỏi."}, {"type": "example", "text": "If you had the chance, would you visit California?"}, {"type": "example", "text": "Wouldn’t you be angry if you were me?"}, {"type": "example", "text": "What would you do if someone told you a secret?"}, {"type": "example", "text": "If you could do any job at all, what would you choose?"}, {"type": "text", "text": "Trả lời bằng cấu trúc would/wouldn’t, hoặc câu trả lời ngắn tương ứng."}, {"type": "example", "text": "I wouldn’t visit California, I’d go to Florida."}, {"type": "example", "text": "Yes, I would. / No, I wouldn’t."}, {"type": "example", "text": "I wouldn’t tell anyone else."}, {"type": "example", "text": "I’d be a racing driver."}]}]}, {"unit": 19, "english": "Reported speech", "title": "Câu tường thuật", "sections": [{"title": "Những thay đổi khi tường thuật", "blocks": [{"type": "text", "text": "Khi tường thuật lời nói trong quá khứ theo các mẫu của bài này, thì của động từ thay đổi; đại từ cũng thay đổi nếu cần. Có thể dùng that sau said nhưng không bắt buộc."}, {"type": "table", "rows": [["Lời nói trực tiếp", "Lời tường thuật"], ["Hiện tại đơn", "Quá khứ đơn"], ["‘I often go sailing,’ said Ed.", "Ed said (that) he often went sailing."], ["Hiện tại tiếp diễn", "Quá khứ tiếp diễn"], ["‘Doug is cycling fast,’ said Megan.", "Megan said (that) Doug was cycling fast."], ["will", "would"], ["‘Olga will win the race,’ said the coach.", "The coach said (that) Olga would win the race."], ["can", "could"], ["They said to us, ‘You can sit with us.’", "They said (that) we could sit with them."]]}]}, {"title": "Told và said", "blocks": [{"type": "text", "text": "Khi dùng told, cần có tân ngữ chỉ người được nói với."}, {"type": "example", "text": "Mark told me that he went to Italy on holiday."}, {"type": "text", "text": "Không đặt trực tiếp tân ngữ chỉ người sau said trong cấu trúc này."}, {"type": "example", "text": "Mark said that he went to Italy on holiday."}, {"type": "text", "text": "Lỗi cần tránh: “Mark said me that he went to Italy.”"}]}]}, {"unit": 20, "english": "Past simple passive", "title": "Câu bị động ở thì quá khứ đơn", "sections": [{"title": "Cấu trúc", "blocks": [{"type": "text", "text": "Dùng was/were (not) + quá khứ phân từ. Với câu hỏi, đưa was/were lên trước chủ ngữ."}, {"type": "table", "rows": [["Chủ ngữ", "Cấu trúc"], ["I, He, She, It", "was(n’t) allowed to go"], ["You, We, They", "were(n’t) told about the party"]]}, {"type": "example", "text": "I was told to phone home."}, {"type": "example", "text": "She wasn’t told the correct time."}, {"type": "example", "text": "Were you told what to do?"}, {"type": "example", "text": "The story was told to a journalist."}, {"type": "example", "text": "The journalist wasn’t told the truth."}, {"type": "example", "text": "Was the story told to make trouble for someone?"}, {"type": "example", "text": "The pictures were found in a second-hand shop."}, {"type": "example", "text": "They weren’t found in good condition."}, {"type": "example", "text": "Were the pictures found by chance?"}]}, {"title": "By và người thực hiện hành động", "blocks": [{"type": "text", "text": "Dùng by khi muốn nêu người hoặc vật đã thực hiện hành động."}, {"type": "example", "text": "Two school students found the pictures in a second-hand shop. (chủ động)"}, {"type": "example", "text": "The pictures were found in a second-hand shop by two school students. (bị động)"}, {"type": "example", "text": "The shop owner didn’t tell the journalist the truth. (chủ động)"}, {"type": "example", "text": "The journalist wasn’t told the truth by the shop owner. (bị động)"}, {"type": "example", "text": "Did the students find the pictures? (chủ động)"}, {"type": "example", "text": "Were the pictures found by the students? (bị động)"}]}, {"title": "Cách dùng", "blocks": [{"type": "text", "text": "Dùng câu bị động khi việc nêu người hoặc vật đã thực hiện hành động không quan trọng."}, {"type": "example", "text": "That picture was sold for a thousand pounds."}, {"type": "example", "text": "My brother’s drawings were shown in a gallery."}, {"type": "example", "text": "I wasn’t allowed to watch horror movies when I was younger."}, {"type": "text", "text": "Dùng câu bị động khi không biết người hoặc vật đã thực hiện hành động."}, {"type": "example", "text": "My friend was interviewed about his invention."}, {"type": "example", "text": "The story wasn’t published until yesterday."}, {"type": "example", "text": "The students were offered a reward."}, {"type": "text", "text": "Thêm by khi muốn nhấn mạnh người hoặc vật đã thực hiện hành động."}, {"type": "example", "text": "That picture was sold by the artist’s mother for a thousand pounds."}, {"type": "example", "text": "The story wasn’t published by the national newspapers until yesterday."}, {"type": "example", "text": "The students were offered a reward by the owner of the painting."}]}]}];
const stage=document.getElementById('stage'),measure=document.getElementById('measure'),toc=document.getElementById('toc');
let slides=[],current=0;const unitFirst={0:0};let LIMIT=700;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function block(b){
 if(b.type==='table'){const t=el('table');const head=el('thead'),tr=el('tr');b.rows[0].forEach(x=>tr.append(el('th',null,x)));head.append(tr);t.append(head);const body=el('tbody');b.rows.slice(1).forEach(r=>{const tr=el('tr');r.forEach(x=>tr.append(el('td',null,x)));body.append(tr)});t.append(body);return t}
 return el('p',b.type==='text'?'':b.type,b.text);
}
function height(blocks){measure.replaceChildren(...blocks.map(block));return measure.scrollHeight}
function addSlide({unit=0,title,english='',blocks=[],kind='',section=''}){
 const n=el('section','slide '+kind);n.dataset.unit=unit;n.append(el('p','eyebrow',unit?'UNIT '+unit:'ADAM ENGLISH'));
 n.append(el('h1',null,title));n.append(el('p','sub',english));const b=el('div','body');blocks.forEach(x=>b.append(block(x)));n.append(b);
 const f=el('div','footer');f.append(el('span',null,'Tiếng Anh Thầy Phú'),el('span','pagenum'));n.append(f);stage.append(n);slides.push({node:n,unit,title,section,blocks});
}
function chunks(section,english){
 const head=el('div');head.style.cssText='position:fixed;left:-10000px;width:1708px;visibility:hidden';
 head.append(el('p','eyebrow','UNIT 20'),el('h1',null,section.title),el('p','sub',english+'   ·   10/10'));document.body.append(head);
 const headerHeight=Array.from(head.children).reduce((n,x)=>n+x.getBoundingClientRect().height+parseFloat(getComputedStyle(x).marginBottom),0);
 LIMIT=Math.min(700,970-68-headerHeight);head.remove();
 const out=[];let now=[];
 const flush=()=>{if(now.length){out.push(now);now=[]}};
 const push=b=>{if(now.length&&height([...now,b])>LIMIT)flush();now.push(b);};
 for(let i=0;i<section.blocks.length;i++){
  const b=section.blocks[i];
  if(b.type==='table'){
   let rows=[b.rows[0]];
   for(const r of b.rows.slice(1)){
    const cand={type:'table',rows:[...rows,r]};
    if(rows.length>1&&height([...now,cand])>LIMIT){push({type:'table',rows});flush();rows=[b.rows[0]]}
    rows.push(r);
   }
   if(rows.length>1)push({type:'table',rows});
  }else{
   const group=[b];while(i+1<section.blocks.length&&['example','meaning'].includes(section.blocks[i+1].type))group.push(section.blocks[++i]);
   if(height(group)<=LIMIT){if(now.length&&height([...now,...group])>LIMIT)flush();now.push(...group)}else group.forEach(push);
  }
 }
 flush();return out;
}
addSlide({title:'Ngữ pháp Prepare 4',english:'Lý thuyết tiếng Việt trình độ B1',kind:'cover',blocks:[{type:'text',text:'Nắm vững cấu trúc, cách dùng và các lưu ý ngữ pháp qua 20 Units.'},{type:'meaning',text:'← / → hoặc Space để chuyển slide. Nhấn F để toàn màn hình. Chọn Unit ở thanh điều khiển.'}]});
for(const u of units){
 unitFirst[u.unit]=slides.length;
 addSlide({unit:u.unit,title:u.title,english:u.english,kind:'unitcover',blocks:[{type:'meaning',text:'Grammar Reference • Trang '+(137+u.unit)}]});
 for(const sec of u.sections){const pages=chunks(sec,u.english);pages.forEach((blocks,i)=>addSlide({unit:u.unit,title:sec.title,english:u.english+(pages.length>1?'   ·   '+(i+1)+'/'+pages.length:''),blocks,section:sec.title}));}
 const o=el('option',null,'Unit '+u.unit+' — '+u.title);o.value=u.unit;document.getElementById('unit').append(o);
}
slides.forEach((s,i)=>s.node.querySelector('.pagenum').textContent=(i+1)+' / '+slides.length);
function scale(){const v=document.getElementById('viewport');stage.style.transform='scale('+Math.min(v.clientWidth/1920,v.clientHeight/1080)+')'}
function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.node.classList.toggle('active',n===current));document.getElementById('counter').textContent=(current+1)+' / '+slides.length;document.getElementById('fill').style.width=((current+1)/slides.length*100)+'%';document.getElementById('unit').value=slides[current].unit;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;try{history.replaceState(null,'','#slide='+String(current+1))}catch(e){}}
function list(){const q=document.getElementById('search').value.toLocaleLowerCase('vi');const target=document.getElementById('listing');target.replaceChildren();slides.forEach((s,i)=>{if(!('Unit '+s.unit+' '+s.title+' '+(units[s.unit-1]?.title||'')).toLocaleLowerCase('vi').includes(q))return;const b=el('button');b.append(el('span','listnum',String(i+1)),el('span',null,(s.unit?'Unit '+s.unit+' · ':'')+s.title));b.onclick=()=>{show(i);toc.close()};target.append(b)});}
function openMenu(){list();toc.showModal();document.getElementById('search').focus()}
async function full(){if(!document.documentElement.requestFullscreen){document.body.classList.toggle('expanded');return}try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){document.body.classList.toggle('expanded')}}
function theme(){document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'Nền sáng':'Nền tối'}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('unit').onchange=e=>show(unitFirst[e.target.value]);document.getElementById('menu').onclick=openMenu;document.getElementById('close').onclick=()=>toc.close();document.getElementById('search').oninput=list;document.getElementById('fullscreen').onclick=full;document.getElementById('theme').onclick=theme;document.getElementById('blackout').onclick=()=>document.body.classList.remove('blank');
document.addEventListener('keydown',e=>{if(document.body.classList.contains('reading')||toc.open||['INPUT','SELECT'].includes(e.target.tagName)||(e.target.tagName==='BUTTON'&&e.key===' '))return;const k=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();show(current+1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();show(current-1)}else if(k==='home'){e.preventDefault();show(0)}else if(k==='end'){e.preventDefault();show(slides.length-1)}else if(k==='f')full();else if(k==='m')openMenu();else if(k==='t')theme();else if(k==='b')document.body.classList.toggle('blank');});
let startX=null,startY=null;stage.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{if(startX!==null){const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(e.changedTouches[0].clientY-startY))show(current+(dx<0?1:-1));startX=null}},{passive:true});
window.addEventListener('resize',scale);document.addEventListener('fullscreenchange',scale);scale();const match=location.hash.match(/slide=(\d+)/);show(match?Number(match[1])-1:0);

const readRoot=document.getElementById('reading');

const sections=[];
units.forEach(u=>{const article=el('article','read-unit');article.id='unit-'+u.unit;article.append(el('p','eyebrow','UNIT '+u.unit),el('h2',null,u.title),el('p','sub',u.english+' · Grammar Reference trang '+(137+u.unit)));u.sections.forEach((sec,j)=>{const n=el('section','read-section');n.id='u'+u.unit+'-s'+j;n.dataset.unit=u.unit;n.dataset.section=sec.title;n.append(el('h3',null,sec.title));sec.blocks.forEach(b=>{const x=block(b);if(b.type==='table'){const wrap=el('div','table-scroll');wrap.tabIndex=0;wrap.setAttribute('aria-label','Bảng ngữ pháp');wrap.append(x);n.append(wrap)}else n.append(x)});article.append(n);sections.push(n)});readRoot.append(article)});

const key='adam-prepare4-reading-v1';let saved={},readSize=19;
try{saved=JSON.parse(localStorage.getItem(key)||'{}');readSize=saved.font||19}catch(e){}
function setFont(n){readSize=Math.max(16,Math.min(26,n));document.body.style.setProperty('--readsize',readSize+'px');persist()}
function currentSection(){let pick=sections[0];for(const n of sections){if(n.getBoundingClientRect().top<=140)pick=n;else break}return pick}
function persist(){if(!document.body.classList.contains('reading'))return;const s=currentSection();try{localStorage.setItem(key,JSON.stringify({font:readSize,section:s.id,offset:s.getBoundingClientRect().top}))}catch(e){}}
function scrollSection(id,offset){const n=document.getElementById(id);if(n)window.scrollTo(0,Math.max(0,window.scrollY+n.getBoundingClientRect().top-(offset===undefined?80:offset)))}
function mode(read,initial){
 let target;
 if(!read&&!initial){const s=currentSection();persist();target=slides.findIndex(x=>x.unit===Number(s.dataset.unit)&&x.section===s.dataset.section)}
 else if(!initial){const s=slides[current];target=sections.find(n=>Number(n.dataset.unit)===s.unit&&n.dataset.section===s.section)||sections.find(n=>Number(n.dataset.unit)===s.unit)}
 document.body.classList.toggle('reading',read);document.documentElement.style.overflow=read?'auto':'hidden';document.documentElement.style.height=read?'auto':'100%';document.getElementById('modeToggle').textContent=read?'Xem slide':'Đọc bài';document.getElementById('modeToggle').setAttribute('aria-label',read?'Chuyển sang Slide Mode':'Chuyển sang Reading Mode');
 if(read){requestAnimationFrame(()=>{if(initial&&saved.section)scrollSection(saved.section,saved.offset);else if(target)scrollSection(target.id);else window.scrollTo(0,0)})}else{window.scrollTo(0,0);show(target>=0?target:current);scale()}
}
