<style>
:root{--bg:#f8fafc;--ink:#122b42;--muted:#38546d;--accent:#005c8a;--line:#b2c5d4;--example:#172b3b;--formula:#004c78;--th:#e3edf4}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#12212e;font-family:Arial,"Helvetica Neue",sans-serif}

.footer{position:absolute;left:106px;right:106px;bottom:36px;display:flex;justify-content:space-between;align-items:center;font-size:27px;color:var(--muted)}
.footer:before{content:"";position:absolute;left:0;right:0;top:-17px;height:2px;background:var(--line)}
.cover{padding-top:155px}.cover h1{font-size:112px;max-width:1500px;margin-bottom:30px}.cover .sub{font-size:52px}.cover .body{max-width:1450px;margin-top:55px}.cover .body p{font-size:46px;margin-bottom:30px}
.unitcover{padding-top:185px}.unitcover h1{font-size:90px;line-height:1.15}.unitcover .sub{font-size:46px;max-width:1550px;margin-top:35px}.unitcover .body{font-size:42px;margin-top:70px}
#toolbar{position:absolute;bottom:0;left:0;right:0;height:62px;display:flex;align-items:center;gap:10px;background:#12212e;color:#fff;padding:8px 18px;font-size:16px;z-index:10}

#toolbar button:hover{background:#385a71}#toolbar button:disabled{opacity:.4;cursor:default}#toolbar select{max-width:310px}#counter{min-width:105px;text-align:center}#track{flex:1;height:5px;background:#375263;border-radius:4px}#fill{height:100%;background:#8dd7fc;border-radius:4px}
dialog{max-width:min(940px,95vw);width:940px;max-height:88vh;background:#f7faff;color:#17364e;border:0;border-radius:12px;padding:24px;box-shadow:0 15px 80px #0006}dialog::backdrop{background:#0009}dialog h2{margin-top:0;font-size:26px}dialog button{border:1px solid #b6c9d8;background:white;padding:12px 16px;border-radius:6px;color:#17364e}
#menu-top{display:flex;gap:16px;justify-content:space-between;align-items:center;margin-bottom:18px}#search{width:100%;padding:13px;font-size:18px;border:1px solid #9db5c6;border-radius:6px;margin-bottom:15px}#listing{max-height:60vh;overflow:auto;display:grid;gap:8px}#listing button{text-align:left;font-size:18px;line-height:1.45}#listing button:hover{background:#e0f1fb}.listnum{display:inline-block;min-width:55px;font-weight:bold;color:#006997}
#blackout{position:fixed;inset:0;background:#000;z-index:30;display:none}body.blank #blackout{display:block}
#measure{position:fixed;left:-10000px;top:0;width:1708px;visibility:hidden;color:var(--ink)}
body.dark{--bg:#10202e;--ink:#f3f8fc;--muted:#bed0e0;--accent:#83d5ff;--line:#476477;--example:#fff;--formula:#9bdeff;--th:#214258}
@media(max-width:750px){#track,#theme{display:none}#toolbar{gap:5px;padding:7px;font-size:13px}#toolbar button,#toolbar select{padding:8px}#toolbar select{max-width:160px}#counter{min-width:65px}#menu{font-size:0}#menu:after{content:"☰";font-size:17px}}
@media print{html,body{height:auto;overflow:visible;background:white}#viewport{position:static;display:block;overflow:visible}#stage{position:static;width:auto;height:auto;transform:none!important;box-shadow:none}#toolbar,#measure,dialog,#blackout{display:none!important}.slide{display:block!important;position:relative;page-break-after:always;break-after:page;width:1920px;height:1080px}.slide:last-child{page-break-after:auto}@page{size:1920px 1080px;margin:0}}

#reading{display:none;background:var(--bg);color:var(--ink);padding:112px 24px 70px;max-width:1000px;margin:auto;font-size:var(--read-size,20px);line-height:1.65}
#reading h1{font-size:2em;line-height:1.2;letter-spacing:0}#reading h2{font-size:1.6em;line-height:1.3;margin:1.2em 0 .6em}#reading h3{font-size:1.2em;margin:0 0 1em;color:var(--accent)}#reading p{white-space:pre-line;margin:.7em 0}#reading .example{background:var(--th);padding:15px 20px;border-radius:10px;font-weight:600}#reading .formula{font-weight:700;border-left:4px solid var(--accent);padding-left:15px}#reading .meaning{color:var(--muted)}#reading table{font-size:.9em;line-height:1.45;table-layout:auto;width:100%;margin:1em 0}#reading th{font-size:1em}#reading th,#reading td{padding:10px;overflow-wrap:anywhere}#reading article{padding:25px 0;scroll-margin-top:115px;border-bottom:1px solid var(--line)}#reading .source{font-size:.8em;color:var(--muted)}
#font-down,#font-up{display:none}body.reading #font-down,body.reading #font-up{display:block}html:has(body.reading){height:auto;overflow:auto;background:var(--bg)}body.reading{height:auto;overflow:visible;background:var(--bg)}body.reading #reading{display:block}body.reading #viewport{display:none}body.reading #toolbar{position:fixed;top:0;bottom:auto;min-height:72px;height:auto;flex-wrap:wrap;box-shadow:0 4px 16px #0003}body.reading #prev,body.reading #next,body.reading #counter,body.reading #track{display:none}body.reading #unit{flex:1;max-width:350px}body.reading #fullscreen{display:none}
@media(max-width:750px){#toolbar{height:auto;min-height:100px;flex-wrap:wrap;justify-content:center}#viewport{bottom:110px}#fullscreen{display:none}body.reading #toolbar{justify-content:flex-start;gap:6px;min-height:96px}body.reading #menu{font-size:13px}body.reading #menu:after{content:none}body.reading #unit{max-width:none;flex-basis:100%;order:2}#reading{padding:125px 16px 50px;font-size:var(--read-size,19px)}#reading table{font-size:.8em}#reading td,#reading th{padding:7px}#reading h1{font-size:1.7em}#reading article{scroll-margin-top:125px}}
</style>

<script>
'use strict';
const units=[{"unit": 0, "english": "About us", "title": "Ôn tập về gia đình và vị trí", "source_page": "4–7, 78", "sections": [{"title": "Have got", "blocks": [{"type": "text", "text": "Dùng have got để nói ai đó có hoặc sở hữu thứ gì. Cấu trúc này cũng dùng để mô tả ngoại hình của người và vật."}, {"type": "example", "text": "My name's Jamie. I'm seven. This is my dad. This is my mum. This is my grandpa. This is my grandma. This is my uncle. This is my aunt. This is my cousin. His name's Brian. This is my sister."}, {"type": "example", "text": "I've got a big family! She's got short black hair."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I", "I have got", "I haven't got = I have not got"], ["you", "you have got", "you haven't got = you have not got"], ["he", "he has got", "he hasn't got = he has not got"], ["she", "she has got", "she hasn't got = she has not got"], ["it", "it has got", "it hasn't got = it has not got"], ["we", "we have got", "we haven't got = we have not got"], ["they", "they have got", "they haven't got = they have not got"]]}, {"type": "text", "text": "I've = I have; you've = you have; he's = he has; she's = she has; it's = it has; we've = we have; they've = they have. Haven't = have not; hasn't = has not."}]}, {"title": "There is và there are", "blocks": [{"type": "text", "text": "Dùng there is để nói có một người hoặc một vật. Thường dùng dạng rút gọn there’s. Dùng there are khi nói có từ hai người hoặc hai vật trở lên."}, {"type": "example", "text": "There's a table. There's a bed."}, {"type": "example", "text": "There are three dolls. There are eleven pencils."}, {"type": "example", "text": "There's a pillow on the table! There are three dolls under the bed!"}]}, {"title": "In on under", "blocks": [{"type": "text", "text": "Các giới từ in, on và under cho biết vị trí của vật."}, {"type": "table", "rows": [["Giới từ", "Nghĩa", "Ví dụ"], ["in", "ở trong", "It's in the cupboard."], ["on", "ở trên", "It's on the table."], ["under", "ở dưới", "It's under the bed."]]}]}]}, {"unit": 1, "english": "At school", "title": "Từ chỉ định và câu hỏi về đồ vật", "source_page": "8–11", "sections": [{"title": "This these that those", "blocks": [{"type": "text", "text": "This và these chỉ người hoặc vật ở gần chúng ta. That và those chỉ người hoặc vật ở xa chúng ta."}, {"type": "table", "rows": [["Vị trí", "Một người hoặc vật", "Nhiều người hoặc vật"], ["Gần", "This is the classroom.", "These are the new tables."], ["Xa", "That's the board.", "Those are the drawers."]]}, {"type": "text", "text": "That's = that is."}, {"type": "example", "text": "This is the new computer. These are the new chairs. This is the new classroom."}, {"type": "example", "text": "That's the cupboard. Those are the pegs."}, {"type": "example", "text": "That's my picture."}]}, {"title": "Hỏi đây hoặc kia là gì", "blocks": [{"type": "text", "text": "Các câu hỏi với what dùng để hỏi đây hoặc kia là gì. Có thể trả lời bằng This is ... / These are ... hoặc That is ... / Those are ...; cũng có thể dùng It’s a ... / They’re ..."}, {"type": "table", "rows": [["Câu hỏi", "Câu trả lời"], ["What's this?", "This is a picture."], ["What are these?", "These are the new rulers."], ["What's that?", "That's a board."], ["What are those?", "Those are the new chairs."]]}, {"type": "text", "text": "It's = it is; they're = they are."}]}]}, {"unit": 2, "english": "My feelings", "title": "Động từ be và cảm xúc", "source_page": "12–15, 78", "sections": [{"title": "Be với tính từ chỉ cảm xúc", "blocks": [{"type": "text", "text": "Dùng be với tính từ để mô tả cảm giác hoặc cảm xúc."}, {"type": "table", "rows": [["Dạng rút gọn", "Dạng đầy đủ"], ["I'm", "I am"], ["you're", "you are"], ["he's", "he is"], ["she's", "she is"], ["it's", "it is"], ["we're", "we are"], ["they're", "they are"]]}, {"type": "table", "rows": [["Tính từ", "Nghĩa"], ["hot / cold", "nóng / lạnh"], ["thirsty / hungry", "khát / đói"], ["happy / sad", "vui / buồn"], ["tired / angry", "mệt / tức giận"], ["scared / brave", "sợ / dũng cảm"]]}, {"type": "example", "text": "He's hot. They're hungry."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I", "I am", "I'm not = I am not"], ["you", "you are", "you aren't = you are not"], ["he", "he is", "he isn't = he is not"], ["she", "she is", "she isn't = she is not"], ["it", "it is", "it isn't = it is not"], ["we", "we are", "we aren't = we are not"], ["they", "they are", "they aren't = they are not"]]}, {"type": "example", "text": "I'm tired. You're thirsty."}]}, {"title": "Câu hỏi với be", "blocks": [{"type": "text", "text": "Có thể dùng be để hỏi câu hỏi Có/Không. Khi hỏi, đổi trật tự từ bằng cách đưa be lên trước chủ ngữ."}, {"type": "example", "text": "She's sad. → Is she sad?"}, {"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Am I ...?", "Yes, I am.", "No, I'm not."], ["Are you ...?", "Yes, you are.", "No, you aren't."], ["Is he ...?", "Yes, he is.", "No, he isn't."], ["Is she ...?", "Yes, she is.", "No, she isn't."], ["Is it ...?", "Yes, it is.", "No, it isn't."], ["Are we ...?", "Yes, we are.", "No, we aren't."], ["Are they ...?", "Yes, they are.", "No, they aren't."]]}, {"type": "example", "text": "Are you hungry? No, I'm not. Is she hungry? No, she isn't. Are they hot? No, we aren't! We're thirsty!"}]}]}, {"unit": 3, "english": "Outdoor toys", "title": "Can diễn tả khả năng", "source_page": "16–19, 79", "sections": [{"title": "Can và cannot", "blocks": [{"type": "text", "text": "Can có nghĩa là có khả năng làm một việc. Can’t có nghĩa là không có khả năng làm việc đó. Can không thay đổi theo chủ ngữ và đứng trước động từ nguyên mẫu."}, {"type": "formula", "text": "Chủ ngữ + can / can’t + động từ nguyên mẫu"}, {"type": "text", "text": "Can't = cannot."}, {"type": "example", "text": "I can skateboard! I can play tennis!"}, {"type": "example", "text": "I can't skateboard. I can't play tennis."}, {"type": "example", "text": "He can skateboard! I can swim."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I", "I can", "I can't = I cannot"], ["you", "you can", "you can't = you cannot"], ["he", "he can", "he can't = he cannot"], ["she", "she can", "she can't = she cannot"], ["it", "it can", "it can't = it cannot"], ["we", "we can", "we can't = we cannot"], ["they", "they can", "they can't = they cannot"]]}]}, {"title": "Câu hỏi với can", "blocks": [{"type": "text", "text": "Dùng can trong câu hỏi Có/Không để hỏi người khác có khả năng làm gì. Đưa can lên trước chủ ngữ."}, {"type": "example", "text": "He can skateboard. → Can he skateboard?"}, {"type": "example", "text": "Yes, he can. / No, he can't."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Can I ...?", "Yes, I can.", "No, I can't."], ["Can you ...?", "Yes, you can.", "No, you can't."], ["Can he ...?", "Yes, he can.", "No, he can't."], ["Can she ...?", "Yes, she can.", "No, she can't."], ["Can it ...?", "Yes, it can.", "No, it can't."], ["Can we ...?", "Yes, we can.", "No, we can't."], ["Can they ...?", "Yes, they can.", "No, they can't."]]}, {"type": "example", "text": "Can you skateboard? No, I can't. Can he skateboard? Yes, he can!"}]}]}, {"unit": 4, "english": "Lunch at the park", "title": "Have got và giới từ chỉ vị trí", "source_page": "22–25, 78", "sections": [{"title": "Hỏi với have got", "blocks": [{"type": "text", "text": "Đưa have hoặc has lên trước chủ ngữ để hỏi ai đó có gì. I, you, we, they dùng have; he, she, it dùng has."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Have I got ...?", "Yes, I have.", "No, I haven't."], ["Have you got ...?", "Yes, you have.", "No, you haven't."], ["Has he got ...?", "Yes, he has.", "No, he hasn't."], ["Has she got ...?", "Yes, she has.", "No, she hasn't."], ["Has it got ...?", "Yes, it has.", "No, it hasn't."], ["Have we got ...?", "Yes, we have.", "No, we haven't."], ["Have they got ...?", "Yes, they have.", "No, they haven't."]]}, {"type": "example", "text": "Has Dave got a sandwich? Yes, he has."}, {"type": "example", "text": "Has he got a banana? No, he hasn't. He's got an apple."}]}, {"title": "Giới từ chỉ vị trí", "blocks": [{"type": "text", "text": "Giới từ chỉ vị trí cho biết người hoặc vật ở đâu."}, {"type": "table", "rows": [["Giới từ", "Nghĩa"], ["next to", "bên cạnh"], ["between", "ở giữa"], ["behind", "phía sau"], ["in front of", "phía trước"]]}, {"type": "example", "text": "Put your juice next to your sandwich."}, {"type": "example", "text": "The salad is between Brian's juice and my sandwich."}, {"type": "example", "text": "Where's Jamie? He's behind that tree. Dave's in front of the tree!"}]}]}, {"unit": 5, "english": "Lessons", "title": "Đại từ và câu hỏi về lịch học", "source_page": "26–29, 79", "sections": [{"title": "We our they their", "blocks": [{"type": "text", "text": "We là đại từ làm chủ ngữ, chỉ từ hai người trở lên, bao gồm người nói. They chỉ từ hai người khác trở lên, không bao gồm người nói."}, {"type": "text", "text": "Our và their là tính từ sở hữu, cho biết thứ gì thuộc về ai."}, {"type": "table", "rows": [["Đại từ", "Tính từ sở hữu", "Ví dụ"], ["we", "our", "our bags, our poster"], ["they", "their", "their bags, their poster"]]}, {"type": "text", "text": "Các tính từ sở hữu khác: my, your, his, her, its."}, {"type": "example", "text": "We're class 2. We've got English, maths and science today. Our bags are big."}, {"type": "table", "rows": [["Đại từ làm chủ ngữ", "Tính từ sở hữu"], ["I", "my"], ["you", "your"], ["he", "his"], ["she", "her"], ["it", "its"], ["we", "our"], ["they", "their"]]}, {"type": "example", "text": "That's class 1. They've got PE and art today. Their bags are small."}]}, {"title": "When have we got và What have we got", "blocks": [{"type": "text", "text": "When dùng để hỏi thời gian một việc diễn ra. What dùng để hỏi thông tin khác. Đây là các câu hỏi có từ để hỏi."}, {"type": "example", "text": "What have we got on Wednesday? We've got English, maths and PE."}, {"type": "example", "text": "When have we got art? We've got art on Tuesday."}, {"type": "example", "text": "We haven't got school on Saturday! Let's go to the beach."}, {"type": "text", "text": "On là giới từ chỉ thời gian. Dùng on trước một ngày trong tuần để nói việc gì diễn ra khi nào."}, {"type": "example", "text": "What have we got on Saturday?"}]}]}, {"unit": 6, "english": "After school", "title": "Hiện tại đơn với I", "source_page": "30–33", "sections": [{"title": "Việc thường làm", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn với các động từ như do, play, help để nói về những việc thường làm mỗi ngày, mỗi tuần hoặc mỗi năm."}, {"type": "example", "text": "After school I do my homework. After school I help my mum. After school I play with friends."}]}, {"title": "Việc thường không làm", "blocks": [{"type": "text", "text": "Dùng dạng phủ định của hiện tại đơn để nói về những việc thường không làm."}, {"type": "formula", "text": "I + don’t + động từ nguyên mẫu"}, {"type": "text", "text": "Don't = do not."}, {"type": "example", "text": "After school I don't write emails. I don't read books. I play with friends!"}, {"type": "example", "text": "I don't watch TV."}]}]}, {"unit": 7, "english": "Presents", "title": "Hiện tại đơn với like", "source_page": "36–39, 79", "sections": [{"title": "Likes và doesn’t like", "blocks": [{"type": "text", "text": "Khi dùng like với he, she, it, thêm s thành likes. Trong câu phủ định, dùng doesn’t like."}, {"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I like sweets.", "I don't like chocolate."], ["He likes chocolate.", "He doesn't like sweets."], ["She likes nuts.", "She doesn't like pastries."]]}, {"type": "text", "text": "Doesn't = does not."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I", "I like", "I don’t like = I do not like"], ["you", "you like", "you don’t like = you do not like"], ["he", "he likes", "he doesn’t like = he does not like"], ["she", "she likes", "she doesn’t like = she does not like"], ["it", "it likes", "it doesn’t like = it does not like"], ["we", "we like", "we don’t like = we do not like"], ["they", "they like", "they don’t like = they do not like"]]}]}, {"title": "Câu hỏi với like", "blocks": [{"type": "text", "text": "Dùng does với like để đặt câu hỏi có chủ ngữ he, she hoặc it."}, {"type": "example", "text": "What does Brian like? Does he like chocolate? Does he like sweets?"}, {"type": "example", "text": "What does he like? Does he like ...? Yes, he does. / No, he doesn't."}, {"type": "example", "text": "Do you like sweets? No, I don't."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Do I like ...?", "Yes, I do.", "No, I don't."], ["Do you like ...?", "Yes, you do.", "No, you don't."], ["Does he like ...?", "Yes, he does.", "No, he doesn't."], ["Does she like ...?", "Yes, she does.", "No, she doesn't."], ["Does it like ...?", "Yes, it does.", "No, it doesn't."], ["Do we like ...?", "Yes, we do.", "No, we don't."], ["Do they like ...?", "Yes, they do.", "No, they don't."]]}]}]}, {"unit": 8, "english": "Every day", "title": "Hiện tại đơn với he she it", "source_page": "40–43", "sections": [{"title": "Dạng khẳng định", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn để nói việc thường làm. Với he, she, it, thêm s vào động từ. Động từ kết thúc bằng o thêm es. Have có dạng khác là has."}, {"type": "table", "rows": [["Chủ ngữ", "get up", "go", "have"], ["he", "gets up", "goes", "has"], ["she", "gets up", "goes", "has"], ["it", "gets up", "goes", "has"]]}, {"type": "example", "text": "He goes to school at 7 o'clock."}, {"type": "example", "text": "Jamie gets up at 6 o'clock. He has breakfast."}]}, {"title": "Dạng phủ định", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn phủ định để nói việc thường không làm. Với he, she, it, dùng doesn’t và động từ nguyên mẫu."}, {"type": "example", "text": "He doesn't go to school. She doesn't have breakfast. It doesn't go to bed."}, {"type": "example", "text": "Alison doesn't get up at 6 o'clock. She gets up at 7 o'clock."}]}]}, {"unit": 9, "english": "Places", "title": "Câu hỏi hiện tại đơn và giới từ thời gian", "source_page": "44–47", "sections": [{"title": "Hỏi nơi chốn với where", "blocks": [{"type": "text", "text": "Where dùng để hỏi về nơi chốn. Dùng does khi hỏi với he, she, it ở hiện tại đơn. Trật tự từ thay đổi trong câu hỏi."}, {"type": "table", "rows": [["Câu kể", "Câu hỏi"], ["He works ...", "Where does he work?"], ["She works ...", "Where does she work?"], ["It works ...", "Where does it work?"]]}, {"type": "text", "text": "Trong câu kể, nhớ thêm s vào động từ work."}, {"type": "example", "text": "Where does he work? He works in a police station. Where does she work? She works in a hospital."}]}, {"title": "Câu hỏi Có hoặc Không", "blocks": [{"type": "text", "text": "Does he work ...? là câu hỏi Có/Không."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời"], ["Does he work ...?", "Yes, he does. / No, he doesn't."], ["Does she work ...?", "Yes, she does. / No, she doesn't."], ["Does it work ...?", "Yes, it does. / No, it doesn't."]]}, {"type": "example", "text": "Does he work in a police station? No, he doesn't. He's a pilot. Does he work in an airport? Yes, he does."}]}, {"title": "In on at", "blocks": [{"type": "table", "rows": [["Giới từ", "Cách dùng"], ["on", "Trước các ngày trong tuần"], ["in", "Với the morning, the afternoon, the evening"], ["at", "Với giờ cụ thể và night"]]}, {"type": "example", "text": "Jamie goes to school in the morning. It’s Monday. On Monday he has science."}, {"type": "example", "text": "In the afternoon he goes swimming. He does his homework in the evening. He goes to bed at 9 o'clock at night."}, {"type": "text", "text": "Dùng when để hỏi về thời gian."}, {"type": "example", "text": "When does he go to school? At 8 o'clock in the morning."}, {"type": "text", "text": "Trong bài này: morning là buổi sáng đến giờ ăn trưa; afternoon là sau bữa trưa, trước bữa tối; evening là sau bữa tối, trước giờ đi ngủ; night là lúc trời tối và đi ngủ."}]}]}, {"unit": 10, "english": "The weather", "title": "Thời tiết câu mệnh lệnh và dấu câu", "source_page": "50–53", "sections": [{"title": "Hỏi về thời tiết", "blocks": [{"type": "text", "text": "Dùng What’s the weather like? để hỏi thời tiết như thế nào. Trả lời bằng It’s ..."}, {"type": "example", "text": "What's the weather like? Is it windy?"}, {"type": "text", "text": "What's = what is; it's = it is."}, {"type": "example", "text": "Yes, it's windy. It's raining. It's windy!"}]}, {"title": "Câu mệnh lệnh", "blocks": [{"type": "text", "text": "Câu mệnh lệnh dùng để yêu cầu ai làm một việc. Dùng động từ nguyên mẫu. Câu mệnh lệnh phủ định yêu cầu ai không làm một việc."}, {"type": "formula", "text": "Động từ nguyên mẫu ... / Don’t + động từ nguyên mẫu ..."}, {"type": "example", "text": "Put on your coat, Alison."}, {"type": "example", "text": "Don't put on your hat, Jamie!"}]}, {"title": "Dấu câu", "blocks": [{"type": "text", "text": "Khi viết một câu, bắt đầu bằng chữ hoa và kết thúc bằng dấu chấm (full stop)."}, {"type": "text", "text": "Dấu nháy (apostrophe) dùng trong dạng rút gọn và để chỉ sự sở hữu."}, {"type": "text", "text": "Dấu phẩy (comma) đánh dấu chỗ ngắt ngắn, ví dụ khi liệt kê nhiều từ."}, {"type": "text", "text": "Dấu hỏi (question mark) đặt cuối câu hỏi. Đôi khi dùng dấu chấm than (exclamation mark) cuối câu mệnh lệnh."}, {"type": "example", "text": "Dear Jon\nMy name's Jamie. I'm in class 2. My sister's name is Alison. My friends are Dave, Angie and Emma. I like English and PE. What do you like? Write to me!\nJamie"}]}]}, {"unit": 11, "english": "Clothes", "title": "Hiện tại tiếp diễn và cách nói giờ", "source_page": "54–57, 80", "sections": [{"title": "Việc đang diễn ra", "blocks": [{"type": "text", "text": "I’m wearing là dạng hiện tại tiếp diễn của wear. Dùng thì này để nói việc đang diễn ra ngay bây giờ. Grandma và Grandpa đang mặc áo khoác lúc này; họ không mặc áo khoác mỗi ngày."}, {"type": "example", "text": "Grandma and Grandpa are on holiday. Is it cold? What are you wearing? Yes, it's cold and windy. I'm wearing a red scarf. What is Grandpa wearing? He's wearing a brown coat and a brown hat."}, {"type": "table", "rows": [["Rút gọn", "Đầy đủ"], ["I'm wearing", "I am wearing"], ["you're wearing", "you are wearing"], ["he's wearing", "he is wearing"], ["she's wearing", "she is wearing"], ["it's wearing", "it is wearing"], ["we're wearing", "we are wearing"], ["they're wearing", "they are wearing"]]}, {"type": "table", "rows": [["Chủ ngữ", "Phủ định rút gọn", "Phủ định đầy đủ"], ["I", "I'm not wearing", "I am not wearing"], ["you", "you aren't wearing", "you are not wearing"], ["he", "he isn't wearing", "he is not wearing"], ["she", "she isn't wearing", "she is not wearing"], ["it", "it isn't wearing", "it is not wearing"], ["we", "we aren't wearing", "we are not wearing"], ["they", "they aren't wearing", "they are not wearing"]]}]}, {"title": "Cách nói giờ", "blocks": [{"type": "table", "rows": [["Mẫu câu", "Nghĩa"], ["It's quarter to six.", "6 giờ kém 15 phút"], ["It's six o’clock.", "6 giờ đúng"], ["It's quarter past six.", "6 giờ 15 phút"], ["It's half past six.", "6 giờ 30 phút"]]}, {"type": "example", "text": "No. It's quarter to eight! We're at school!"}, {"type": "example", "text": "It's half past five. I'm in bed."}]}, {"title": "Bảng câu hỏi với wear", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Am I wearing?", "Yes, I am.", "No, I'm not."], ["Are you wearing?", "Yes, you are.", "No, you aren't."], ["Is he wearing?", "Yes, he is.", "No, he isn't."], ["Is she wearing?", "Yes, she is.", "No, she isn't."], ["Is it wearing?", "Yes, it is.", "No, it isn't."], ["Are we wearing?", "Yes, we are.", "No, we aren't."], ["Are they wearing?", "Yes, they are.", "No, they aren't."]]}]}]}, {"unit": 12, "english": "At the wedding", "title": "Cấu trúc và câu hỏi hiện tại tiếp diễn", "source_page": "58–61, 80", "sections": [{"title": "Cấu trúc hiện tại tiếp diễn", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn để nói việc đang diễn ra ngay bây giờ. Cấu tạo gồm một dạng của be và động từ nguyên mẫu thêm ing."}, {"type": "formula", "text": "Chủ ngữ + am / is / are + động từ thêm ing"}, {"type": "table", "rows": [["Rút gọn", "Đầy đủ"], ["I'm eating", "I am eating"], ["you're eating", "you are eating"], ["he's eating", "he is eating"], ["she's eating", "she is eating"], ["it's eating", "it is eating"], ["we're eating", "we are eating"], ["they're eating", "they are eating"]]}, {"type": "example", "text": "Grandma's next to Grandpa. They're sleeping. Dad's next to the table. He's eating."}]}, {"title": "Câu hỏi hiện tại tiếp diễn", "blocks": [{"type": "text", "text": "Trong câu hỏi, đưa am, is hoặc are lên trước chủ ngữ."}, {"type": "example", "text": "Is she listening to the band?"}, {"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Am I eating?", "Yes, I am.", "No, I'm not."], ["Are you eating?", "Yes, you are.", "No, you aren't."], ["Is he eating?", "Yes, he is.", "No, he isn't."], ["Is she eating?", "Yes, she is.", "No, she isn't."], ["Is it eating?", "Yes, it is.", "No, it isn't."], ["Are we eating?", "Yes, we are.", "No, we aren't."], ["Are they eating?", "Yes, they are.", "No, they aren't."]]}, {"type": "text", "text": "Aren't = are not; isn't = is not."}, {"type": "example", "text": "Is she eating? No, she isn't. Is she listening to the band? No, she isn't. Is she taking photos? Yes, she is!"}]}]}, {"unit": 13, "english": "On the farm", "title": "So sánh hơn và liên từ and", "source_page": "64–67", "sections": [{"title": "Tính từ so sánh hơn", "blocks": [{"type": "text", "text": "Big và loud là tính từ, dùng để mô tả người hoặc vật. Bigger và louder là tính từ so sánh hơn, diễn tả sự khác nhau giữa hai người hoặc hai vật."}, {"type": "text", "text": "Trong các tính từ ở bài này, thêm er vào cuối tính từ để tạo dạng so sánh hơn. Đôi khi cách viết thay đổi."}, {"type": "table", "rows": [["Tính từ", "So sánh hơn"], ["small", "smaller"], ["loud", "louder"], ["quiet", "quieter"], ["fast", "faster"], ["slow", "slower"], ["big", "bigger"]]}, {"type": "formula", "text": "big + g + er → bigger"}, {"type": "example", "text": "This donkey is loud. That donkey is louder."}, {"type": "example", "text": "This horse is big. That horse is bigger."}, {"type": "text", "text": "This và these chỉ người hoặc vật ở gần. That và those chỉ người hoặc vật ở xa."}]}, {"title": "So sánh với than", "blocks": [{"type": "text", "text": "Dùng than sau tính từ so sánh hơn khi so sánh trực tiếp một người hoặc vật với người hoặc vật khác."}, {"type": "example", "text": "The horse is bigger than the donkey."}]}, {"title": "Liên từ and", "blocks": [{"type": "text", "text": "And là liên từ, tức từ nối. Có thể dùng and để nối hai câu thành một câu."}, {"type": "example", "text": "Alison is bigger than Jenny and she's louder than Jenny!"}, {"type": "example", "text": "The horse is big. It's bigger than the donkey and it's bigger than the sheep."}]}]}, {"unit": 14, "english": "The school play", "title": "Quá khứ đơn của be", "source_page": "68–71, 80", "sections": [{"title": "Was và were", "blocks": [{"type": "text", "text": "Was và were là các dạng quá khứ đơn của be. Dùng với tính từ để mô tả cảm giác hoặc cảm xúc trong quá khứ."}, {"type": "table", "rows": [["Hôm nay thứ Ba", "Hôm qua thứ Hai"], ["I am hot.", "I was cold."], ["Jamie is tired.", "Jamie was happy."], ["Mum and Dad are tired.", "Mum and Dad were happy."]]}, {"type": "text", "text": "Cũng dùng be ở quá khứ để nói ai hoặc cái gì là gì, vị trí của người hoặc vật, thời gian và thời tiết trong quá khứ."}, {"type": "example", "text": "Jamie's tired. Yesterday he was in the school play. He was a fireman. Mum and Dad were happy."}]}, {"title": "Wasn’t và weren’t", "blocks": [{"type": "text", "text": "Dạng phủ định là was not và were not. Thường dùng dạng rút gọn wasn’t và weren’t."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I", "I was", "I wasn't = I was not"], ["you", "you were", "you weren't = you were not"], ["he", "he was", "he wasn't = he was not"], ["she", "she was", "she wasn't = she was not"], ["it", "it was", "it wasn't = it was not"], ["we", "we were", "we weren't = we were not"], ["they", "they were", "they weren't = they were not"]]}, {"type": "example", "text": "Jamie was a fireman. His friend Dave wasn't a fireman. He was a policeman. Alison wasn't in the play."}]}, {"title": "Bảng câu hỏi quá khứ của be", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Có", "Trả lời Không"], ["Was I ...?", "Yes, I was.", "No, I wasn't."], ["Were you ...?", "Yes, you were.", "No, you weren't."], ["Was he ...?", "Yes, he was.", "No, he wasn't."], ["Was she ...?", "Yes, she was.", "No, she wasn't."], ["Was it ...?", "Yes, it was.", "No, it wasn't."], ["Were we ...?", "Yes, we were.", "No, we weren't."], ["Were they ...?", "Yes, they were.", "No, they weren't."]]}]}]}, {"unit": 15, "english": "School open day", "title": "Some any số thứ tự và danh từ số nhiều", "source_page": "72–75, 80", "sections": [{"title": "Some và any", "blocks": [{"type": "text", "text": "Dùng some và any khi nói về từ hai người hoặc hai vật trở lên mà không nêu số lượng chính xác. Trong cách dùng của bài này, some dùng trong câu khẳng định; any dùng trong câu phủ định."}, {"type": "example", "text": "There aren't any teachers. There are some teachers. There aren't any pictures. There are some pictures."}]}, {"title": "Số thứ tự", "blocks": [{"type": "text", "text": "First, second, third là số thứ tự. Dùng để nói thứ tự của người hoặc vật, ví dụ trong cuộc thi hoặc cuộc đua."}, {"type": "table", "rows": [["Số đếm", "Số thứ tự"], ["1 one", "1st first"], ["2 two", "2nd second"], ["3 three", "3rd third"], ["4 four", "4th fourth"], ["5 five", "5th fifth"], ["6 six", "6th sixth"], ["7 seven", "7th seventh"], ["8 eight", "8th eighth"], ["9 nine", "9th ninth"], ["10 ten", "10th tenth"]]}, {"type": "example", "text": "The third prize for English is for Jamie. The second prize for English is for Emma. The first prize for English is for Tony."}]}, {"title": "Danh từ số nhiều", "blocks": [{"type": "text", "text": "Dùng danh từ số nhiều khi nói về từ hai người hoặc hai vật trở lên. Thường thêm s."}, {"type": "example", "text": "one boy → two boys"}, {"type": "text", "text": "Một số danh từ có dạng số nhiều khác, cần chú ý cách viết."}, {"type": "table", "rows": [["Số ít", "Số nhiều"], ["one lolly", "two lollies"], ["one family", "two families"], ["one pastry", "two pastries"], ["one party", "two parties"], ["one tomato", "three tomatoes"], ["one sandwich", "three sandwiches"], ["one shelf", "four shelves"], ["one child", "two children"], ["one woman", "two women"], ["one man", "two men"]]}, {"type": "example", "text": "Great! I like parties! I like lollies."}]}]}];
const meta={"book": "Grammar Friends 2", "title": "Ngữ pháp Grammar Friends 2", "brand": "ADAM ENGLISH", "teacher": "Tiếng Anh Thầy Phú", "level": "", "source_note": "Grammar Friends 2 • Tim Ward • Oxford University Press 2009", "filename": "Grammar_Friends_2_Ngu_phap_tieng_Viet"};
const stage=document.getElementById('stage'),measure=document.getElementById('measure'),toc=document.getElementById('toc');
let readingMode=false;let slides=[],current=0;const unitFirst={'-1':0};let LIMIT=700;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function block(b){
 if(b.type==='table'){const t=el('table');const head=el('thead'),tr=el('tr');b.rows[0].forEach(x=>tr.append(el('th',null,x)));head.append(tr);t.append(head);const body=el('tbody');b.rows.slice(1).forEach(r=>{const tr=el('tr');r.forEach(x=>tr.append(el('td',null,x)));body.append(tr)});t.append(body);return t}
 return el('p',b.type==='text'?'':b.type,b.text);
}
function height(blocks){measure.replaceChildren(...blocks.map(block));return measure.scrollHeight}
function addSlide({unit=-1,title,english='',blocks=[],kind='',section=''}){
 const n=el('section','slide '+kind);n.dataset.unit=unit;n.append(el('p','eyebrow',unit===-1?meta.brand:(unit===0?'STARTER':'UNIT '+unit)));
 n.append(el('h1',null,title));n.append(el('p','sub',english));const b=el('div','body');blocks.forEach(x=>b.append(block(x)));n.append(b);
 const f=el('div','footer');f.append(el('span',null,meta.teacher),el('span','pagenum'));n.append(f);stage.append(n);slides.push({node:n,unit,title,section,blocks});
}
function chunks(section,english){
 const head=el('div');head.style.cssText='position:fixed;left:-10000px;width:1708px;visibility:hidden';
 head.append(el('p','eyebrow','UNIT 20'),el('h1',null,section.title),el('p','sub',english+'   ·   10/10'));document.body.append(head);
 const headerHeight=Array.from(head.children).reduce((n,x)=>n+x.getBoundingClientRect().height+parseFloat(getComputedStyle(x).marginBottom),0);
 LIMIT=Math.min(700,970-68-headerHeight);head.remove();
 const out=[];let now=[];
 const flush=()=>{if(now.length){out.push(now);now=[]}};
 const push=b=>{if(now.length&&height([...now,b])>LIMIT)flush();now.push(b);};
 for(let i=0;i<section.blocks.length;i++){
  const b=section.blocks[i];
  if(b.type==='table'){
   let rows=[b.rows[0]];
   for(const r of b.rows.slice(1)){
    const cand={type:'table',rows:[...rows,r]};
    if(rows.length>1&&height([...now,cand])>LIMIT){push({type:'table',rows});flush();rows=[b.rows[0]]}
    rows.push(r);
   }
   if(rows.length>1)push({type:'table',rows});
  }else{
   const group=[b];while(i+1<section.blocks.length&&['example','meaning'].includes(section.blocks[i+1].type))group.push(section.blocks[++i]);
   if(height(group)<=LIMIT){if(now.length&&height([...now,...group])>LIMIT)flush();now.push(...group)}else group.forEach(push);
  }
 }
 flush();return out;
}
addSlide({title:meta.title,english:''+(meta.level?' trình độ '+meta.level:''),kind:'cover',blocks:[{type:'text',text:'Nắm vững cấu trúc và cách dùng ngữ pháp qua phần Starter và 15 Unit.'},{type:'meaning',text:'← / → hoặc Space để chuyển slide. Nhấn F để toàn màn hình. Chọn Unit ở thanh điều khiển.'}]});
for(const u of units){
 unitFirst[u.unit]=slides.length;
 addSlide({unit:u.unit,title:u.title,english:u.english,kind:'unitcover',blocks:[{type:'meaning',text:(u.source_page?'Grammar Friends 2 • Trang '+u.source_page:(meta.source_note||meta.book))}]});
 for(const sec of u.sections){const pages=chunks(sec,u.english);pages.forEach((blocks,i)=>addSlide({unit:u.unit,title:sec.title,english:u.english+(pages.length>1?'   ·   '+(i+1)+'/'+pages.length:''),blocks,section:sec.title}));}
 const o=el('option',null,(u.unit===0?'Starter':'Unit '+u.unit)+' — '+u.title);o.value=u.unit;document.getElementById('unit').append(o);
}
slides.forEach((s,i)=>s.node.querySelector('.pagenum').textContent=(i+1)+' / '+slides.length);
function scale(){const v=document.getElementById('viewport');stage.style.transform='scale('+Math.min(v.clientWidth/1920,v.clientHeight/1080)+')'}
function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.node.classList.toggle('active',n===current));document.getElementById('counter').textContent=(current+1)+' / '+slides.length;document.getElementById('fill').style.width=((current+1)/slides.length*100)+'%';document.getElementById('unit').value=slides[current].unit;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;history.replaceState(null,'','#slide='+String(current+1));}
function list(){if(readingMode){readList();return;}const q=document.getElementById('search').value.toLocaleLowerCase('vi');const target=document.getElementById('listing');target.replaceChildren();slides.forEach((s,i)=>{if(!('Unit '+s.unit+' '+s.title+' '+(units.find(u=>u.unit===s.unit)?.title||'')).toLocaleLowerCase('vi').includes(q))return;const b=el('button');b.append(el('span','listnum',String(i+1)),el('span',null,(s.unit===-1?'':s.unit===0?'Starter · ':'Unit '+s.unit+' · ')+s.title));b.onclick=()=>{show(i);toc.close()};target.append(b)});}
function openMenu(){list();toc.showModal();document.getElementById('search').focus()}
async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){alert('Trình duyệt này chưa cho phép toàn màn hình. Thầy có thể dùng phím F11 hoặc nút toàn màn hình của trình duyệt.')}}
function theme(){document.body.classList.toggle('dark');document.getElementById('theme').textContent=document.body.classList.contains('dark')?'Nền sáng':'Nền tối'}
document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('unit').onchange=e=>show(unitFirst[e.target.value]);document.getElementById('menu').onclick=openMenu;document.getElementById('close').onclick=()=>toc.close();document.getElementById('search').oninput=list;document.getElementById('fullscreen').onclick=full;document.getElementById('theme').onclick=theme;document.getElementById('blackout').onclick=()=>document.body.classList.remove('blank');
document.addEventListener('keydown',e=>{if(readingMode||toc.open||['INPUT','SELECT'].includes(e.target.tagName)||(e.target.tagName==='BUTTON'&&e.key===' '))return;const k=e.key.toLowerCase();if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();show(current+1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();show(current-1)}else if(k==='home'){e.preventDefault();show(0)}else if(k==='end'){e.preventDefault();show(slides.length-1)}else if(k==='f')full();else if(k==='m')openMenu();else if(k==='t')theme();else if(k==='b')document.body.classList.toggle('blank');});
let startX=null;stage.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{if(startX!==null){const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>60)show(current+(dx<0?1:-1));startX=null}},{passive:true});
window.addEventListener('resize',scale);document.addEventListener('fullscreenchange',scale);scale();const match=location.hash.match(/slide=(\d+)/);show(match?Number(match[1])-1:0);
window.deck={slides,units,show,unitFirst};

const readRoot=document.getElementById('reading'),readSections=[];
const storage={get(k){try{return localStorage.getItem('gf2-'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('gf2-'+k,v)}catch(e){}}};
let readSize=Math.max(16,Math.min(28,Number(storage.get('font'))||19));document.documentElement.style.setProperty('--read-size',readSize+'px');
readRoot.append(el('p','eyebrow',meta.brand),el('h1',null,meta.title),el('p','source',meta.teacher+' · '+meta.source_note));
readRoot.append(el('p',null,'Đọc cấu trúc, cách dùng và ví dụ theo từng Unit để ôn tập ngữ pháp.'));
for(const u of units){const head=el('h2',null,(u.unit===0?'Starter':'Unit '+u.unit)+' · '+u.title);readRoot.append(head);readRoot.append(el('p','source','Grammar Friends 2 · Trang '+u.source_page));for(const sec of u.sections){const a=el('article');a.id='read-'+u.unit+'-'+readSections.length;a.dataset.unit=u.unit;a.append(el('h3',null,sec.title));sec.blocks.forEach(b=>a.append(block(b)));const si=slides.findIndex(s=>s.unit===u.unit&&s.section===sec.title);readSections.push({node:a,unit:u.unit,title:sec.title,si});readRoot.append(a)}}
let activeRead=0;
function scrollRead(i){activeRead=Math.max(0,Math.min(readSections.length-1,i));document.getElementById('unit').value=readSections[activeRead].unit;readSections[activeRead].node.scrollIntoView({block:'start'});storage.set('section',activeRead)}
function readList(){const q=document.getElementById('search').value.toLocaleLowerCase('vi'),target=document.getElementById('listing');target.replaceChildren();readSections.forEach((s,i)=>{const u=units.find(u=>u.unit===s.unit);const label=(s.unit===0?'Starter':'Unit '+s.unit)+' · '+u.title+' · '+s.title;if(!label.toLocaleLowerCase('vi').includes(q))return;const b=el('button',null,label);b.onclick=()=>{toc.close();scrollRead(i)};target.append(b)})}
function setMode(read,initial=false){if(!read&&readingMode){show(readSections[activeRead].si)}if(read&&!readingMode&&!initial){const at=readSections.findIndex(s=>s.unit===slides[current].unit&&s.title===slides[current].section);activeRead=at>=0?at:Math.max(0,readSections.findIndex(s=>s.unit===slides[current].unit))}readingMode=read;document.body.classList.toggle('reading',read);document.documentElement.style.overflow=read?'auto':'hidden';document.getElementById('mode').textContent=read?'Chế độ slide':'Chế độ đọc';if(read){requestAnimationFrame(()=>{if(initial){activeRead=Math.max(0,Math.min(readSections.length-1,Number(storage.get('section'))||0));const y=Number(storage.get('scroll'));if(y>0)window.scrollTo(0,y);else window.scrollTo(0,0)}else scrollRead(activeRead)})}else{window.scrollTo(0,0);scale()}storage.set('mode',read?'reading':'slide')}
document.getElementById('mode').onclick=()=>setMode(!readingMode);
document.getElementById('unit').onchange=e=>{const n=Number(e.target.value);if(readingMode){if(n<0)window.scrollTo(0,0);else scrollRead(readSections.findIndex(s=>s.unit===n))}else show(unitFirst[n])};
for(const [id,delta] of [['font-down',-1],['font-up',1]])document.getElementById(id).onclick=()=>{readSize=Math.max(16,Math.min(28,readSize+delta));document.documentElement.style.setProperty('--read-size',readSize+'px');storage.set('font',readSize)};
let scrollTimer;window.addEventListener('scroll',()=>{if(!readingMode)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{let i=0;readSections.forEach((s,j)=>{if(s.node.getBoundingClientRect().top<150)i=j});activeRead=i;document.getElementById('unit').value=readSections[i].unit;storage.set('section',i);storage.set('scroll',window.scrollY)},120)},{passive:true});
setMode(matchMedia('(max-width:750px)').matches||storage.get('mode')==='reading',true);
window.lessonUI={setMode,scrollRead,readSections};

</script>
