              "type": "example",
              "text": "Where are Jamie and Dave? Are they in the hall?"

              "type": "example",
              "text": "Where are Jamie and Dave? Are they in the bedroom? — No, they aren't."

              "text": "Upstairs và downstairs là trạng từ chỉ nơi chốn trong nhà. Upstairs nghĩa là ở tầng trên; downstairs nghĩa là ở tầng dưới."

              "type": "example",
              "text": "Where's Jamie? — He's upstairs."

              "type": "example",
              "text": "Where are Alison and Mum? — They're downstairs."

            {
              "type": "example",
              "text": "Where's the bathroom? — It's upstairs."

              "type": "example",
              "text": "Where are the kitchen and the dining room? — They're downstairs."

    {
      "unit": 10,
      "label": "Unit 9",
      "english": "My lunch",
      "title": "Bữa trưa của em",
      "source_page": "44, 46",
      "sections": [
        {
          "title": "I've got và I haven't got",
          "blocks": [
            {
              "type": "text",
              "text": "I've got cho biết em có hoặc sở hữu một thứ gì đó. I haven't got cho biết em không có thứ đó."
            },
            {
              "type": "example",
              "text": "I've got a sandwich. It's my sandwich."
            },
            {
              "type": "example",
              "text": "I've got a banana. I've got two sandwiches."
            },
            {
              "type": "example",
              "text": "I haven't got a banana."
            },
            {
              "type": "formula",
              "text": "I've got = I have got; I haven't got = I have not got"
            }
          ]
        },
        {
          "title": "Have you got",
          "blocks": [
            {
              "type": "text",
              "text": "Have you got ...? là câu hỏi Có/Không về những thứ một người có. Trả lời ngắn bằng Yes, I have. hoặc No, I haven’t."
            },
            {
              "type": "example",
              "text": "Have you got your lunch box? Have you got your books? Have you got your pencil case? — Yes, I have."
            },
            {
              "type": "example",
              "text": "Have you got your shoes? — No, I haven't!"
            },
            {
              "type": "formula",
              "text": "No, I haven't. = No, I have not."
            }
          ]
        }
      ]
    },
    {
      "unit": 11,
      "label": "Unit 10",
      "english": "My friends",
      "title": "Bạn bè của em",
      "source_page": "50",
      "sections": [
        {
          "title": "He's got She's got It's got",
          "blocks": [
            {
              "type": "text",
              "text": "He’s got, she’s got và it’s got cho biết một người hoặc vật có hay sở hữu thứ gì đó. Các cấu trúc này cũng dùng để mô tả đặc điểm bên ngoài."
            },
            {
              "type": "example",
              "text": "She's got a doll. It's her doll."
            },
            {
              "type": "table",
              "rows": [
                [
                  "Khẳng định",
                  "Phủ định"
                ],
                [
                  "He's got short hair.",
                  "He hasn’t got long hair."
                ],
                [
                  "It's got four sides.",
                  "It hasn’t got four sides."
                ]
              ]
            },
            {
              "type": "formula",
              "text": "…'s got = has got; … hasn't got = has not got"
            }
          ]
        },
        {
          "title": "Ví dụ miêu tả",
          "blocks": [
            {
              "type": "example",
              "text": "This is Jamie. He's got short hair. He's got brown eyes."
            },
            {
              "type": "example",
              "text": "This is Jamie's friend. Her name's Angie. She hasn't got short hair. She's got long hair. She's got green eyes."
            }
          ]
        }
      ]
    },
    {
      "unit": 12,
      "label": "Unit 11",
      "english": "Zoo trip",
      "title": "Đi thăm sở thú",
      "source_page": "54, 56",
      "sections": [
        {
          "title": "I like và I don’t like",
          "blocks": [
            {
              "type": "text",
              "text": "I like và I don’t like là dạng hiện tại đơn của động từ like. Trong bài này, hiện tại đơn diễn tả những điều đúng ở hiện tại."
            },
            {
              "type": "example",
              "text": "I like monkeys."
            },
            {
              "type": "example",
              "text": "I don't like snakes."
            },
            {
              "type": "formula",
              "text": "I like ... = Tôi thích ...; I don't like ... = Tôi không thích ..."
            },
            {
              "type": "formula",
              "text": "don't = do not"
            }
          ]
        },
        {
          "title": "Tính từ",
          "blocks": [
            {
              "type": "text",
              "text": "Green và tall là tính từ. Tính từ miêu tả người hoặc vật. Tính từ giữ nguyên dạng khi nói về một hay nhiều người hoặc vật."
            },
            {
              "type": "example",
              "text": "It's green. They're tall."
            },
            {
              "type": "example",
              "text": "It's big. They're big."

        }
      ]
    },
    {

    {
      "unit": 14,
      "label": "Unit 13",
      "english": "My room",
      "title": "Căn phòng của em",
      "source_page": "64, 66–67",
      "sections": [
        {
          "title": "There’s và there are",
          "blocks": [
            {
              "type": "text",
              "text": "Dùng there’s và there are để nói có người hoặc vật ở xung quanh. There’s dùng với một người hoặc một vật. There are dùng với từ hai người hoặc hai vật trở lên."
            },
            {
              "type": "example",
              "text": "There's a bed. There's a cupboard."
            },
            {
              "type": "example",
              "text": "There are four rooms."
            },
            {
              "type": "formula",
              "text": "there's = there is"
            }
          ]
        },
        {
          "title": "Is there",
          "blocks": [
            {
              "type": "text",
              "text": "Is there ...? là câu hỏi Có/Không về sự hiện diện của một vật. Đưa is lên trước there."
            },
            {
              "type": "example",
              "text": "There's a pillow on the bed. → Is there a pillow on the bed?"
            },
            {
              "type": "text",
              "text": "Trả lời ngắn bằng Yes, there is. hoặc No, there isn’t."
            },
            {
              "type": "example",
              "text": "Is there a ball? — Yes, there is. / No, there isn't."
            },
            {
              "type": "example",
              "text": "Is there a car? — Yes, there is."
            },
            {
              "type": "example",
              "text": "Is there a train? — No, there isn't."
            },
            {
              "type": "formula",
              "text": "No, there isn't. = No, there is not."
            }
          ]
        }
      ]
    },
    {
      "unit": 15,
      "label": "Unit 14",
      "english": "Abilities",
      "title": "Khả năng",
      "source_page": "68, 70",
      "sections": [
        {
          "title": "Can và can’t",
          "blocks": [
            {
              "type": "text",
              "text": "Can diễn tả có khả năng làm việc gì. Can đứng trước một động từ khác. Can’t diễn tả không có khả năng làm việc gì."
            },
            {
              "type": "example",
              "text": "A bird can fly. It can fly."
            },
            {
              "type": "example",
              "text": "Alison can run. She can run."
            },
            {
              "type": "example",
              "text": "A snake can't run. It can't run."
            },
            {
              "type": "example",
              "text": "Jamie can't fly. He can't fly."
            },
            {
              "type": "example",
              "text": "I can run! A snake can't run. A bird can fly. I can't fly."
            },
            {
              "type": "formula",
              "text": "can't = cannot"
            }
          ]
        },
        {
          "title": "Can it Can he Can she",
          "blocks": [
            {
              "type": "text",
              "text": "Can it ...? hỏi về khả năng của con vật hoặc vật. Trả lời ngắn bằng Yes, it can. hoặc No, it can’t. Dùng Can he ...? và Can she ...? để hỏi về khả năng của người."
            },
            {
              "type": "example",
              "text": "Can it run? — Yes, it can. / No, it can't."
            },
            {
              "type": "example",
              "text": "Can it fly? — Yes, it can. / No, it can't."
            }
          ]
        }
      ]
    },

DATA.units.forEach((u,ui)=>{let a=document.createElement('article');a.innerHTML=`<div class="kicker">${esc(u.label)} • ${esc(u.english)}</div><h2>${esc(u.title)}</h2><p class="source">Grammar Friends 1 • Trang ${esc(u.source_page)}</p>`;u.sections.forEach(s=>{let n=sections.length;sections.push({u,s,ui,n});let el=document.createElement('section');el.id='s'+n;el.style.scrollMarginTop='145px';el.innerHTML=`<h3>${esc(s.title)}</h3>`+s.blocks.map(block).join('');a.append(el)});$('#lessons').append(a);let opt=document.createElement('option');opt.value=ui;opt.textContent=`${u.label} · ${u.title}`;$('#pick').append(opt)});
function head(x){return `<div class="kicker">${esc(x.u.label)} • ${esc(x.u.english)}</div><h2>${esc(x.s.title)}</h2><div id="slideContent"></div><div class="source">ADAM ENGLISH · Tiếng Anh Thầy Phú · Trang nguồn ${esc(x.u.source_page)}</div>`}
function paginate(){const stage=$('#stage');stage.style.display='flex';stage.style.visibility='hidden';const el=$('#slide');for(const x of sections){let parts=[];for(const b of x.s.blocks){if(b.type==='table'){for(let r=1;r<b.rows.length;r+=4)parts.push({...b,rows:[b.rows[0],...b.rows.slice(r,r+4)]})}else parts.push(b)}el.innerHTML=head(x);let limit=970-$('#slideContent').offsetTop;let group=[];for(const b of parts){$('#slideContent').innerHTML=[...group,b].map(block).join('');if($('#slideContent').scrollHeight>limit&&group.length){slides.push({x,blocks:group});group=[b]}else group.push(b);$('#slideContent').innerHTML=group.map(block).join('')}if(group.length)slides.push({x,blocks:group})}stage.style.display='';stage.style.visibility='';show(0)}
