'use strict';const data={"meta": {"book": "Prepare 1", "title": "Ngữ pháp Prepare 1", "brand": "ADAM ENGLISH", "teacher": "Tiếng Anh Thầy Phú", "level": "", "filename": "ADAM_Prepare_1_BAI_GIANG", "source_note": "Prepare 1 • Grammar Reference • Trang 136–157"}, "units": [{"unit": "Starter", "title": "Khởi động: a/an và từ chỉ định", "english": "A/an; this, that, these, those", "source_page": "136", "sections": [{"title": "A/an: một người hoặc một vật", "blocks": [{"type": "text", "text": "Dùng a/an trước danh từ đếm được số ít. A đứng trước âm phụ âm; an đứng trước âm nguyên âm. Chọn theo âm đọc của từ ngay sau mạo từ."}, {"type": "example", "text": "a cake • a picture"}, {"type": "example", "text": "an apple • an orange"}]}, {"title": "This, that, these, those", "blocks": [{"type": "text", "text": "This và these chỉ người/vật ở gần; that và those chỉ người/vật ở xa hơn. This/that đi với danh từ số ít và is; these/those đi với danh từ số nhiều và are."}, {"type": "example", "text": "This pen is yellow."}, {"type": "example", "text": "These pens are black."}, {"type": "example", "text": "That desk is grey."}, {"type": "example", "text": "Those desks are brown."}]}]}, {"unit": 1, "title": "Từ hạn định sở hữu và động từ be", "english": "Determiners; be", "source_page": "137", "sections": [{"title": "My, your, his, her", "blocks": [{"type": "text", "text": "Từ hạn định sở hữu đứng trước danh từ để cho biết người/vật đó thuộc về ai. Chọn từ theo người sở hữu."}, {"type": "table", "rows": [["Đại từ chủ ngữ", "Từ sở hữu", "Ví dụ"], ["I", "my (của tôi)", "My name is Oliver."], ["you", "your (của bạn)", "This is your phone."], ["he", "his (của anh ấy)", "This is his camera."], ["she", "her (của cô ấy)", "Her name isn’t Rosa."]]}]}, {"title": "Be: dạng khẳng định", "blocks": [{"type": "text", "text": "Be thay đổi theo chủ ngữ: I đi với am; he/she/it đi với is; you/we/they đi với are. Có thể viết dạng đầy đủ hoặc rút gọn như bảng."}, {"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["I am → I’m", "I’m from Mexico."], ["you are → you’re", "You’re English."], ["he is → he’s", "He’s my brother."], ["she is → she’s", "She’s my sister."], ["it is → it’s", "It’s my camera."], ["we are → we’re", "We’re from Brazil."], ["they are → they’re", "They’re Russian."]]}]}, {"title": "Be: dạng phủ định", "blocks": [{"type": "text", "text": "Đặt not sau am/is/are để nói “không”. I am not rút gọn thành I’m not; are not thành aren’t; is not thành isn’t."}, {"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["I am not → I’m not", "I’m not Italian."], ["you are not → you aren’t", "You aren’t Chinese."], ["he is not → he isn’t", "He isn’t my teacher."], ["she is not → she isn’t", "She isn’t Spanish."], ["it is not → it isn’t", "It isn’t your book."], ["we are not → we aren’t", "We aren’t Italian."], ["they are not → they aren’t", "They aren’t English."]]}]}]}, {"unit": 2, "title": "Sở hữu và câu hỏi với be", "english": "Determiners; possessive ’s; be questions and short answers", "source_page": "138", "sections": [{"title": "Our và their", "blocks": [{"type": "text", "text": "Our chỉ sự sở hữu của “chúng tôi/chúng ta”; their chỉ sự sở hữu của “họ”. Hai từ này đứng trước danh từ."}, {"type": "table", "rows": [["Chủ ngữ", "Từ sở hữu", "Ví dụ"], ["we", "our", "Our mum is funny."], ["they", "their", "Is that their dog?"]]}]}, {"title": "Sở hữu cách ’s", "blocks": [{"type": "text", "text": "Đặt ’s sau tên hoặc danh từ chỉ người sở hữu, rồi thêm vật/người có quan hệ với người đó. Với hai người cùng sở hữu, ’s đặt sau tên người thứ hai trong mẫu dưới đây."}, {"type": "example", "text": "This is my mum’s cat. It is her cat."}, {"type": "meaning", "text": "Lỗi cần tránh: This is the cat of my mum."}, {"type": "example", "text": "This is Jake and Nat’s dog. It is their dog."}, {"type": "meaning", "text": "Lỗi cần tránh: This is the dog of Jake and Nat."}]}, {"title": "Câu hỏi và trả lời ngắn với be", "blocks": [{"type": "formula", "text": "Am/Is/Are + chủ ngữ + ...?"}, {"type": "text", "text": "Đưa be lên trước chủ ngữ. Trả lời ngắn bằng Yes/No + đại từ chủ ngữ + dạng be phù hợp; chú ý đổi I ↔ you khi hỏi và đáp."}, {"type": "table", "rows": [["Câu hỏi", "Đồng ý", "Phủ định"], ["Am I funny?", "Yes, you are.", "No, you aren’t."], ["Are you English?", "Yes, I am.", "No, I’m not."], ["Is he tired?", "Yes, he is.", "No, he isn’t."], ["Is she Spanish?", "Yes, she is.", "No, she isn’t."], ["Is it hot?", "Yes, it is.", "No, it isn’t."], ["Are we happy?", "Yes, we are.", "No, we aren’t."], ["Are they your parents?", "Yes, they are.", "No, they aren’t."]]}]}, {"title": "Trật tự câu hỏi có từ để hỏi", "blocks": [{"type": "text", "text": "Từ/cụm từ để hỏi đứng trước be; be vẫn đứng trước chủ ngữ."}, {"type": "example", "text": "How old is he?"}, {"type": "meaning", "text": "Lỗi cần tránh: How old he is?"}, {"type": "example", "text": "Where are you from?"}, {"type": "meaning", "text": "Lỗi cần tránh: Where you are from?"}]}]}, {"unit": 3, "title": "There is/are, in/on và have got", "english": "There is/there are; in/on; have got", "source_page": "139", "sections": [{"title": "There is và there are: có", "blocks": [{"type": "text", "text": "Dùng there is (there’s) để nói có một người/vật; dùng there are với danh từ số nhiều. Cấu trúc giúp giới thiệu sự có mặt của người/vật ở một nơi."}, {"type": "example", "text": "There’s a TV in the living room."}, {"type": "example", "text": "There’s a picture on the wall."}, {"type": "example", "text": "There’s a shower in the bathroom."}, {"type": "example", "text": "There are two tables in the kitchen."}, {"type": "example", "text": "There are three people in the dining room."}, {"type": "example", "text": "There are two beds in the bedroom."}]}, {"title": "In và on: vị trí", "blocks": [{"type": "text", "text": "In chỉ ở trong một không gian; on chỉ ở trên bề mặt."}, {"type": "example", "text": "Dad’s in the bathroom."}, {"type": "example", "text": "I live in a house."}, {"type": "example", "text": "The camera is on the floor."}, {"type": "example", "text": "There’s a dictionary on my desk."}]}, {"title": "Have got: sở hữu", "blocks": [{"type": "text", "text": "Have got có nghĩa là “có”. Dùng has got với he/she/it; dùng have got với I/you/we/they. ’s got là has got trong cấu trúc này."}, {"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["I have got → I’ve got", "I’ve got a phone."], ["you have got → you’ve got", "You’ve got a guitar."], ["he has got → he’s got", "He’s got two pet fish."], ["she has got → she’s got", "She’s got a nice flat."], ["it has got → it’s got", "It’s got a big living room."], ["we have got → we’ve got", "We’ve got lots of board games."], ["they have got → they’ve got", "They’ve got a TV in their bedroom."]]}]}]}, {"unit": 4, "title": "Have got: phủ định và câu hỏi", "english": "Have got negatives and questions", "source_page": "140", "sections": [{"title": "Phủ định, câu hỏi, trả lời ngắn", "blocks": [{"type": "text", "text": "Phủ định: thêm not sau have/has. Câu hỏi: đưa have/has ra trước chủ ngữ, giữ got ở sau chủ ngữ. Trả lời ngắn chỉ dùng have/has, không lặp got."}, {"type": "table", "rows": [["Phủ định", "Câu hỏi", "Trả lời ngắn"], ["I haven’t got", "Have I got?", "Yes, you have. / No, you haven’t."], ["You haven’t got", "Have you got?", "Yes, I have. / No, I haven’t."], ["He hasn’t got", "Has he got?", "Yes, he has. / No, he hasn’t."], ["She hasn’t got", "Has she got?", "Yes, she has. / No, she hasn’t."], ["It hasn’t got", "Has it got?", "Yes, it has. / No, it hasn’t."], ["We haven’t got", "Have we got?", "Yes, we have. / No, we haven’t."], ["They haven’t got", "Have they got?", "Yes, they have. / No, they haven’t."]]}]}, {"title": "Ví dụ trong câu đầy đủ", "blocks": [{"type": "example", "text": "I haven’t got a football. He hasn’t got a scarf."}, {"type": "example", "text": "We haven’t got any chocolate."}, {"type": "example", "text": "‘Has she got a new water bottle?’ ‘Yes, she has.’"}]}]}, {"unit": 5, "title": "Khả năng với can và giới từ vị trí", "english": "Can/can’t; in, on, behind, under", "source_page": "141–142", "sections": [{"title": "Can và can’t: có thể/không thể làm gì", "blocks": [{"type": "text", "text": "Dùng can/can’t + động từ nguyên mẫu để diễn tả khả năng. Can không thay đổi theo chủ ngữ; động từ sau can không thêm -s."}, {"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I can play the guitar.", "I can’t speak Italian."], ["You can play the guitar.", "You can’t speak Italian."], ["He can play the guitar.", "He can’t speak Italian."], ["She can play the guitar.", "She can’t speak Italian."], ["It can play the guitar.", "It can’t speak Italian."], ["We can play the guitar.", "We can’t speak Italian."], ["They can play the guitar.", "They can’t speak Italian."]]}]}, {"title": "Câu hỏi với can", "blocks": [{"type": "formula", "text": "Can + chủ ngữ + động từ nguyên mẫu ...?"}, {"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Can I ride a horse?", "Yes, you can. / No, you can’t."], ["Can you ride a horse?", "Yes, I can. / No, I can’t."], ["Can he ride a horse?", "Yes, he can. / No, he can’t."], ["Can she ride a horse?", "Yes, she can. / No, she can’t."], ["Can it ride a horse?", "Yes, it can. / No, it can’t."], ["Can we ride a horse?", "Yes, we can. / No, we can’t."], ["Can they ride a horse?", "Yes, they can. / No, they can’t."]]}]}, {"title": "In, on, behind, under", "blocks": [{"type": "text", "text": "In: trong; on: trên bề mặt; behind: phía sau; under: bên dưới. Đặt giới từ trước người/vật dùng làm mốc vị trí."}, {"type": "example", "text": "We’re in the classroom now."}, {"type": "example", "text": "Your phone’s on the table."}, {"type": "example", "text": "Where’s Dan? I can’t see him. He’s behind the wall."}, {"type": "example", "text": "Your pencil is under the book."}]}]}, {"unit": 6, "title": "Lượng từ và giới từ ngày, nơi, giờ", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "source_page": "143", "sections": [{"title": "Danh từ đếm được và không đếm được", "blocks": [{"type": "text", "text": "Danh từ đếm được có thể đếm từng đơn vị, như cakes, apples, bananas. Danh từ không đếm được như milk, water, bread được xem như một lượng. Some, any và lots of dùng được với cả hai nhóm theo bảng dưới đây."}]}, {"title": "Some: một ít/một số", "blocks": [{"type": "text", "text": "Dùng some trong câu khẳng định và khi mời người khác dùng đồ ăn, đồ uống."}, {"type": "table", "rows": [["Cách dùng", "Đếm được số nhiều", "Không đếm được"], ["Khẳng định", "We made some cakes.", "There is some milk in the kitchen."], ["Lời mời", "Would you like some apples?", "Would you like some water?"]]}]}, {"title": "Any: trong phủ định và câu hỏi", "blocks": [{"type": "table", "rows": [["Cách dùng", "Đếm được số nhiều", "Không đếm được"], ["Phủ định", "We didn’t make any cakes.", "There isn’t any milk in the kitchen."], ["Câu hỏi", "Are there any bananas?", "Is there any milk in the kitchen?"]]}]}, {"title": "Lots of: nhiều", "blocks": [{"type": "text", "text": "Dùng lots of trong câu khẳng định để nói có nhiều người/vật hoặc một lượng lớn."}, {"type": "example", "text": "We’ve got lots of apples."}, {"type": "example", "text": "There’s lots of bread."}]}, {"title": "On, at, from, until", "blocks": [{"type": "table", "rows": [["Giới từ", "Cách dùng", "Cụm từ"], ["on", "Thứ và ngày tháng", "on Monday; on Saturday; on 12th March"], ["at", "Địa điểm", "at my house; at the park; at our school"], ["from", "Thời điểm bắt đầu", "from 9 o’clock"], ["until", "Thời điểm kết thúc", "until half past three"]]}]}]}, {"unit": 7, "title": "Hiện tại đơn: khẳng định và phủ định", "english": "Present simple", "source_page": "144", "sections": [{"title": "Cấu trúc hiện tại đơn", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn để nói về việc làm thường xuyên, thói quen. Với he/she/it, động từ khẳng định thêm -s/-es; trong phủ định dùng doesn’t + động từ nguyên mẫu. Với I/you/we/they, dùng động từ nguyên mẫu hoặc don’t + động từ nguyên mẫu."}, {"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I work.", "I don’t work."], ["You work.", "You don’t work."], ["He works.", "He doesn’t work."], ["She works.", "She doesn’t work."], ["It works.", "It doesn’t work."], ["We work.", "We don’t work."], ["They work.", "They don’t work."]]}]}, {"title": "Ví dụ", "blocks": [{"type": "example", "text": "They work all day."}, {"type": "example", "text": "She catches the bus to school."}, {"type": "example", "text": "They walk to school on Tuesdays."}, {"type": "example", "text": "He doesn’t get up at 7 o’clock every day."}]}]}, {"unit": 8, "title": "Hiện tại đơn: câu hỏi và từ để hỏi", "english": "Present simple: questions and short answers; Wh- questions", "source_page": "145", "sections": [{"title": "Do/Does và trả lời ngắn", "blocks": [{"type": "text", "text": "Đưa do/does lên trước chủ ngữ, dùng động từ nguyên mẫu. Does đi với he/she/it hoặc một người/vật số ít. Trả lời ngắn dùng do/does, không lặp động từ chính."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Do I walk to school?", "Yes, you do. / No, you don’t."], ["Do you use IT in English lessons?", "Yes, I do. / No, I don’t."], ["Does he like maths?", "Yes, he does. / No, he doesn’t."], ["Does she go to school on Saturdays?", "Yes, she does. / No, she doesn’t."], ["Does the house have a shower?", "Yes, it does. / No, it doesn’t."], ["Do we have history on Wednesdays?", "Yes, we do. / No, we don’t."], ["Do they speak Turkish?", "Yes, they do. / No, they don’t."]]}]}, {"title": "Các từ để hỏi", "blocks": [{"type": "table", "rows": [["Từ hỏi", "Hỏi về", "Ví dụ trả lời"], ["Who?", "Người", "Ruby, my sister"], ["What?", "Vật/sự việc", "a computer, a bag, lessons"], ["Where?", "Nơi chốn", "New York, England, the park, school"], ["When?", "Thời điểm/ngày", "Sunday, 5 o’clock, now"], ["How often?", "Tần suất theo ngày/tuần", "every Tuesday, sometimes"], ["Why?", "Lý do", "because it’s new"]]}]}]}, {"unit": 9, "title": "Like và đại từ tân ngữ", "english": "Like; pronouns", "source_page": "146", "sections": [{"title": "Like + động từ -ing", "blocks": [{"type": "text", "text": "Dùng like + động từ -ing để nói thích làm gì; dùng don’t like/doesn’t like để nói không thích. Like cũng có thể đi với danh từ."}, {"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I like dancing.", "I don’t like running."], ["You like dancing.", "You don’t like running."], ["He likes dancing.", "He doesn’t like running."], ["She likes dancing.", "She doesn’t like running."], ["We like dancing.", "We don’t like running."], ["They like dancing.", "They don’t like running."]]}]}, {"title": "Đại từ tân ngữ", "blocks": [{"type": "text", "text": "Đại từ tân ngữ đứng sau động từ hoặc giới từ. Chọn đúng dạng thay vì dùng đại từ chủ ngữ."}, {"type": "table", "rows": [["Chủ ngữ", "Tân ngữ", "Ví dụ"], ["I", "me", "Do you like me?"], ["you", "you", "Bananas are good for you."], ["he", "him", "I don’t like him."], ["she", "her", "This present is for her."], ["it", "it", "We don’t like tennis. We aren’t good at it."], ["we", "us", "Can you help us?"], ["they", "them", "They’re very nice. I like them."]]}]}]}, {"unit": 10, "title": "Hiện tại tiếp diễn", "english": "Present continuous", "source_page": "147", "sections": [{"title": "Khẳng định và phủ định", "blocks": [{"type": "text", "text": "Dùng be (am/is/are) + động từ -ing để nói hành động đang diễn ra. Phủ định: thêm not sau be; có thể rút gọn như bảng."}, {"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I’m (am) cooking.", "I’m not (am not) reading."], ["You’re (are) cooking.", "You aren’t (are not) reading."], ["He’s (is) cooking.", "He isn’t (is not) reading."], ["She’s (is) cooking.", "She isn’t (is not) reading."], ["It’s (is) cooking.", "It isn’t (is not) reading."], ["We’re (are) cooking.", "We aren’t (are not) reading."], ["They’re (are) cooking.", "They aren’t (are not) reading."]]}]}, {"title": "Câu hỏi và trả lời ngắn", "blocks": [{"type": "text", "text": "Đưa am/is/are lên trước chủ ngữ; giữ động từ -ing phía sau. Trả lời ngắn bằng be."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Am I sleeping?", "Yes, you are. / No, you aren’t."], ["Are you sleeping?", "Yes, I am. / No, I’m not."], ["Is he sleeping?", "Yes, he is. / No, he isn’t."], ["Is she sleeping?", "Yes, she is. / No, she isn’t."], ["Is it sleeping?", "Yes, it is. / No, it isn’t."], ["Are we sleeping?", "Yes, we are. / No, we aren’t."], ["Are they sleeping?", "Yes, they are. / No, they aren’t."]]}]}, {"title": "Chính tả: thêm -ing", "blocks": [{"type": "table", "rows": [["Mẫu biến đổi", "Ví dụ"], ["read + -ing → reading", "Sam’s reading a book."], ["swim: gấp đôi m rồi thêm -ing → swimming", "Sarah’s swimming in the pool."], ["dance: bỏ -e rồi thêm -ing → dancing", "We’re dancing to the music."]]}]}]}, {"unit": 11, "title": "Trạng từ tần suất và hỏi số lượng", "english": "Adverbs of frequency; how much/how many", "source_page": "148", "sections": [{"title": "Always, often, sometimes, never", "blocks": [{"type": "text", "text": "Mức độ thường xuyên giảm dần: always (luôn luôn) → often (thường/hay) → sometimes (đôi khi) → never (không bao giờ)."}, {"type": "text", "text": "Những trạng từ này thường đứng trước động từ chính, nhưng đứng sau động từ be."}, {"type": "example", "text": "You always take your phone to school."}, {"type": "example", "text": "Lucy often does her homework in bed."}, {"type": "example", "text": "I am sometimes sad on Sunday evenings."}, {"type": "example", "text": "We are never hungry after breakfast."}]}, {"title": "How many và how much", "blocks": [{"type": "text", "text": "Dùng how many + danh từ đếm được số nhiều để hỏi số lượng; dùng how much + danh từ không đếm được để hỏi một lượng bao nhiêu."}, {"type": "example", "text": "How many texts do you send a week?"}, {"type": "example", "text": "How much fruit do you eat a day?"}, {"type": "example", "text": "How many people are there in the classroom? There are 25."}, {"type": "example", "text": "How much money have you got? I’ve got £5."}]}]}, {"unit": 12, "title": "Phân biệt hai thì hiện tại; nhờ vả và xin phép", "english": "Present simple and present continuous; can: requests and permission", "source_page": "149", "sections": [{"title": "Hiện tại đơn: việc hằng ngày và thói quen", "blocks": [{"type": "meaning", "text": "Xem hiện tại đơn: Unit 7–8, trang 144–145; hiện tại tiếp diễn: Unit 10, trang 147."}, {"type": "text", "text": "Dùng hiện tại đơn cho việc chúng ta làm mỗi ngày hoặc luôn luôn/thường/đôi khi/không bao giờ làm."}, {"type": "example", "text": "I go to school. My dad drives a taxi."}, {"type": "example", "text": "You always get up late on Sundays."}, {"type": "example", "text": "Katie sometimes has dinner at 6 o’clock."}]}, {"title": "Hiện tại tiếp diễn: đang xảy ra", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn cho việc đang làm ngay bây giờ. Phân biệt thời điểm hành động đang diễn ra với thói quen lặp lại."}, {"type": "example", "text": "Jess is sleeping. We’re studying English."}]}, {"title": "Can: nhờ vả và xin phép", "blocks": [{"type": "text", "text": "Dùng Can I ...? để xin được nhận/làm điều gì; dùng Can you ...? để nhờ người khác làm điều gì. Please giúp lời nhờ vả lịch sự hơn."}, {"type": "table", "rows": [["Mục đích", "Ví dụ"], ["Yêu cầu được nhận đồ uống", "Can I have some milk, please?"], ["Nhờ người khác làm việc gì", "Can you open the window, please?"], ["Xin phép", "Can I go out with my friends, Mum?"]]}]}]}, {"unit": 13, "title": "Hỏi về sự có mặt và giới từ vị trí", "english": "Is there a ...?/Are there any ...?; inside, outside, above, below, near", "source_page": "150", "sections": [{"title": "Is there ...? và Are there ...?", "blocks": [{"type": "text", "text": "Dùng Is there a + danh từ đếm được số ít ...? và Are there any + danh từ đếm được số nhiều ...? để hỏi có người/vật ở nơi nào không."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Is there a bank here?", "Yes, there is. / No, there isn’t."], ["Are there any people outside?", "Yes, there are. / No, there aren’t."]]}]}, {"title": "Inside, outside, above, below, near", "blocks": [{"type": "table", "rows": [["Giới từ", "Nghĩa và quan hệ vị trí"], ["inside", "Ở bên trong một không gian/vật"], ["outside", "Ở bên ngoài"], ["above", "Ở cao hơn, phía trên"], ["below", "Ở thấp hơn, phía dưới"], ["near", "Ở gần"]]}]}]}, {"unit": 14, "title": "Từ nối và lời đề nghị", "english": "Because, and, but, or; let’s, shall we?", "source_page": "151", "sections": [{"title": "Because, and, but, or", "blocks": [{"type": "table", "rows": [["Từ nối", "Chức năng"], ["because (bởi vì)", "Đưa ra lý do"], ["and (và)", "Bổ sung ý tưởng hoặc thông tin"], ["but (nhưng)", "Đưa ra ý khác hoặc trái ngược"], ["or (hoặc)", "Đưa ra một lựa chọn khác có thể xảy ra"]]}]}, {"title": "Let’s ... và Shall we ...?", "blocks": [{"type": "text", "text": "Dùng Let’s + động từ nguyên mẫu hoặc Shall we + động từ nguyên mẫu ...? để đề nghị cùng làm việc gì."}, {"type": "example", "text": "Let’s have a party."}, {"type": "example", "text": "Let’s have a pizza for dinner."}, {"type": "example", "text": "Shall we go to the museum this weekend?"}, {"type": "example", "text": "Shall we watch a film later?"}]}, {"title": "Đáp lại lời đề nghị", "blocks": [{"type": "table", "rows": [["Đồng ý", "Từ chối"], ["I’d love to.", "Sorry, I can’t."], ["Yes, that’s a great idea.", " "], ["Yes, I’d like that.", " "]]}]}]}, {"unit": 15, "title": "Danh từ số nhiều và miêu tả người", "english": "Plurals: spelling; describing people", "source_page": "152", "sections": [{"title": "Cách viết dạng số nhiều", "blocks": [{"type": "table", "rows": [["Quy tắc/nhóm từ", "Ví dụ"], ["Luôn ở dạng số nhiều", "clothes, jeans, glasses, trousers"], ["Thêm -s", "house → houses; skirt → skirts; cinema → cinemas"], ["Thêm -es", "bus → buses; box → boxes; watch → watches"], ["Đổi -y thành -ies trong các mẫu này", "baby → babies; dictionary → dictionaries"]]}]}, {"title": "Miêu tả ngoại hình và trang phục", "blocks": [{"type": "text", "text": "Dùng has got cho đặc điểm như tóc, mắt; dùng be + tính từ cho tuổi/vóc dáng; dùng be wearing cho quần áo đang mặc."}, {"type": "table", "rows": [["Cấu trúc", "Ví dụ"], ["’s (has) got ...", "She’s got short hair. He’s got blue eyes."], ["’s (is)/’re (are) ...", "Pam’s young. They’re short."], ["’s (is)/are wearing ...", "Dan’s wearing a jacket and trousers. Evie and Megan are wearing hats."]]}]}]}, {"unit": 16, "title": "Need, want và too", "english": "Need, want; too", "source_page": "153", "sections": [{"title": "Need và want với danh từ hoặc động từ", "blocks": [{"type": "text", "text": "Need có nghĩa là “cần”; want có nghĩa là “muốn”. Có thể theo sau bằng danh từ. Khi theo sau bằng động từ, luôn dùng to + động từ nguyên mẫu trong cấu trúc của bài."}, {"type": "table", "rows": [["Từ", "Theo sau bằng động từ", "Theo sau bằng danh từ"], ["need", "Jo is hungry. He needs to buy some food.", "He needs some food."], ["want", "The children want to have an ice cream.", "The children want an ice cream."]]}, {"type": "example", "text": "We need to learn more."}, {"type": "example", "text": "Julia wants to go to the cinema."}]}, {"title": "Too + tính từ", "blocks": [{"type": "text", "text": "Too + tính từ diễn tả mức độ “quá ...”, gây vấn đề hoặc khiến một việc không thực hiện được; không chỉ mang nghĩa “rất”."}, {"type": "table", "rows": [["Cụm từ", "Ví dụ"], ["too hot", "It’s too hot. I need to open a window."], ["too expensive", "She can’t buy the T-shirt. It’s too expensive."], ["too hard", "We can’t finish the test. It’s too hard."]]}]}]}, {"unit": 17, "title": "So sánh hơn với tính từ", "english": "Comparatives: short and long adjectives", "source_page": "154", "sections": [{"title": "Tính từ ngắn", "blocks": [{"type": "text", "text": "Dùng dạng so sánh hơn + than để so sánh hai người/vật. Thêm -er; tận cùng -e chỉ thêm -r; một số từ gấp đôi phụ âm cuối; với mẫu happy, đổi y thành i rồi thêm -er."}, {"type": "table", "rows": [["Tính từ → so sánh hơn", "Ví dụ"], ["tall → taller", "Danny is taller than me."], ["safe → safer", "The beach is safer than the sea."], ["hot → hotter", "Italy is hotter than England."], ["happy → happier", "Liz is happier than her sister."]]}]}, {"title": "Tính từ dài", "blocks": [{"type": "formula", "text": "more + tính từ + than"}, {"type": "example", "text": "Maths is more interesting than geography."}]}]}, {"unit": 18, "title": "Đại từ it và with/for/until", "english": "It; prepositions: with, for, until", "source_page": "155", "sections": [{"title": "Các cách dùng it", "blocks": [{"type": "table", "rows": [["Vai trò", "Ví dụ"], ["Nói về thời tiết", "It’s sunny."], ["Đại từ tân ngữ thay cho vật đã nhắc", "That’s my pen but you can use it."], ["Đại từ chủ ngữ thay cho việc/vật đã nhắc", "I can’t do this test. It’s too difficult."]]}, {"type": "text", "text": "It’s trong các ví dụ trên là it is; khi it làm tân ngữ, không thêm ’s."}]}, {"title": "With, for, until", "blocks": [{"type": "text", "text": "With chỉ người đi cùng; for + khoảng thời gian cho biết kéo dài bao lâu; until + mốc thời gian cho biết kéo dài đến lúc nào."}, {"type": "example", "text": "I’m on holiday with Abby."}, {"type": "example", "text": "We’re staying here for three days."}, {"type": "example", "text": "We’re here until Friday."}]}]}, {"unit": 19, "title": "Quá khứ của be và câu hỏi Wh-", "english": "Past simple: be; Wh- questions in the present and past", "source_page": "156", "sections": [{"title": "Was và were", "blocks": [{"type": "text", "text": "Dùng was/were để nói về quá khứ. I/he/she/it đi với was; we/you/they đi với were. Thêm not để phủ định; đưa was/were lên trước chủ ngữ để hỏi."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I / He / She / It", "was happy.", "wasn’t happy."], ["We / You / They", "were excited.", "weren’t excited."], ["Câu hỏi", "Đồng ý", "Phủ định"], ["Was I/he/she/it friendly?", "Yes, I/he/she/it was.", "No, I/he/she/it wasn’t."], ["Were we/you/they late?", "Yes, we/you/they were.", "No, we/you/they weren’t."]]}, {"type": "example", "text": "I was late home and my dinner was cold."}, {"type": "example", "text": "My mum wasn’t very happy."}, {"type": "example", "text": "Jane and Isaac weren’t at home last night. They were at a concert."}, {"type": "meaning", "text": "Dấu / phân cách những chủ ngữ lựa chọn; trong câu thực tế chọn một chủ ngữ phù hợp, đổi đại từ khi cần."}]}, {"title": "Câu hỏi Wh- ở hiện tại và quá khứ", "blocks": [{"type": "table", "rows": [["Từ hỏi", "Ví dụ"], ["Who? (ai)", "Who is your best friend?"], ["What? (gì)", "What was your first word?"], ["When? (khi nào)", "When was Freya’s birthday?"], ["Where? (ở đâu)", "Where were you last week?"], ["Why? (tại sao)", "Why were you sad yesterday?"], ["What kind of? (loại gì)", "What kind of music do you like?"], ["How? (như thế nào)", "How are you?"]]}]}, {"title": "Trả lời đúng thông tin được hỏi", "blocks": [{"type": "text", "text": "Không thể chỉ dùng Yes/No để trả lời câu hỏi Wh-. Cần cung cấp thông tin mà từ để hỏi yêu cầu."}, {"type": "example", "text": "How is your mum? She’s fine, thanks."}, {"type": "meaning", "text": "Lỗi cần tránh khi trả lời câu hỏi trên: Yes, thanks."}]}]}, {"unit": 20, "title": "Quá khứ đơn: động từ có quy tắc", "english": "Past simple", "source_page": "157", "sections": [{"title": "Khẳng định và phủ định", "blocks": [{"type": "text", "text": "Với động từ có quy tắc, tạo quá khứ đơn bằng cách thêm -ed. Dạng quá khứ giống nhau với mọi chủ ngữ. Phủ định dùng didn’t (did not) + động từ nguyên mẫu, không giữ đuôi -ed."}, {"type": "table", "rows": [["Dạng câu", "Cấu trúc"], ["Khẳng định", "I/You/He/She/It/We/They worked."], ["Phủ định", "I/You/He/She/It/We/They didn’t (did not) work."]]}]}, {"title": "Ví dụ", "blocks": [{"type": "example", "text": "Richard lived in Italy until 2013."}, {"type": "example", "text": "Becky worked in a hospital."}, {"type": "example", "text": "We didn’t want to go out because it was raining."}, {"type": "example", "text": "I didn’t walk to school yesterday."}]}]}], "pages": [{"unit": "Starter", "title": "A/an: một người hoặc một vật", "english": "A/an; this, that, these, those", "blocks": [{"type": "text", "text": "Dùng a/an trước danh từ đếm được số ít. A đứng trước âm phụ âm; an đứng trước âm nguyên âm. Chọn theo âm đọc của từ ngay sau mạo từ."}, {"type": "example", "text": "a cake • a picture"}, {"type": "example", "text": "an apple • an orange"}]}, {"unit": "Starter", "title": "This, that, these, those", "english": "A/an; this, that, these, those", "blocks": [{"type": "text", "text": "This và these chỉ người/vật ở gần; that và those chỉ người/vật ở xa hơn. This/that đi với danh từ số ít và is; these/those đi với danh từ số nhiều và are."}, {"type": "example", "text": "This pen is yellow."}, {"type": "example", "text": "These pens are black."}, {"type": "example", "text": "That desk is grey."}, {"type": "example", "text": "Those desks are brown."}]}, {"unit": 1, "title": "My, your, his, her", "english": "Determiners; be", "blocks": [{"type": "text", "text": "Từ hạn định sở hữu đứng trước danh từ để cho biết người/vật đó thuộc về ai. Chọn từ theo người sở hữu."}]}, {"unit": 1, "title": "My, your, his, her", "english": "Determiners; be", "blocks": [{"type": "table", "rows": [["Đại từ chủ ngữ", "Từ sở hữu", "Ví dụ"], ["I", "my (của tôi)", "My name is Oliver."], ["you", "your (của bạn)", "This is your phone."], ["he", "his (của anh ấy)", "This is his camera."], ["she", "her (của cô ấy)", "Her name isn’t Rosa."]]}]}, {"unit": 1, "title": "Be: dạng khẳng định", "english": "Determiners; be", "blocks": [{"type": "text", "text": "Be thay đổi theo chủ ngữ: I đi với am; he/she/it đi với is; you/we/they đi với are. Có thể viết dạng đầy đủ hoặc rút gọn như bảng."}]}, {"unit": 1, "title": "Be: dạng khẳng định", "english": "Determiners; be", "blocks": [{"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["I am → I’m", "I’m from Mexico."], ["you are → you’re", "You’re English."], ["he is → he’s", "He’s my brother."], ["she is → she’s", "She’s my sister."], ["it is → it’s", "It’s my camera."]]}]}, {"unit": 1, "title": "Be: dạng khẳng định", "english": "Determiners; be", "blocks": [{"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["we are → we’re", "We’re from Brazil."], ["they are → they’re", "They’re Russian."]]}]}, {"unit": 1, "title": "Be: dạng phủ định", "english": "Determiners; be", "blocks": [{"type": "text", "text": "Đặt not sau am/is/are để nói “không”. I am not rút gọn thành I’m not; are not thành aren’t; is not thành isn’t."}]}, {"unit": 1, "title": "Be: dạng phủ định", "english": "Determiners; be", "blocks": [{"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["I am not → I’m not", "I’m not Italian."], ["you are not → you aren’t", "You aren’t Chinese."], ["he is not → he isn’t", "He isn’t my teacher."], ["she is not → she isn’t", "She isn’t Spanish."], ["it is not → it isn’t", "It isn’t your book."]]}]}, {"unit": 1, "title": "Be: dạng phủ định", "english": "Determiners; be", "blocks": [{"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["we are not → we aren’t", "We aren’t Italian."], ["they are not → they aren’t", "They aren’t English."]]}]}, {"unit": 2, "title": "Our và their", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "text", "text": "Our chỉ sự sở hữu của “chúng tôi/chúng ta”; their chỉ sự sở hữu của “họ”. Hai từ này đứng trước danh từ."}]}, {"unit": 2, "title": "Our và their", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Từ sở hữu", "Ví dụ"], ["we", "our", "Our mum is funny."], ["they", "their", "Is that their dog?"]]}]}, {"unit": 2, "title": "Sở hữu cách ’s", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "text", "text": "Đặt ’s sau tên hoặc danh từ chỉ người sở hữu, rồi thêm vật/người có quan hệ với người đó. Với hai người cùng sở hữu, ’s đặt sau tên người thứ hai trong mẫu dưới đây."}, {"type": "example", "text": "This is my mum’s cat. It is her cat."}, {"type": "meaning", "text": "Lỗi cần tránh: This is the cat of my mum."}, {"type": "example", "text": "This is Jake and Nat’s dog. It is their dog."}, {"type": "meaning", "text": "Lỗi cần tránh: This is the dog of Jake and Nat."}]}, {"unit": 2, "title": "Câu hỏi và trả lời ngắn với be", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "formula", "text": "Am/Is/Are + chủ ngữ + ...?"}, {"type": "text", "text": "Đưa be lên trước chủ ngữ. Trả lời ngắn bằng Yes/No + đại từ chủ ngữ + dạng be phù hợp; chú ý đổi I ↔ you khi hỏi và đáp."}]}, {"unit": 2, "title": "Câu hỏi và trả lời ngắn với be", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Đồng ý", "Phủ định"], ["Am I funny?", "Yes, you are.", "No, you aren’t."], ["Are you English?", "Yes, I am.", "No, I’m not."], ["Is he tired?", "Yes, he is.", "No, he isn’t."], ["Is she Spanish?", "Yes, she is.", "No, she isn’t."], ["Is it hot?", "Yes, it is.", "No, it isn’t."]]}]}, {"unit": 2, "title": "Câu hỏi và trả lời ngắn với be", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Đồng ý", "Phủ định"], ["Are we happy?", "Yes, we are.", "No, we aren’t."], ["Are they your parents?", "Yes, they are.", "No, they aren’t."]]}]}, {"unit": 2, "title": "Trật tự câu hỏi có từ để hỏi", "english": "Determiners; possessive ’s; be questions and short answers", "blocks": [{"type": "text", "text": "Từ/cụm từ để hỏi đứng trước be; be vẫn đứng trước chủ ngữ."}, {"type": "example", "text": "How old is he?"}, {"type": "meaning", "text": "Lỗi cần tránh: How old he is?"}, {"type": "example", "text": "Where are you from?"}, {"type": "meaning", "text": "Lỗi cần tránh: Where you are from?"}]}, {"unit": 3, "title": "There is và there are: có", "english": "There is/there are; in/on; have got", "blocks": [{"type": "text", "text": "Dùng there is (there’s) để nói có một người/vật; dùng there are với danh từ số nhiều. Cấu trúc giúp giới thiệu sự có mặt của người/vật ở một nơi."}, {"type": "example", "text": "There’s a TV in the living room."}, {"type": "example", "text": "There’s a picture on the wall."}, {"type": "example", "text": "There’s a shower in the bathroom."}, {"type": "example", "text": "There are two tables in the kitchen."}]}, {"unit": 3, "title": "There is và there are: có", "english": "There is/there are; in/on; have got", "blocks": [{"type": "example", "text": "There are three people in the dining room."}, {"type": "example", "text": "There are two beds in the bedroom."}]}, {"unit": 3, "title": "In và on: vị trí", "english": "There is/there are; in/on; have got", "blocks": [{"type": "text", "text": "In chỉ ở trong một không gian; on chỉ ở trên bề mặt."}, {"type": "example", "text": "Dad’s in the bathroom."}, {"type": "example", "text": "I live in a house."}, {"type": "example", "text": "The camera is on the floor."}, {"type": "example", "text": "There’s a dictionary on my desk."}]}, {"unit": 3, "title": "Have got: sở hữu", "english": "There is/there are; in/on; have got", "blocks": [{"type": "text", "text": "Have got có nghĩa là “có”. Dùng has got với he/she/it; dùng have got với I/you/we/they. ’s got là has got trong cấu trúc này."}]}, {"unit": 3, "title": "Have got: sở hữu", "english": "There is/there are; in/on; have got", "blocks": [{"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["I have got → I’ve got", "I’ve got a phone."], ["you have got → you’ve got", "You’ve got a guitar."], ["he has got → he’s got", "He’s got two pet fish."], ["she has got → she’s got", "She’s got a nice flat."], ["it has got → it’s got", "It’s got a big living room."]]}]}, {"unit": 3, "title": "Have got: sở hữu", "english": "There is/there are; in/on; have got", "blocks": [{"type": "table", "rows": [["Dạng đầy đủ → rút gọn", "Ví dụ"], ["we have got → we’ve got", "We’ve got lots of board games."], ["they have got → they’ve got", "They’ve got a TV in their bedroom."]]}]}, {"unit": 4, "title": "Phủ định, câu hỏi, trả lời ngắn", "english": "Have got negatives and questions", "blocks": [{"type": "text", "text": "Phủ định: thêm not sau have/has. Câu hỏi: đưa have/has ra trước chủ ngữ, giữ got ở sau chủ ngữ. Trả lời ngắn chỉ dùng have/has, không lặp got."}]}, {"unit": 4, "title": "Phủ định, câu hỏi, trả lời ngắn", "english": "Have got negatives and questions", "blocks": [{"type": "table", "rows": [["Phủ định", "Câu hỏi", "Trả lời ngắn"], ["I haven’t got", "Have I got?", "Yes, you have. / No, you haven’t."], ["You haven’t got", "Have you got?", "Yes, I have. / No, I haven’t."], ["He hasn’t got", "Has he got?", "Yes, he has. / No, he hasn’t."], ["She hasn’t got", "Has she got?", "Yes, she has. / No, she hasn’t."], ["It hasn’t got", "Has it got?", "Yes, it has. / No, it hasn’t."]]}]}, {"unit": 4, "title": "Phủ định, câu hỏi, trả lời ngắn", "english": "Have got negatives and questions", "blocks": [{"type": "table", "rows": [["Phủ định", "Câu hỏi", "Trả lời ngắn"], ["We haven’t got", "Have we got?", "Yes, we have. / No, we haven’t."], ["They haven’t got", "Have they got?", "Yes, they have. / No, they haven’t."]]}]}, {"unit": 4, "title": "Ví dụ trong câu đầy đủ", "english": "Have got negatives and questions", "blocks": [{"type": "example", "text": "I haven’t got a football. He hasn’t got a scarf."}, {"type": "example", "text": "We haven’t got any chocolate."}, {"type": "example", "text": "‘Has she got a new water bottle?’ ‘Yes, she has.’"}]}, {"unit": 5, "title": "Can và can’t: có thể/không thể làm gì", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "text", "text": "Dùng can/can’t + động từ nguyên mẫu để diễn tả khả năng. Can không thay đổi theo chủ ngữ; động từ sau can không thêm -s."}]}, {"unit": 5, "title": "Can và can’t: có thể/không thể làm gì", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I can play the guitar.", "I can’t speak Italian."], ["You can play the guitar.", "You can’t speak Italian."], ["He can play the guitar.", "He can’t speak Italian."], ["She can play the guitar.", "She can’t speak Italian."], ["It can play the guitar.", "It can’t speak Italian."]]}]}, {"unit": 5, "title": "Can và can’t: có thể/không thể làm gì", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["We can play the guitar.", "We can’t speak Italian."], ["They can play the guitar.", "They can’t speak Italian."]]}]}, {"unit": 5, "title": "Câu hỏi với can", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "formula", "text": "Can + chủ ngữ + động từ nguyên mẫu ...?"}]}, {"unit": 5, "title": "Câu hỏi với can", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Can I ride a horse?", "Yes, you can. / No, you can’t."], ["Can you ride a horse?", "Yes, I can. / No, I can’t."], ["Can he ride a horse?", "Yes, he can. / No, he can’t."], ["Can she ride a horse?", "Yes, she can. / No, she can’t."], ["Can it ride a horse?", "Yes, it can. / No, it can’t."]]}]}, {"unit": 5, "title": "Câu hỏi với can", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Can we ride a horse?", "Yes, we can. / No, we can’t."], ["Can they ride a horse?", "Yes, they can. / No, they can’t."]]}]}, {"unit": 5, "title": "In, on, behind, under", "english": "Can/can’t; in, on, behind, under", "blocks": [{"type": "text", "text": "In: trong; on: trên bề mặt; behind: phía sau; under: bên dưới. Đặt giới từ trước người/vật dùng làm mốc vị trí."}, {"type": "example", "text": "We’re in the classroom now."}, {"type": "example", "text": "Your phone’s on the table."}, {"type": "example", "text": "Where’s Dan? I can’t see him. He’s behind the wall."}, {"type": "example", "text": "Your pencil is under the book."}]}, {"unit": 6, "title": "Danh từ đếm được và không đếm được", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "blocks": [{"type": "text", "text": "Danh từ đếm được có thể đếm từng đơn vị, như cakes, apples, bananas. Danh từ không đếm được như milk, water, bread được xem như một lượng. Some, any và lots of dùng được với cả hai nhóm theo bảng dưới đây."}]}, {"unit": 6, "title": "Some: một ít/một số", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "blocks": [{"type": "text", "text": "Dùng some trong câu khẳng định và khi mời người khác dùng đồ ăn, đồ uống."}]}, {"unit": 6, "title": "Some: một ít/một số", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "blocks": [{"type": "table", "rows": [["Cách dùng", "Đếm được số nhiều", "Không đếm được"], ["Khẳng định", "We made some cakes.", "There is some milk in the kitchen."], ["Lời mời", "Would you like some apples?", "Would you like some water?"]]}]}, {"unit": 6, "title": "Any: trong phủ định và câu hỏi", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "blocks": [{"type": "table", "rows": [["Cách dùng", "Đếm được số nhiều", "Không đếm được"], ["Phủ định", "We didn’t make any cakes.", "There isn’t any milk in the kitchen."], ["Câu hỏi", "Are there any bananas?", "Is there any milk in the kitchen?"]]}]}, {"unit": 6, "title": "Lots of: nhiều", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "blocks": [{"type": "text", "text": "Dùng lots of trong câu khẳng định để nói có nhiều người/vật hoặc một lượng lớn."}, {"type": "example", "text": "We’ve got lots of apples."}, {"type": "example", "text": "There’s lots of bread."}]}, {"unit": 6, "title": "On, at, from, until", "english": "Some, any, lots of; countable and uncountable nouns; on, at, from, until", "blocks": [{"type": "table", "rows": [["Giới từ", "Cách dùng", "Cụm từ"], ["on", "Thứ và ngày tháng", "on Monday; on Saturday; on 12th March"], ["at", "Địa điểm", "at my house; at the park; at our school"], ["from", "Thời điểm bắt đầu", "from 9 o’clock"], ["until", "Thời điểm kết thúc", "until half past three"]]}]}, {"unit": 7, "title": "Cấu trúc hiện tại đơn", "english": "Present simple", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn để nói về việc làm thường xuyên, thói quen. Với he/she/it, động từ khẳng định thêm -s/-es; trong phủ định dùng doesn’t + động từ nguyên mẫu. Với I/you/we/they, dùng động từ nguyên mẫu hoặc don’t + động từ nguyên mẫu."}]}, {"unit": 7, "title": "Cấu trúc hiện tại đơn", "english": "Present simple", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I work.", "I don’t work."], ["You work.", "You don’t work."], ["He works.", "He doesn’t work."], ["She works.", "She doesn’t work."], ["It works.", "It doesn’t work."]]}]}, {"unit": 7, "title": "Cấu trúc hiện tại đơn", "english": "Present simple", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["We work.", "We don’t work."], ["They work.", "They don’t work."]]}]}, {"unit": 7, "title": "Ví dụ", "english": "Present simple", "blocks": [{"type": "example", "text": "They work all day."}, {"type": "example", "text": "She catches the bus to school."}, {"type": "example", "text": "They walk to school on Tuesdays."}, {"type": "example", "text": "He doesn’t get up at 7 o’clock every day."}]}, {"unit": 8, "title": "Do/Does và trả lời ngắn", "english": "Present simple: questions and short answers; Wh- questions", "blocks": [{"type": "text", "text": "Đưa do/does lên trước chủ ngữ, dùng động từ nguyên mẫu. Does đi với he/she/it hoặc một người/vật số ít. Trả lời ngắn dùng do/does, không lặp động từ chính."}]}, {"unit": 8, "title": "Do/Does và trả lời ngắn", "english": "Present simple: questions and short answers; Wh- questions", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Do I walk to school?", "Yes, you do. / No, you don’t."], ["Do you use IT in English lessons?", "Yes, I do. / No, I don’t."], ["Does he like maths?", "Yes, he does. / No, he doesn’t."], ["Does she go to school on Saturdays?", "Yes, she does. / No, she doesn’t."], ["Does the house have a shower?", "Yes, it does. / No, it doesn’t."]]}]}, {"unit": 8, "title": "Do/Does và trả lời ngắn", "english": "Present simple: questions and short answers; Wh- questions", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Do we have history on Wednesdays?", "Yes, we do. / No, we don’t."], ["Do they speak Turkish?", "Yes, they do. / No, they don’t."]]}]}, {"unit": 8, "title": "Các từ để hỏi", "english": "Present simple: questions and short answers; Wh- questions", "blocks": [{"type": "table", "rows": [["Từ hỏi", "Hỏi về", "Ví dụ trả lời"], ["Who?", "Người", "Ruby, my sister"], ["What?", "Vật/sự việc", "a computer, a bag, lessons"], ["Where?", "Nơi chốn", "New York, England, the park, school"], ["When?", "Thời điểm/ngày", "Sunday, 5 o’clock, now"], ["How often?", "Tần suất theo ngày/tuần", "every Tuesday, sometimes"]]}]}, {"unit": 8, "title": "Các từ để hỏi", "english": "Present simple: questions and short answers; Wh- questions", "blocks": [{"type": "table", "rows": [["Từ hỏi", "Hỏi về", "Ví dụ trả lời"], ["Why?", "Lý do", "because it’s new"]]}]}, {"unit": 9, "title": "Like + động từ -ing", "english": "Like; pronouns", "blocks": [{"type": "text", "text": "Dùng like + động từ -ing để nói thích làm gì; dùng don’t like/doesn’t like để nói không thích. Like cũng có thể đi với danh từ."}]}, {"unit": 9, "title": "Like + động từ -ing", "english": "Like; pronouns", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I like dancing.", "I don’t like running."], ["You like dancing.", "You don’t like running."], ["He likes dancing.", "He doesn’t like running."], ["She likes dancing.", "She doesn’t like running."], ["We like dancing.", "We don’t like running."]]}]}, {"unit": 9, "title": "Like + động từ -ing", "english": "Like; pronouns", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["They like dancing.", "They don’t like running."]]}]}, {"unit": 9, "title": "Đại từ tân ngữ", "english": "Like; pronouns", "blocks": [{"type": "text", "text": "Đại từ tân ngữ đứng sau động từ hoặc giới từ. Chọn đúng dạng thay vì dùng đại từ chủ ngữ."}]}, {"unit": 9, "title": "Đại từ tân ngữ", "english": "Like; pronouns", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Tân ngữ", "Ví dụ"], ["I", "me", "Do you like me?"], ["you", "you", "Bananas are good for you."], ["he", "him", "I don’t like him."], ["she", "her", "This present is for her."], ["it", "it", "We don’t like tennis. We aren’t good at it."]]}]}, {"unit": 9, "title": "Đại từ tân ngữ", "english": "Like; pronouns", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Tân ngữ", "Ví dụ"], ["we", "us", "Can you help us?"], ["they", "them", "They’re very nice. I like them."]]}]}, {"unit": 10, "title": "Khẳng định và phủ định", "english": "Present continuous", "blocks": [{"type": "text", "text": "Dùng be (am/is/are) + động từ -ing để nói hành động đang diễn ra. Phủ định: thêm not sau be; có thể rút gọn như bảng."}]}, {"unit": 10, "title": "Khẳng định và phủ định", "english": "Present continuous", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["I’m (am) cooking.", "I’m not (am not) reading."], ["You’re (are) cooking.", "You aren’t (are not) reading."], ["He’s (is) cooking.", "He isn’t (is not) reading."], ["She’s (is) cooking.", "She isn’t (is not) reading."], ["It’s (is) cooking.", "It isn’t (is not) reading."]]}]}, {"unit": 10, "title": "Khẳng định và phủ định", "english": "Present continuous", "blocks": [{"type": "table", "rows": [["Khẳng định", "Phủ định"], ["We’re (are) cooking.", "We aren’t (are not) reading."], ["They’re (are) cooking.", "They aren’t (are not) reading."]]}]}, {"unit": 10, "title": "Câu hỏi và trả lời ngắn", "english": "Present continuous", "blocks": [{"type": "text", "text": "Đưa am/is/are lên trước chủ ngữ; giữ động từ -ing phía sau. Trả lời ngắn bằng be."}]}, {"unit": 10, "title": "Câu hỏi và trả lời ngắn", "english": "Present continuous", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Am I sleeping?", "Yes, you are. / No, you aren’t."], ["Are you sleeping?", "Yes, I am. / No, I’m not."], ["Is he sleeping?", "Yes, he is. / No, he isn’t."], ["Is she sleeping?", "Yes, she is. / No, she isn’t."], ["Is it sleeping?", "Yes, it is. / No, it isn’t."]]}]}, {"unit": 10, "title": "Câu hỏi và trả lời ngắn", "english": "Present continuous", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Are we sleeping?", "Yes, we are. / No, we aren’t."], ["Are they sleeping?", "Yes, they are. / No, they aren’t."]]}]}, {"unit": 10, "title": "Chính tả: thêm -ing", "english": "Present continuous", "blocks": [{"type": "table", "rows": [["Mẫu biến đổi", "Ví dụ"], ["read + -ing → reading", "Sam’s reading a book."], ["swim: gấp đôi m rồi thêm -ing → swimming", "Sarah’s swimming in the pool."], ["dance: bỏ -e rồi thêm -ing → dancing", "We’re dancing to the music."]]}]}, {"unit": 11, "title": "Always, often, sometimes, never", "english": "Adverbs of frequency; how much/how many", "blocks": [{"type": "text", "text": "Mức độ thường xuyên giảm dần: always (luôn luôn) → often (thường/hay) → sometimes (đôi khi) → never (không bao giờ)."}, {"type": "text", "text": "Những trạng từ này thường đứng trước động từ chính, nhưng đứng sau động từ be."}, {"type": "example", "text": "You always take your phone to school."}, {"type": "example", "text": "Lucy often does her homework in bed."}, {"type": "example", "text": "I am sometimes sad on Sunday evenings."}]}, {"unit": 11, "title": "Always, often, sometimes, never", "english": "Adverbs of frequency; how much/how many", "blocks": [{"type": "example", "text": "We are never hungry after breakfast."}]}, {"unit": 11, "title": "How many và how much", "english": "Adverbs of frequency; how much/how many", "blocks": [{"type": "text", "text": "Dùng how many + danh từ đếm được số nhiều để hỏi số lượng; dùng how much + danh từ không đếm được để hỏi một lượng bao nhiêu."}, {"type": "example", "text": "How many texts do you send a week?"}, {"type": "example", "text": "How much fruit do you eat a day?"}, {"type": "example", "text": "How many people are there in the classroom? There are 25."}, {"type": "example", "text": "How much money have you got? I’ve got £5."}]}, {"unit": 12, "title": "Hiện tại đơn: việc hằng ngày và thói quen", "english": "Present simple and present continuous; can: requests and permission", "blocks": [{"type": "meaning", "text": "Xem hiện tại đơn: Unit 7–8, trang 144–145; hiện tại tiếp diễn: Unit 10, trang 147."}, {"type": "text", "text": "Dùng hiện tại đơn cho việc chúng ta làm mỗi ngày hoặc luôn luôn/thường/đôi khi/không bao giờ làm."}, {"type": "example", "text": "I go to school. My dad drives a taxi."}, {"type": "example", "text": "You always get up late on Sundays."}, {"type": "example", "text": "Katie sometimes has dinner at 6 o’clock."}]}, {"unit": 12, "title": "Hiện tại tiếp diễn: đang xảy ra", "english": "Present simple and present continuous; can: requests and permission", "blocks": [{"type": "text", "text": "Dùng hiện tại tiếp diễn cho việc đang làm ngay bây giờ. Phân biệt thời điểm hành động đang diễn ra với thói quen lặp lại."}, {"type": "example", "text": "Jess is sleeping. We’re studying English."}]}, {"unit": 12, "title": "Can: nhờ vả và xin phép", "english": "Present simple and present continuous; can: requests and permission", "blocks": [{"type": "text", "text": "Dùng Can I ...? để xin được nhận/làm điều gì; dùng Can you ...? để nhờ người khác làm điều gì. Please giúp lời nhờ vả lịch sự hơn."}]}, {"unit": 12, "title": "Can: nhờ vả và xin phép", "english": "Present simple and present continuous; can: requests and permission", "blocks": [{"type": "table", "rows": [["Mục đích", "Ví dụ"], ["Yêu cầu được nhận đồ uống", "Can I have some milk, please?"], ["Nhờ người khác làm việc gì", "Can you open the window, please?"], ["Xin phép", "Can I go out with my friends, Mum?"]]}]}, {"unit": 13, "title": "Is there ...? và Are there ...?", "english": "Is there a ...?/Are there any ...?; inside, outside, above, below, near", "blocks": [{"type": "text", "text": "Dùng Is there a + danh từ đếm được số ít ...? và Are there any + danh từ đếm được số nhiều ...? để hỏi có người/vật ở nơi nào không."}]}, {"unit": 13, "title": "Is there ...? và Are there ...?", "english": "Is there a ...?/Are there any ...?; inside, outside, above, below, near", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời ngắn"], ["Is there a bank here?", "Yes, there is. / No, there isn’t."], ["Are there any people outside?", "Yes, there are. / No, there aren’t."]]}]}, {"unit": 13, "title": "Inside, outside, above, below, near", "english": "Is there a ...?/Are there any ...?; inside, outside, above, below, near", "blocks": [{"type": "table", "rows": [["Giới từ", "Nghĩa và quan hệ vị trí"], ["inside", "Ở bên trong một không gian/vật"], ["outside", "Ở bên ngoài"], ["above", "Ở cao hơn, phía trên"], ["below", "Ở thấp hơn, phía dưới"], ["near", "Ở gần"]]}]}, {"unit": 14, "title": "Because, and, but, or", "english": "Because, and, but, or; let’s, shall we?", "blocks": [{"type": "table", "rows": [["Từ nối", "Chức năng"], ["because (bởi vì)", "Đưa ra lý do"], ["and (và)", "Bổ sung ý tưởng hoặc thông tin"], ["but (nhưng)", "Đưa ra ý khác hoặc trái ngược"], ["or (hoặc)", "Đưa ra một lựa chọn khác có thể xảy ra"]]}]}, {"unit": 14, "title": "Let’s ... và Shall we ...?", "english": "Because, and, but, or; let’s, shall we?", "blocks": [{"type": "text", "text": "Dùng Let’s + động từ nguyên mẫu hoặc Shall we + động từ nguyên mẫu ...? để đề nghị cùng làm việc gì."}, {"type": "example", "text": "Let’s have a party."}, {"type": "example", "text": "Let’s have a pizza for dinner."}, {"type": "example", "text": "Shall we go to the museum this weekend?"}, {"type": "example", "text": "Shall we watch a film later?"}]}, {"unit": 14, "title": "Đáp lại lời đề nghị", "english": "Because, and, but, or; let’s, shall we?", "blocks": [{"type": "table", "rows": [["Đồng ý", "Từ chối"], ["I’d love to.", "Sorry, I can’t."], ["Yes, that’s a great idea.", " "], ["Yes, I’d like that.", " "]]}]}, {"unit": 15, "title": "Cách viết dạng số nhiều", "english": "Plurals: spelling; describing people", "blocks": [{"type": "table", "rows": [["Quy tắc/nhóm từ", "Ví dụ"], ["Luôn ở dạng số nhiều", "clothes, jeans, glasses, trousers"], ["Thêm -s", "house → houses; skirt → skirts; cinema → cinemas"], ["Thêm -es", "bus → buses; box → boxes; watch → watches"], ["Đổi -y thành -ies trong các mẫu này", "baby → babies; dictionary → dictionaries"]]}]}, {"unit": 15, "title": "Miêu tả ngoại hình và trang phục", "english": "Plurals: spelling; describing people", "blocks": [{"type": "text", "text": "Dùng has got cho đặc điểm như tóc, mắt; dùng be + tính từ cho tuổi/vóc dáng; dùng be wearing cho quần áo đang mặc."}]}, {"unit": 15, "title": "Miêu tả ngoại hình và trang phục", "english": "Plurals: spelling; describing people", "blocks": [{"type": "table", "rows": [["Cấu trúc", "Ví dụ"], ["’s (has) got ...", "She’s got short hair. He’s got blue eyes."], ["’s (is)/’re (are) ...", "Pam’s young. They’re short."], ["’s (is)/are wearing ...", "Dan’s wearing a jacket and trousers. Evie and Megan are wearing hats."]]}]}, {"unit": 16, "title": "Need và want với danh từ hoặc động từ", "english": "Need, want; too", "blocks": [{"type": "text", "text": "Need có nghĩa là “cần”; want có nghĩa là “muốn”. Có thể theo sau bằng danh từ. Khi theo sau bằng động từ, luôn dùng to + động từ nguyên mẫu trong cấu trúc của bài."}]}, {"unit": 16, "title": "Need và want với danh từ hoặc động từ", "english": "Need, want; too", "blocks": [{"type": "table", "rows": [["Từ", "Theo sau bằng động từ", "Theo sau bằng danh từ"], ["need", "Jo is hungry. He needs to buy some food.", "He needs some food."], ["want", "The children want to have an ice cream.", "The children want an ice cream."]]}]}, {"unit": 16, "title": "Need và want với danh từ hoặc động từ", "english": "Need, want; too", "blocks": [{"type": "example", "text": "We need to learn more."}, {"type": "example", "text": "Julia wants to go to the cinema."}]}, {"unit": 16, "title": "Too + tính từ", "english": "Need, want; too", "blocks": [{"type": "text", "text": "Too + tính từ diễn tả mức độ “quá ...”, gây vấn đề hoặc khiến một việc không thực hiện được; không chỉ mang nghĩa “rất”."}]}, {"unit": 16, "title": "Too + tính từ", "english": "Need, want; too", "blocks": [{"type": "table", "rows": [["Cụm từ", "Ví dụ"], ["too hot", "It’s too hot. I need to open a window."], ["too expensive", "She can’t buy the T-shirt. It’s too expensive."], ["too hard", "We can’t finish the test. It’s too hard."]]}]}, {"unit": 17, "title": "Tính từ ngắn", "english": "Comparatives: short and long adjectives", "blocks": [{"type": "text", "text": "Dùng dạng so sánh hơn + than để so sánh hai người/vật. Thêm -er; tận cùng -e chỉ thêm -r; một số từ gấp đôi phụ âm cuối; với mẫu happy, đổi y thành i rồi thêm -er."}]}, {"unit": 17, "title": "Tính từ ngắn", "english": "Comparatives: short and long adjectives", "blocks": [{"type": "table", "rows": [["Tính từ → so sánh hơn", "Ví dụ"], ["tall → taller", "Danny is taller than me."], ["safe → safer", "The beach is safer than the sea."], ["hot → hotter", "Italy is hotter than England."], ["happy → happier", "Liz is happier than her sister."]]}]}, {"unit": 17, "title": "Tính từ dài", "english": "Comparatives: short and long adjectives", "blocks": [{"type": "formula", "text": "more + tính từ + than"}, {"type": "example", "text": "Maths is more interesting than geography."}]}, {"unit": 18, "title": "Các cách dùng it", "english": "It; prepositions: with, for, until", "blocks": [{"type": "table", "rows": [["Vai trò", "Ví dụ"], ["Nói về thời tiết", "It’s sunny."], ["Đại từ tân ngữ thay cho vật đã nhắc", "That’s my pen but you can use it."], ["Đại từ chủ ngữ thay cho việc/vật đã nhắc", "I can’t do this test. It’s too difficult."]]}]}, {"unit": 18, "title": "Các cách dùng it", "english": "It; prepositions: with, for, until", "blocks": [{"type": "text", "text": "It’s trong các ví dụ trên là it is; khi it làm tân ngữ, không thêm ’s."}]}, {"unit": 18, "title": "With, for, until", "english": "It; prepositions: with, for, until", "blocks": [{"type": "text", "text": "With chỉ người đi cùng; for + khoảng thời gian cho biết kéo dài bao lâu; until + mốc thời gian cho biết kéo dài đến lúc nào."}, {"type": "example", "text": "I’m on holiday with Abby."}, {"type": "example", "text": "We’re staying here for three days."}, {"type": "example", "text": "We’re here until Friday."}]}, {"unit": 19, "title": "Was và were", "english": "Past simple: be; Wh- questions in the present and past", "blocks": [{"type": "text", "text": "Dùng was/were để nói về quá khứ. I/he/she/it đi với was; we/you/they đi với were. Thêm not để phủ định; đưa was/were lên trước chủ ngữ để hỏi."}]}, {"unit": 19, "title": "Was và were", "english": "Past simple: be; Wh- questions in the present and past", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định"], ["I / He / She / It", "was happy.", "wasn’t happy."], ["We / You / They", "were excited.", "weren’t excited."], ["Câu hỏi", "Đồng ý", "Phủ định"], ["Was I/he/she/it friendly?", "Yes, I/he/she/it was.", "No, I/he/she/it wasn’t."], ["Were we/you/they late?", "Yes, we/you/they were.", "No, we/you/they weren’t."]]}]}, {"unit": 19, "title": "Was và were", "english": "Past simple: be; Wh- questions in the present and past", "blocks": [{"type": "example", "text": "I was late home and my dinner was cold."}, {"type": "example", "text": "My mum wasn’t very happy."}, {"type": "example", "text": "Jane and Isaac weren’t at home last night. They were at a concert."}, {"type": "meaning", "text": "Dấu / phân cách những chủ ngữ lựa chọn; trong câu thực tế chọn một chủ ngữ phù hợp, đổi đại từ khi cần."}]}, {"unit": 19, "title": "Câu hỏi Wh- ở hiện tại và quá khứ", "english": "Past simple: be; Wh- questions in the present and past", "blocks": [{"type": "table", "rows": [["Từ hỏi", "Ví dụ"], ["Who? (ai)", "Who is your best friend?"], ["What? (gì)", "What was your first word?"], ["When? (khi nào)", "When was Freya’s birthday?"], ["Where? (ở đâu)", "Where were you last week?"], ["Why? (tại sao)", "Why were you sad yesterday?"]]}]}, {"unit": 19, "title": "Câu hỏi Wh- ở hiện tại và quá khứ", "english": "Past simple: be; Wh- questions in the present and past", "blocks": [{"type": "table", "rows": [["Từ hỏi", "Ví dụ"], ["What kind of? (loại gì)", "What kind of music do you like?"], ["How? (như thế nào)", "How are you?"]]}]}, {"unit": 19, "title": "Trả lời đúng thông tin được hỏi", "english": "Past simple: be; Wh- questions in the present and past", "blocks": [{"type": "text", "text": "Không thể chỉ dùng Yes/No để trả lời câu hỏi Wh-. Cần cung cấp thông tin mà từ để hỏi yêu cầu."}, {"type": "example", "text": "How is your mum? She’s fine, thanks."}, {"type": "meaning", "text": "Lỗi cần tránh khi trả lời câu hỏi trên: Yes, thanks."}]}, {"unit": 20, "title": "Khẳng định và phủ định", "english": "Past simple", "blocks": [{"type": "text", "text": "Với động từ có quy tắc, tạo quá khứ đơn bằng cách thêm -ed. Dạng quá khứ giống nhau với mọi chủ ngữ. Phủ định dùng didn’t (did not) + động từ nguyên mẫu, không giữ đuôi -ed."}]}, {"unit": 20, "title": "Khẳng định và phủ định", "english": "Past simple", "blocks": [{"type": "table", "rows": [["Dạng câu", "Cấu trúc"], ["Khẳng định", "I/You/He/She/It/We/They worked."], ["Phủ định", "I/You/He/She/It/We/They didn’t (did not) work."]]}]}, {"unit": 20, "title": "Ví dụ", "english": "Past simple", "blocks": [{"type": "example", "text": "Richard lived in Italy until 2013."}, {"type": "example", "text": "Becky worked in a hospital."}, {"type": "example", "text": "We didn’t want to go out because it was raining."}, {"type": "example", "text": "I didn’t walk to school yesterday."}]}]},units=data.units,meta=data.meta;const $=x=>document.getElementById(x);const stage=$('stage');const slides=[],unitFirst={};let current=0,isReading=false,readsize=19;const KEY='adam-prepare-1-v3';
function el(tag,cls,text){let x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function label(u){return u==='Starter'?'STARTER':'UNIT '+u}
function block(b){if(b.type==='table'){let t=el('table'),h=el('thead'),r=el('tr');b.rows[0].forEach(x=>r.append(el('th','',x)));h.append(r);t.append(h);let tb=el('tbody');b.rows.slice(1).forEach(row=>{let tr=el('tr');row.forEach(x=>tr.append(el('td','',x)));tb.append(tr)});t.append(tb);return t}return el('p',b.type,b.text)}
function make(unit,title,english,kind=''){let n=el('section','slide measuring '+kind);n.dataset.unit=unit;n.append(el('p','eyebrow',unit===0?meta.brand:label(unit)),el('h1','',title),el('p','sub',english));let body=el('div','body');n.append(body);let foot=el('div','foot');foot.append(el('span','',meta.brand+' • '+meta.teacher),el('span','num'));n.append(foot);stage.append(n);return {node:n,body,unit,title}}
function commit(s){if(!s)return;s.node.classList.remove('measuring');slides.push(s)}
function fits(s){return s.body.offsetTop+s.body.scrollHeight<=965}
let cover=make(0,meta.title,'Bài giảng ngữ pháp tiếng Anh','cover');cover.body.append(el('p','text','Cấu trúc • Cách dùng • Ví dụ • Lưu ý'),el('p','meaning','Chọn Unit để học. Dùng chế độ Đọc bài trên điện thoại hoặc Trình chiếu trên TV.'));commit(cover);
for(const u of units){unitFirst[u.unit]=slides.length;let intro=make(u.unit,u.title,u.english,'unitcover');intro.body.append(el('p','meaning','Grammar Reference • Trang '+u.source_page));commit(intro);for(const p of data.pages.filter(p=>p.unit===u.unit)){let s=make(u.unit,p.title,p.english);s.section=p.title;p.blocks.forEach(b=>s.body.append(block(b)));commit(s)}}
slides.forEach((s,i)=>s.node.querySelector('.num').textContent=(i+1)+' / '+slides.length);
function show(i){current=Math.max(0,Math.min(i,slides.length-1));slides.forEach((s,j)=>s.node.classList.toggle('active',j===current));$('counter').textContent=(current+1)+' / '+slides.length;$('unit').value=String(slides[current].unit);$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;save()}
function scale(){const v=$('viewport');stage.style.transform='scale('+Math.min(v.clientWidth/1920,v.clientHeight/1080)+')'}
function save(){try{localStorage.setItem(KEY,JSON.stringify({current,readsize,mode:isReading?'reading':'slides',y:isReading?window.scrollY:0}))}catch(e){}}
let o=el('option','','Trang mở đầu');o.value='0';$('unit').append(o);for(const u of units){let o=el('option','',label(u.unit)+' · '+u.title);o.value=u.unit;$('unit').append(o)}
function reading(){let hero=el('div','readhero');hero.append(el('p','eyebrow',meta.brand),el('h1','',meta.title),el('p','',meta.source_note),el('p','readhelp','Chọn Unit bằng nút ☰. Dùng A− và A+ để điều chỉnh cỡ chữ. Vuốt ngang bảng rộng để xem đầy đủ.'));$('reading').append(hero);
 for(const u of units){let a=el('article','readunit');a.id='read-'+u.unit;a.append(el('p','eyebrow',label(u.unit)),el('h2','',u.title),el('p','sub',u.english+' • Trang '+u.source_page));for(const [si,sec] of u.sections.entries()){let s=el('section','readsection');s.id='readsec-'+u.unit+'-'+si;s.append(el('h3','',sec.title));for(const b of sec.blocks){let x=block(b);if(b.type==='table'){let wrap=el('div','scrolltable');wrap.append(x);s.append(wrap)}else s.append(x)}a.append(s)}$('reading').append(a)}
 $('reading').append(el('p','readhelp',meta.brand+' • '+meta.teacher))}
reading();
function currentReadUnit(){let found=units[0].unit;for(const u of units){if($('read-'+u.unit).getBoundingClientRect().top<160)found=u.unit}return found}
function mode(read,restoreY=null){let u=isReading?currentReadUnit():slides[current].unit;let sec=isReading?Array.from(document.querySelectorAll('.readsection')).filter(s=>s.getBoundingClientRect().top<180).at(-1)?.querySelector('h3')?.textContent:slides[current].section;isReading=read;document.body.classList.toggle('reading',read);document.documentElement.classList.toggle('reading',read);$('mode').textContent=read?'Trình chiếu':'Đọc bài';if(read){requestAnimationFrame(()=>{if(restoreY!==null)window.scrollTo(0,restoreY);else if(u!==0){let si=units.find(x=>x.unit===u)?.sections.findIndex(x=>x.title===sec);($(si>=0?'readsec-'+u+'-'+si:'read-'+u))?.scrollIntoView();}else window.scrollTo(0,0);save()})}else{show(slides.findIndex(s=>s.unit===u&&s.section===sec)>=0?slides.findIndex(s=>s.unit===u&&s.section===sec):(unitFirst[u]??current));scale();save()}}
function list(){let q=$('search').value.toLocaleLowerCase('vi');$('listing').replaceChildren();for(const u of units){let text=label(u.unit)+' · '+u.title+' · '+u.english;if(!(text+' '+u.sections.map(s=>s.title).join(' ')).toLocaleLowerCase('vi').includes(q))continue;let b=el('button','',text);b.onclick=()=>{$('toc').close();if(isReading)$('read-'+u.unit).scrollIntoView({behavior:'smooth'});else show(unitFirst[u.unit])};$('listing').append(b)}}
function menu(){list();$('toc').showModal();$('search').focus()}function theme(){document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Nền sáng':'Nền tối'}async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.documentElement.webkitRequestFullscreen)document.documentElement.webkitRequestFullscreen();}catch(e){}}
$('menu').onclick=menu;$('close').onclick=()=>$('toc').close();$('search').oninput=list;$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('unit').onchange=e=>show(e.target.value==='0'?0:unitFirst[e.target.value]);$('mode').onclick=()=>mode(!isReading);$('theme').onclick=theme;$('full').onclick=full;
function font(delta){readsize=Math.max(15,Math.min(28,readsize+delta));document.documentElement.style.setProperty('--read',readsize+'px');save()}$('smaller').onclick=()=>font(-1);$('larger').onclick=()=>font(1);
document.addEventListener('keydown',e=>{if($('toc').open||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;let k=e.key.toLowerCase();if(k==='m')menu();else if(k==='t')theme();else if(k==='b')document.body.classList.toggle('blank');else if(k==='f')full();else if(!isReading){if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();show(current+1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();show(current-1)}else if(k==='home'){e.preventDefault();show(0)}else if(k==='end'){e.preventDefault();show(slides.length-1)}}});
let sx=null;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(sx!==null&&Math.abs(dx)>60)show(current+(dx<0?1:-1));sx=null},{passive:true});$('blackout').onclick=()=>document.body.classList.remove('blank');window.addEventListener('resize',scale);document.addEventListener('fullscreenchange',scale);let timer;window.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(save,180)},{passive:true});let stored=null;try{stored=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(stored){readsize=stored.readsize||19;document.documentElement.style.setProperty('--read',readsize+'px');current=stored.current||0}show(current);scale();mode(stored?stored.mode==='reading':matchMedia('(max-width:760px)').matches,stored?.mode==='reading'?stored.y:null);window.deck={slides,units,show,unitFirst,mode};
</script></body></html>
