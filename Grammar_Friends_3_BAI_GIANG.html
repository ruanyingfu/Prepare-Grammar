'use strict';
const units=[{"unit": 1, "english": "Starter • My family", "title": "Starter • Gia đình của em", "source_page": "4, 6", "sections": [{"title": "Tính từ so sánh hơn", "blocks": [{"type": "text", "text": "Thêm -er vào cuối tính từ để tạo dạng so sánh hơn trong các từ dưới đây. Riêng big → bigger."}, {"type": "table", "rows": [["Tính từ", "So sánh hơn"], ["small", "smaller"], ["loud", "louder"], ["quiet", "quieter"], ["fast", "faster"], ["slow", "slower"], ["old", "older"], ["young", "younger"], ["tall", "taller"], ["short", "shorter"], ["big", "bigger"]]}, {"type": "text", "text": "Dùng so sánh hơn để diễn tả sự khác biệt giữa hai vật hoặc hai người. Khi so sánh trực tiếp, đặt than sau tính từ so sánh hơn."}, {"type": "example", "text": "Dad is taller than Mum."}, {"type": "example", "text": "Grandma and Grandpa are older than Charlie, Molly and Harry."}, {"type": "example", "text": "The horse is bigger than the donkey."}]}, {"title": "Quá khứ đơn của be", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định / viết tắt"], ["I", "I was", "I was not / I wasn’t"], ["you", "you were", "you were not / you weren’t"], ["he", "he was", "he was not / he wasn’t"], ["she", "she was", "she was not / she wasn’t"], ["it", "it was", "it was not / it wasn’t"], ["we", "we were", "we were not / we weren’t"], ["they", "they were", "they were not / they weren’t"]]}, {"type": "text", "text": "Dùng be ở quá khứ với tính từ để nói về cảm xúc; để xác định người hoặc vật; hoặc với địa điểm để nói nơi một sự việc xảy ra."}, {"type": "example", "text": "Yesterday, Molly was at school. Charlie wasn’t at school yesterday."}, {"type": "example", "text": "I was tired. He was busy. They weren’t angry."}, {"type": "example", "text": "Terry and Steven were policemen. Anna was a doctor."}, {"type": "example", "text": "Olly was at school. Grandma and Grandpa were in the shop."}]}]}, {"unit": 2, "english": "Unit 1 • My friends", "title": "Unit 1 • Bạn bè của em", "source_page": "8, 10", "sections": [{"title": "Hiện tại đơn: be", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định / viết tắt", "Phủ định / viết tắt"], ["I", "I am / I'm", "I am not / I'm not"], ["you", "you are / you're", "you are not / you aren't"], ["he", "he is / he's", "he is not / he isn't"], ["she", "she is / she's", "she is not / she isn't"], ["it", "it is / it's", "it is not / it isn't"], ["we", "we are / we're", "we are not / we aren't"], ["they", "they are / they're", "they are not / they aren't"]]}, {"type": "example", "text": "Where are you from? I’m from Spain."}, {"type": "example", "text": "Where are you from? I’m from the UK."}]}, {"title": "Câu hỏi và trả lời ngắn", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Am I?", "Yes, I am.", "No, I'm not."], ["Are you?", "Yes, you are.", "No, you aren’t."], ["Is he?", "Yes, he is.", "No, he isn’t."], ["Is she?", "Yes, she is.", "No, she isn’t."], ["Is it?", "Yes, it is.", "No, it isn’t."], ["Are we?", "Yes, we are.", "No, we aren’t."], ["Are they?", "Yes, they are.", "No, they aren’t."]]}, {"type": "text", "text": "Dùng where (ở đâu), when (khi nào), why (tại sao), what (cái gì), who (ai), which (nào) và how old (bao nhiêu tuổi) với be để hỏi thông tin. Từ để hỏi đứng đầu câu."}, {"type": "example", "text": "Where are you from? How old is she?"}, {"type": "text", "text": "Trong dạng câu hỏi của bài này, có thể dùng dạng rút gọn với he, she, it; không dùng dạng rút gọn với I, you, we, they."}, {"type": "example", "text": "Where’s he from? He’s from Egypt."}, {"type": "example", "text": "Where are they from? They’re from Brazil."}, {"type": "example", "text": "Are they from Egypt? Yes, they are."}]}]}, {"unit": 3, "english": "Unit 2 • My hobbies", "title": "Unit 2 • Sở thích của em", "source_page": "12, 14", "sections": [{"title": "Like + động từ -ing", "blocks": [{"type": "text", "text": "Dùng like + động từ -ing ở hiện tại đơn để nói về hoạt động mình thích hoặc không thích làm."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định / viết tắt"], ["I", "I like playing", "I do not like playing / I don’t like playing"], ["you", "you like playing", "you do not like playing / you don’t like playing"], ["he", "he likes playing", "he does not like playing / he doesn’t like playing"], ["she", "she likes playing", "she does not like playing / she doesn’t like playing"], ["it", "it likes playing", "it does not like playing / it doesn’t like playing"], ["we", "we like playing", "we do not like playing / we don’t like playing"], ["they", "they like playing", "they do not like playing / they don’t like playing"]]}, {"type": "example", "text": "I like playing computer games. I don’t like playing computer games."}, {"type": "example", "text": "Charlie likes playing computer games. Harry doesn’t like playing computer games."}, {"type": "example", "text": "I like reading. She doesn’t like playing the piano."}]}, {"title": "Câu hỏi và trả lời ngắn", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Do I like playing?", "Yes, I do.", "No, I don’t."], ["Do you like playing?", "Yes, you do.", "No, you don’t."], ["Does he like playing?", "Yes, he does.", "No, he doesn’t."], ["Does she like playing?", "Yes, she does.", "No, she doesn’t."], ["Does it like playing?", "Yes, it does.", "No, it doesn’t."], ["Do we like playing?", "Yes, we do.", "No, we don’t."], ["Do they like playing?", "Yes, they do.", "No, they don’t."]]}, {"type": "text", "text": "Không lặp lại động từ -ing trong câu trả lời ngắn."}, {"type": "example", "text": "Do you like skateboarding? Yes, I do. / No, I don’t."}, {"type": "example", "text": "Jamie, do you like reading? No, I don’t."}, {"type": "example", "text": "Does Polly like cooking? Yes, she does."}]}]}, {"unit": 4, "english": "Unit 3 • Our things", "title": "Unit 3 • Đồ dùng của chúng em", "source_page": "16, 19", "sections": [{"title": "Can: khả năng, xin phép và nhờ giúp", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Can I …?", "Yes, I can.", "No, I can’t."], ["Can you …?", "Yes, you can.", "No, you can’t."], ["Can he …?", "Yes, he can.", "No, he can’t."], ["Can she …?", "Yes, she can.", "No, she can’t."], ["Can it …?", "Yes, it can.", "No, it can’t."], ["Can we …?", "Yes, we can.", "No, we can’t."], ["Can they …?", "Yes, they can.", "No, they can’t."]]}, {"type": "text", "text": "Can thường diễn tả khả năng làm một việc."}, {"type": "example", "text": "I can play the guitar."}, {"type": "text", "text": "Dùng Can I …? hoặc Can we …? để xin phép làm một việc."}, {"type": "example", "text": "Can I ride your bike? Can we turn on the television?"}, {"type": "text", "text": "Dùng Can you …? để nhờ ai làm việc gì. Có thể thêm dấu phẩy và please ở cuối câu để lịch sự hơn."}, {"type": "example", "text": "Can you buy some bread? Can you turn off the radio, please?"}, {"type": "text", "text": "Khi trả lời người xin phép, dùng you trong câu trả lời ngắn."}, {"type": "example", "text": "Can I use the computer? Yes, you can."}]}, {"title": "Tính từ sở hữu", "blocks": [{"type": "table", "rows": [["Từ", "Nghĩa"], ["my", "của tôi"], ["your", "của bạn / các bạn"], ["his", "của anh ấy"], ["her", "của cô ấy"], ["its", "của nó"], ["our", "của chúng tôi / chúng ta"], ["their", "của họ"]]}, {"type": "example", "text": "This is my DVD. That’s your CD player."}]}]}, {"unit": 5, "english": "Unit 4 • At the seaside", "title": "Unit 4 • Ở bờ biển", "source_page": "22–24", "sections": [{"title": "Cách viết động từ -ing", "blocks": [{"type": "table", "rows": [["Loại động từ", "Quy tắc", "Ví dụ"], ["Phần lớn động từ", "Thêm -ing", "play → playing"], ["Kết thúc bằng phụ âm + e", "Bỏ e, thêm -ing", "write → writing"], ["Kết thúc bằng một nguyên âm + một phụ âm, trừ y hoặc w", "Gấp đôi phụ âm, thêm -ing", "snorkel → snorkelling"]]}, {"type": "example", "text": "Charlie is helping his dad."}]}, {"title": "Hiện tại tiếp diễn: khẳng định", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định / viết tắt", "Phủ định / viết tắt"], ["I", "I am playing / I'm playing", "I am not playing / I'm not playing"], ["you", "you are playing / you're playing", "you are not playing / you aren't playing"], ["he", "he is playing / he's playing", "he is not playing / he isn't playing"], ["she", "she is playing / she's playing", "she is not playing / she isn't playing"], ["it", "it is playing / it's playing", "it is not playing / it isn't playing"], ["we", "we are playing / we're playing", "we are not playing / we aren't playing"], ["they", "they are playing / they're playing", "they are not playing / they aren't playing"]]}, {"type": "text", "text": "Dùng hiện tại tiếp diễn cho việc đang xảy ra ngay lúc nói, hoặc việc diễn ra tạm thời trong khoảng thời gian quanh hiện tại. Không dùng thì này cho các việc xảy ra thường xuyên trong cách dùng của bài."}, {"type": "example", "text": "Mum is making sandwiches."}, {"type": "example", "text": "She’s talking to someone on the phone at the moment."}, {"type": "example", "text": "I’m staying at my aunt’s house for two months."}, {"type": "text", "text": "Không dùng dạng rút gọn sau hai tên riêng. Có thể rút gọn sau đại từ hoặc một tên riêng."}, {"type": "example", "text": "Eric and Charlie are playing volleyball."}, {"type": "example", "text": "They’re playing volleyball. John’s playing volleyball."}]}, {"title": "Hiện tại tiếp diễn: phủ định", "blocks": [{"type": "formula", "text": "Chủ ngữ + am / is / are + not + động từ -ing"}, {"type": "example", "text": "Mum isn’t snorkelling."}]}]}, {"unit": 6, "english": "Unit 5 • A visit to the zoo", "title": "Unit 5 • Thăm sở thú", "source_page": "26", "sections": [{"title": "Hiện tại tiếp diễn: câu hỏi", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Am I playing?", "Yes, I am.", "No, I'm not."], ["Are you playing?", "Yes, you are.", "No, you aren’t."], ["Is he playing?", "Yes, he is.", "No, he isn’t."], ["Is she playing?", "Yes, she is.", "No, she isn’t."], ["Is it playing?", "Yes, it is.", "No, it isn’t."], ["Are we playing?", "Yes, we are.", "No, we aren’t."], ["Are they playing?", "Yes, they are.", "No, they aren’t."]]}, {"type": "text", "text": "Không lặp động từ -ing trong câu trả lời ngắn. Luôn dùng đại từ thay cho tên người trong câu trả lời ngắn."}, {"type": "example", "text": "Is it eating? Yes, it is."}, {"type": "example", "text": "Are they swimming? No, they aren’t."}, {"type": "example", "text": "Are you watching TV? No, we aren’t."}, {"type": "example", "text": "Is John playing in the garden? Yes, he is."}, {"type": "example", "text": "Are Mum and Dad playing chess? No, they aren’t."}]}]}, {"unit": 7, "english": "Unit 6 • My day", "title": "Unit 6 • Một ngày của em", "source_page": "30, 32", "sections": [{"title": "Ôn hiện tại đơn", "blocks": [{"type": "text", "text": "Dùng hiện tại đơn để nói về thói quen và việc làm đều đặn; sự thật và điều luôn đúng; hoặc ý kiến."}, {"type": "example", "text": "I get up at 7 o’clock. I get dressed at 7.25. I brush my teeth at 7.45."}, {"type": "example", "text": "We walk to school. London is the capital of England. I don’t like cricket."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định / viết tắt"], ["I", "I play", "I do not play / I don’t play"], ["you", "you play", "you do not play / you don’t play"], ["he", "he plays", "he does not play / he doesn’t play"], ["she", "she plays", "she does not play / she doesn’t play"], ["it", "it plays", "it does not play / it doesn’t play"], ["we", "we play", "we do not play / we don’t play"], ["they", "they play", "they do not play / they don’t play"]]}, {"type": "table", "rows": [["Động từ", "Quy tắc với he / she / it", "Ví dụ"], ["Phần lớn", "Thêm -s", "play → plays"], ["Phụ âm + y", "Đổi y thành -ies", "study → studies"], ["Tận cùng -s, -ch, -sh, -x, -o, -z", "Thêm -es", "watch → watches"]]}, {"type": "text", "text": "Một số động từ không theo quy tắc thông thường, như have, can và be."}]}, {"title": "Câu hỏi hiện tại đơn", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Do I like milk?", "Yes, I do.", "No, I don’t."], ["Do you like milk?", "Yes, you do.", "No, you don’t."], ["Does he like milk?", "Yes, he does.", "No, he doesn’t."], ["Does she like milk?", "Yes, she does.", "No, she doesn’t."], ["Does it like milk?", "Yes, it does.", "No, it doesn’t."], ["Do we like milk?", "Yes, we do.", "No, we don’t."], ["Do they like milk?", "Yes, they do.", "No, they don’t."]]}, {"type": "text", "text": "Chú ý dùng does và động từ nguyên mẫu với he, she."}, {"type": "example", "text": "Does Richard brush his teeth before school?"}, {"type": "example", "text": "Do you play outside every day? Yes, I do."}]}, {"title": "Hiện tại đơn: have", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định", "Câu hỏi"], ["I", "I have", "I don’t have", "Do I have?"], ["you", "you have", "you don’t have", "Do you have?"], ["he", "he has", "he doesn’t have", "Does he have?"], ["she", "she has", "she doesn’t have", "Does she have?"], ["it", "it has", "it doesn’t have", "Does it have?"], ["we", "we have", "we don’t have", "Do we have?"], ["they", "they have", "they don’t have", "Do they have?"]]}, {"type": "text", "text": "Câu trả lời ngắn giống như với các động từ thông thường."}, {"type": "example", "text": "In my family, we have dinner at 7.30 every evening."}, {"type": "example", "text": "Do you have dinner at 7.30? Yes, we do."}]}]}, {"unit": 8, "english": "Unit 7 • Free time", "title": "Unit 7 • Thời gian rảnh", "source_page": "36, 38", "sections": [{"title": "Trạng từ chỉ tần suất", "blocks": [{"type": "text", "text": "Dùng trạng từ chỉ tần suất để nói mức độ thường xuyên của một việc. Các từ này thường đi với hiện tại đơn."}, {"type": "table", "rows": [["Trạng từ", "Nghĩa", "Ví dụ"], ["always", "luôn luôn", "Ben’s always late."], ["usually", "thường", "Amy’s usually late."], ["often", "hay / thường xuyên", "Mike’s often late."], ["sometimes", "thỉnh thoảng", "Tod’s sometimes late."], ["never", "không bao giờ", "Sue’s never late."]]}, {"type": "text", "text": "Không dùng never trong câu đã có dạng phủ định. Trạng từ thường đứng trước động từ thường, sau be; trong câu phủ định, đứng sau don’t / doesn’t."}, {"type": "example", "text": "He never goes to the sports centre. She always arrives late."}, {"type": "example", "text": "Jane sometimes goes to school by bus. I don’t often buy souvenirs."}, {"type": "example", "text": "We are usually asleep at 9 o’clock."}, {"type": "text", "text": "Có thể dùng ever trong câu hỏi để hỏi người đó có khi nào làm một việc không."}, {"type": "example", "text": "Do you ever go to the sports centre?"}]}, {"title": "Các cụm chỉ thời gian", "blocks": [{"type": "table", "rows": [["Giới từ", "Cách dùng và ví dụ"], ["in", "Tháng, năm: in June, in 2025"], ["on", "Ngày trong tuần: on Wednesday, on Saturday"], ["on + ngày số nhiều", "Lặp mỗi tuần: on Wednesdays, on Saturdays"], ["at", "Giờ: at 6 o’clock, at midnight, at 7.15"]]}, {"type": "text", "text": "Trong ngữ cảnh kế hoạch của bài, on Wednesday / on Saturday chỉ thứ Tư / thứ Bảy sắp tới; on Wednesdays / on Saturdays nghĩa là mỗi thứ Tư / thứ Bảy."}, {"type": "example", "text": "My birthday’s in March. It’s her birthday on Wednesday."}, {"type": "example", "text": "She always goes to the library on Tuesdays. School starts at 8 o’clock."}, {"type": "example", "text": "I’m meeting Mary today at 3 o’clock."}, {"type": "example", "text": "I go swimming on Wednesdays, and on Thursday I’m going to the cinema."}]}]}, {"unit": 9, "english": "Unit 8 • Going shopping", "title": "Unit 8 • Đi mua sắm", "source_page": "40, 42", "sections": [{"title": "Danh từ đếm được và không đếm được", "blocks": [{"type": "text", "text": "Danh từ đếm được có dạng số ít và số nhiều. Dùng a trước phụ âm, an trước nguyên âm trong các ví dụ của bài (a, e, i, o, u)."}, {"type": "table", "rows": [["Số ít", "Số nhiều"], ["a cat / an orange", "some cats / some oranges"], ["", "two cats / two oranges"]]}, {"type": "example", "text": "We need a melon and some apples."}, {"type": "text", "text": "Danh từ không đếm được trong bài không có dạng số nhiều, diễn tả lượng của những thứ như thức ăn và đồ uống: rice, fruit, asparagus, water, coffee. Dùng some trước các danh từ này; không dùng a hoặc an."}, {"type": "example", "text": "I’d like some asparagus. We’d like some water, please."}, {"type": "text", "text": "Với đồ uống có thể dùng a glass of (một cốc), a cup of (một tách), a bottle of (một chai), a can of (một lon)."}, {"type": "example", "text": "I’d like a bottle of water, please."}, {"type": "text", "text": "Một số thức ăn có thể được dùng vừa như danh từ đếm được, vừa như danh từ không đếm được."}, {"type": "example", "text": "some melon / a melon; some ice cream / an ice cream"}]}, {"title": "Would like: muốn", "blocks": [{"type": "text", "text": "Trong quán cà phê hoặc cửa hàng, thường dùng would like để nói mình muốn gì. Dạng rút gọn là ’d like."}, {"type": "table", "rows": [["Dạng đầy đủ", "Dạng rút gọn"], ["I would like", "I’d like"], ["you would like", "you’d like"], ["he would like", "he’d like"], ["she would like", "she’d like"], ["it would like", "it’d like"], ["we would like", "we’d like"], ["they would like", "they’d like"]]}, {"type": "example", "text": "We’d like some grapes, please."}, {"type": "example", "text": "I’d like some tea. He’d like an apple."}, {"type": "table", "rows": [["Câu hỏi"], ["Would I like?"], ["Would you like?"], ["Would he like?"], ["Would she like?"], ["Would it like?"], ["Would we like?"], ["Would they like?"]]}, {"type": "text", "text": "Thường trả lời câu hỏi Would you like …? bằng Yes, please hoặc No, thanks."}, {"type": "example", "text": "Would you like an apple? Yes, please."}, {"type": "example", "text": "Would you like some grapes? Yes, please. / No, thanks."}, {"type": "text", "text": "Phân biệt would like (muốn ở thời điểm này) với like (thích nói chung)."}, {"type": "example", "text": "I’d like an ice cream. (= I want an ice cream now.)"}, {"type": "example", "text": "I like ice cream. (= I always like ice cream.)"}]}]}, {"unit": 10, "english": "Unit 9 • Comparisons", "title": "Unit 9 • So sánh", "source_page": "44, 46", "sections": [{"title": "So sánh hơn", "blocks": [{"type": "text", "text": "Thông thường, thêm -er vào cuối tính từ ngắn để tạo so sánh hơn."}, {"type": "table", "rows": [["Tính từ", "So sánh hơn"], ["long", "longer"], ["small", "smaller"], ["high", "higher"], ["short", "shorter"], ["deep", "deeper"], ["slow", "slower"]]}, {"type": "table", "rows": [["Đuôi tính từ", "Quy tắc", "Ví dụ"], ["-e", "Thêm -r", "wide → wider"], ["Phụ âm + nguyên âm + phụ âm", "Gấp đôi phụ âm cuối, thêm -er", "big → bigger"]]}, {"type": "text", "text": "Dùng than khi so sánh trực tiếp hai vật, địa điểm hoặc người."}, {"type": "example", "text": "This cake is bigger. This cake is smaller than that cake."}, {"type": "example", "text": "Cairo is bigger than London. Charlie is taller than Harry."}]}, {"title": "So sánh nhất", "blocks": [{"type": "text", "text": "Thêm -est hoặc -st vào tính từ ngắn để tạo dạng so sánh nhất."}, {"type": "table", "rows": [["Tính từ", "So sánh nhất"], ["long", "longest"], ["small", "smallest"], ["high", "highest"], ["short", "shortest"], ["deep", "deepest"], ["slow", "slowest"]]}, {"type": "table", "rows": [["Đuôi tính từ", "Quy tắc", "Ví dụ"], ["-e", "Thêm -st", "wide → widest"], ["Phụ âm + nguyên âm + phụ âm", "Gấp đôi phụ âm cuối, thêm -est", "big → biggest"]]}, {"type": "text", "text": "Trong các cấu trúc của bài, đặt the trước tính từ so sánh nhất. Có thể dùng in the world (trên thế giới) với so sánh nhất."}, {"type": "example", "text": "That cake is the biggest. Dad is the tallest. The yellow car is the fastest."}, {"type": "example", "text": "Which is the highest mountain in the world?"}, {"type": "example", "text": "The river Amazon is the longest river in the world."}]}]}, {"unit": 11, "english": "Unit 10 • Play time", "title": "Unit 10 • Giờ vui chơi", "source_page": "50, 52", "sections": [{"title": "Must: phải", "blocks": [{"type": "text", "text": "Dùng must + động từ nguyên mẫu không to để nói việc người khác phải làm. Đôi khi you chỉ mọi người nói chung. Must thường dùng với you nhưng có thể dùng với các chủ ngữ khác; không thêm -s với he, she."}, {"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định / viết tắt"], ["I", "I must", "I must not / I mustn’t"], ["you", "you must", "you must not / you mustn’t"], ["he", "he must", "he must not / he mustn’t"], ["she", "she must", "she must not / she mustn’t"], ["it", "it must", "it must not / it mustn’t"], ["we", "we must", "we must not / we mustn’t"], ["they", "they must", "they must not / they mustn’t"]]}, {"type": "example", "text": "You must stay near the playground. You must play nicely."}, {"type": "example", "text": "Jane must try to improve her spelling."}]}, {"title": "Mustn’t và câu mệnh lệnh", "blocks": [{"type": "text", "text": "Dùng mustn’t + động từ nguyên mẫu để nói việc không được làm."}, {"type": "example", "text": "You mustn’t play in the fountain. We mustn’t talk in class."}, {"type": "text", "text": "Để ra lệnh trực tiếp, dùng động từ nguyên mẫu không to. Câu mệnh lệnh thường xuất hiện trên biển báo và thông báo."}, {"type": "example", "text": "Stay near the playground. Play nicely."}, {"type": "text", "text": "Mệnh lệnh phủ định dùng don’t + động từ nguyên mẫu không to."}, {"type": "example", "text": "Don’t talk in class. Don’t drop litter."}]}]}, {"unit": 12, "english": "Unit 11 • Past times", "title": "Unit 11 • Những thời điểm đã qua", "source_page": "54, 56", "sections": [{"title": "There was / there were", "blocks": [{"type": "text", "text": "There was và there were là dạng quá khứ của there is và there are."}, {"type": "table", "rows": [["Khẳng định", "Phủ định / viết tắt"], ["there was + danh từ số ít", "there was not / there wasn’t"], ["there were + danh từ số nhiều", "there were not / there weren’t"]]}, {"type": "text", "text": "Sau there were dùng số đếm hoặc some. Với there wasn’t + danh từ không đếm được, dùng any; với danh từ đếm được, dùng a, an hoặc số đếm phù hợp. Sau there weren’t dùng any hoặc số đếm."}, {"type": "example", "text": "There was a small tree in the park. There weren’t any noisy cars or buses."}, {"type": "example", "text": "There was a big park near here. There were some old cars in the museum."}, {"type": "example", "text": "There wasn’t a bus stop outside. There weren’t any computers."}]}, {"title": "Was there …? / Were there …?", "blocks": [{"type": "text", "text": "Sau Was there …? dùng a / an với danh từ đếm được, any với danh từ không đếm được. Sau Were there …? dùng any hoặc số đếm. Không lặp danh từ trong câu trả lời ngắn."}, {"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Was there …?", "Yes, there was.", "No, there wasn’t."], ["Were there …?", "Yes, there were.", "No, there weren’t."]]}, {"type": "example", "text": "Were there any computers? No, there weren’t."}, {"type": "example", "text": "Were there any trams?"}, {"type": "example", "text": "Was there a train station near here? Yes, there was. / No, there wasn’t."}]}, {"title": "Cụm thời gian trong quá khứ", "blocks": [{"type": "text", "text": "Dùng last, yesterday và on để nói về thời điểm cụ thể trong quá khứ. Last đi với danh từ; yesterday đứng một mình hoặc đi với từ chỉ buổi; on đi với ngày trong tuần."}, {"type": "example", "text": "last week, last month, last year, last March, last Friday, last night"}, {"type": "example", "text": "yesterday morning, yesterday afternoon, yesterday evening"}, {"type": "example", "text": "On Friday, I stayed with Sophie."}]}]}, {"unit": 13, "english": "Unit 12 • Family memories", "title": "Unit 12 • Kỷ niệm gia đình", "source_page": "58, 61", "sections": [{"title": "Quá khứ đơn: have", "blocks": [{"type": "text", "text": "Dùng had để nói về ngoạ n?", "Yes, they did.", "No, they didn’t."]]}, {"type": "text", "text": "Phần lớn động từ có quy tắc và bất quy tắc có cùng cách tạo câu hỏi và câu trả lời ngắn ở quá khứ đơn."}, {"type": "example", "text": "Did you have a good day at school? Did you watch a film? Yes, I did."}]}, {"title": "What / where / when", "blocks": [{"type": "text", "text": "Từ để hỏi đứng đầu câu. What hỏi về sự vật hoặc việc làm; where hỏi địa điểm; when hỏi thời gian."}, {"type": "example", "text": "What did you do yesterday? I watched a film in class."}, {"type": "example", "text": "What did you watch last night? A film."}, {"type": "example", "text": "Where did you go yesterday? To the park."}, {"type": "example", "text": "When did the party start? At six o’clock."}]}]}, {"unit": 16, "english": "Unit 15 • Holiday time", "title": "Unit 15 • Kỳ nghỉ", "source_page": "72, 74", "sections": [{"title": "Be going to: kế hoạch và ý định", "blocks": [{"type": "text", "text": "Dùng be going to để nói về kế hoạch và ý định. Không được bỏ động từ be. Thường không dùng dạng rút gọn ’re sau tên riêng."}, {"type": "table", "rows": [["Chủ ngữ", "Dạng đầy đủ", "Dạng rút gọn"], ["I", "I am going to", "I'm going to"], ["you", "you are going to", "you're going to"], ["he", "he is going to", "he's going to"], ["she", "she is going to", "she's going to"], ["it", "it is going to", "it's going to"], ["we", "we are going to", "we're going to"], ["they", "they are going to", "they're going to"]]}, {"type": "example", "text": "They’re going to catch a train. He’s going to be a doctor."}, {"type": "example", "text": "Paul and Steve are going to visit Bob. Mum and I are going to watch TV."}]}, {"title": "Câu hỏi và trả lời ngắn", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Am I going to?", "Yes, I am.", "No, I'm not."], ["Are you going to?", "Yes, you are.", "No, you aren’t."], ["Is he going to?", "Yes, he is.", "No, he isn’t."], ["Is she going to?", "Yes, she is.", "No, she isn’t."], ["Is it going to?", "Yes, it is.", "No, it isn’t."], ["Are we going to?", "Yes, we are.", "No, we aren’t."], ["Are they going to?", "Yes, they are.", "No, they aren’t."]]}, {"type": "text", "text": "Không lặp going to trong câu trả lời ngắn."}, {"type": "example", "text": "Are you going to come? Yes, I am."}, {"type": "example", "text": "Are we going to travel by plane? No, we aren’t."}]}, {"title": "Các cụm thời gian trong tương lai", "blocks": [{"type": "text", "text": "Có thể dùng next, this và tomorrow để nói khi nào dự định làm việc gì. Next kết hợp với nhiều danh từ. Tomorrow đứng một mình hoặc với từ chỉ buổi. Later và soon có thể đứng một mình."}, {"type": "example", "text": "next week, next month, next year, next March, next Friday, next weekend"}, {"type": "example", "text": "tomorrow morning, tomorrow afternoon, tomorrow evening, tomorrow night"}, {"type": "example", "text": "later; soon"}]}]}, {"unit": 17, "english": "Grammar reference", "title": "Bảng tra cứu ngữ pháp", "source_page": "78–80", "sections": [{"title": "Hiện tại đơn: like", "blocks": [{"type": "table", "rows": [["Chủ ngữ", "Khẳng định", "Phủ định", "Câu hỏi"], ["I", "I like", "I don’t like", "Do I like?"], ["you", "you like", "you don’t like", "Do you like?"], ["he", "he likes", "he doesn’t like", "Does he like?"], ["she", "she likes", "she doesn’t like", "Does she like?"], ["it", "it likes", "it doesn’t like", "Does it like?"], ["we", "we like", "we don’t like", "Do we like?"], ["they", "they like", "they don’t like", "Do they like?"]]}]}, {"title": "Quá khứ đơn: have", "blocks": [{"type": "table", "rows": [["Câu hỏi", "Trả lời Yes", "Trả lời No"], ["Did I have?", "Yes, I did.", "No, I didn’t."], ["Did you have?", "Yes, you did.", "No, you didn’t."], ["Did he have?", "Yes, he did.", "No, he didn’t."], ["Did she have?", "Yes, she did.", "No, she didn’t."], ["Did it have?", "Yes, it did.", "No, it didn’t."], ["Did we have?", "Yes, we did.", "No, we didn’t."], ["Did they have?", "Yes, const meta={"book": "Grammar Friends 3", "title": "Grammar Friends 3 • Lý thuyết ngữ pháp", "brand": "ADAM ENGLISH", "teacher": "Tiếng Anh Thầy Phú", "level": "", "source_note": "Grammar Friends 3 • Student’s Book • Oxford University Press, 2009", "filename": "Grammar_Friends_3_Ngu_phap_Viet"};
const stage=document.getElementById('stage'),measure=document.getElementById('measure'),toc=document.getElementById('toc');
let slides=[],current=0;const unitFirst={0:0};let LIMIT=700;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function block(b){
 if(b.type==='table'){const t=el('table');const head=el('thead'),tr=el('tr');b.rows[0].forEach(x=>tr.append(el('th',null,x)));head.append(tr);t.append(head);const body=el('tbody');b.rows.slice(1).forEach(r=>{const tr=el('tr');r.forEach(x=>tr.append(el('td',null,x)));body.append(tr)});t.append(body);return t}
 return el('p',b.type==='text'?'':b.type,b.text);
}
function height(blocks){measure.replaceChildren(...blocks.map(block));return measure.scrollHeight}
function addSlide({unit=0,title,english='',blocks=[],kind='',section=''}){
 const n=el('section','slide '+kind);n.dataset.unit=unit;n.append(el('p','eyebrow',unit?(units.find(u=>u.unit===unit)?.english.split(' • ')[0]||''):meta.brand));
 n.append(el('h1',null,title));n.append(el('p','sub',english));const b=el('div','body');blocks.forEach(x=>b.append(block(x)));n.append(b);
 const f=el('div','footer');f.append(el('span',null,meta.teacher),el('span','pagenum'));n.append(f);stage.append(n);slides.push({node:n,unit,title,section,blocks});
}
function chunks(section,english){
 const head=el('div');head.style.cssText='position:fixed;left:-10000px;width:1708px;visibility:hidden';
 head.append(el('p','eyebrow','UNIT 20'),el('h1',null,section.title),el('p','sub',english+'   ·   10/10'));document.body.append(head);
 const headerHeight=Array.from(head.children).reduce((n,x)=>n+x.getBoundingClientRect().height+parseFloat(getComputedStyle(x).marginBottom),0);
 LIMIT=Math.min(700,970-68-headerHeight);head.remove();
 const out=[];let now=[];
 const flush=()=>{if(now.length){out.push(now);now=[]}};
 const push=b=>{if(now.length&&height([...now,b])>LIMIT)flush();now.push(b);};
 for(let i=0;i<section.blocks.length;i++){
  const b=section.blocks[i];
  if(b.type==='table'){
   let rows=[b.rows[0]];
   for(const r of b.rows.slice(1)){
    const cand={type:'table',rows:[...rows,r]};
    if(rows.length>1&&height([...now,cand])>LIMIT){push({type:'table',rows});flush();rows=[b.rows[0]]}
    rows.push(r);
   }
   if(rows.length>1)push({type:'table',rows});
  }else{
   const group=[b];while(i+1<section.blocks.length&&['example','meaning'].includes(section.blocks[i+1].type))group.push(section.blocks[++i]);
   if(height(group)<=LIMIT){if(now.length&&height([...now,...group])>LIMIT)flush();now.push(...group)}else group.forEach(push);
  }
 }
 flush();return out;
}

function show(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,n)=>s.node.classList.toggle('active',n===current));document.getElementById('counter').textContent=(current+1)+' / '+slides.length;document.getElementById('fill').style.width=((current+1)/slides.length*100)+'%';document.getElementById('unit').value=slides[current].unit;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;history.replaceState(null,'','#slide='+String(current+1));}
function list(){const q=document.getElementById('search').value.toLocaleLowerCase('vi');const target=document.getElementById('listing');target.replaceChildren();slides.forEach((s,i)=>{if(!('Unit '+s.unit+' '+s.title+' '+(units.find(u=>u.unit===s.unit)?.title||'')).toLocaleLowerCase('vi').includes(q))return;const b=el('button');b.append(el('span','listnum',String(i+1)),el('span',null,s.title));b.onclick=()=>{show(i);toc.close()};target.append(b)});}

for(const u of units){const a=el('article');a.id='read-'+u.unit;a.dataset.unit=u.unit;a.append(el('h2',null,u.title),el('p','meaning','Student’s Book • Trang '+u.source_page));for(const sec of u.sections){a.append(el('h3',null,sec.title));sec.blocks.forEach(b=>a.append(block(b)))}reader.append(a)}
function nearest(){let best=units[0].unit;for(const a of reader.querySelectorAll('article'))if(a.getBoundingClientRect().top<150)best=Number(a.dataset.unit);return best}
function mode(on,restore=false){const target=on?(slides[current].unit||1):nearest();reading=on;document.body.classList.toggle('reading',on);document.documentElement.style.overflow=on?'auto':'hidden';document.documentElement.style.height=on?'auto':'100%';document.getElementById('switchmode').textContent=on?'Chế độ Slide':'Chế độ Đọc';if(on){requestAnimationFrame(()=>{if(restore)window.scrollTo(0,Number(get('position')||0));else document.getElementById('read-'+target)?.scrollIntoView()})}else{show(restore?0:(unitFirst[target]||0));window.scrollTo(0,0);scale()} }
document.getElementById('switchmode').onclick=()=>mode(!reading);
function setFont(n){readFont=Math.max(16,Math.min(28,n));reader.style.setProperty('--readsize',readFont+'px');save('font',readFont)}setFont(Number(get('font')||19));document.getElementById('smaller').onclick=()=>setFont(readFont-1);document.getElementById('larger').onclick=()=>setFont(readFont+1);
document.getElementById('readmenu').onclick=()=>{const listing=document.getElementById('listing');listing.replaceChildren();document.getElementById('search').hidden=true;for(const u of units){const btn=el('button',null,u.title);btn.onclick=()=>{toc.close();document.getElementById('read-'+u.unit).scrollIntoView()};listing.append(btn)}toc.showModal()};
const oldOpen=openMenu;openMenu=()=>{document.getElementById('search').hidden=false;oldOpen()};
window.addEventListener('scroll',()=>{if(reading)save('position',window.scrollY)},{passive:true});
document.addEventListener('keydown',e=>{if(reading&&['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(e.key))e.stopImmediatePropagation()},true);
mode(matchMedia('(max-width: 800px)').matches,true);
</script>
</body></html>
